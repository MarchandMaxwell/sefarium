ε.","english":"It is to me.","g":{},"c":{},"turn":true},{"steph":"111e","speaker":"Σωκράτης","greek":"τί δ᾽ εἰ βουληθεῖμεν εἰδέναι, μὴ μόνον ποῖοι ἄνθρωποί εἰσιν, ἀλλ᾽ ὁποῖοι ὑγιεινοὶ ἢ νοσώδεις, ἆρ᾽ ἱκανοὶ ἂν ἡμῖν ἦσαν διδάσκαλοι οἱ πολλοί;","english":"And what if we wanted to know not only what men are like, but what sort are healthy or sick, would the many be competent teachers for us?","g":{},"c":{},"turn":true},{"steph":"111e","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"111e","speaker":"Σωκράτης","greek":"ἦν δ᾽ ἄν σοι τεκμήριον ὅτι μοχθηροί εἰσι τούτων διδάσκαλοι, εἰ ἑώρας αὐτοὺς διαφερομένους;","english":"And it would be proof to you that they are poor teachers of this, if you saw them differing?","g":{},"c":{},"turn":true},{"steph":"111e","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε.","english":"It would.","g":{},"c":{},"turn":true},{"steph":"111e","speaker":"Σωκράτης","greek":"τί δὲ δή; νῦν περὶ τῶν δικαίων καὶ ἀδίκων ἀνθρώπων |112a| καὶ πραγμάτων οἱ πολλοὶ δοκοῦσί σοι ὁμολογεῖν αὐτοὶ ἑαυτοῖς ἢ ἀλλήλοις;","english":"Well then: now, about just and unjust men and actions, do the many seem to you to agree with themselves or with one another?","g":{},"c":{},"turn":true},{"steph":"112a","speaker":"Ἀλκιβιάδης","greek":"ἥκιστα νὴ Δί᾽, ὦ Σώκρατες.","english":"Least of all, by Zeus, Socrates.","g":{},"c":{},"turn":true},{"steph":"112a","speaker":"Σωκράτης","greek":"τί δέ; μάλιστα περὶ αὐτῶν διαφέρεσθαι;","english":"What? To differ about them most of all?","g":{},"c":{},"turn":true},{"steph":"112a","speaker":"Ἀλκιβιάδης","greek":"πολύ γε.","english":"Very much so.","g":{},"c":{},"turn":true},{"steph":"112a","speaker":"Σωκράτης","greek":"οὔκουν οἴομαί γε πώποτέ σε ἰδεῖν οὐδ᾽ ἀκοῦσαι σφόδρα οὕτω διαφερομένους ἀνθρώπους περὶ ὑγιεινῶν καὶ μή, ὥστε διὰ ταῦτα μάχεσθαί τε καὶ ἀποκτεινύναι ἀλλήλους.","english":"I do not think you have ever seen or heard men differ so strongly about what is healthy and what is not that they fight and kill one another over it.","g":{},"c":{},"turn":true},{"steph":"112a","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"112a","speaker":"Σωκράτης","greek":"ἀλλὰ περὶ τῶν δικαίων καὶ ἀδίκων ἔγωγ᾽ οἶδ᾽ ὅτι, |112b| καὶ εἰ μὴ ἑώρακας, ἀκήκοας γοῦν ἄλλων τε πολλῶν καὶ Ὁμήρου· καὶ Ὀδυσσείας γὰρ καὶ Ἰλιάδος ἀκήκοας.","english":"But about what is just and unjust, I know that even if you have not seen it, you have at least heard it from many others, and from Homer; for you have heard the *Odyssey* and the *Iliad*.","g":{},"c":{},"turn":true},{"steph":"112b","speaker":"Ἀλκιβιάδης","greek":"πάντως δήπου, ὦ Σώκρατες.","english":"Of course I have, Socrates.","g":{},"c":{},"turn":true},{"steph":"112b","speaker":"Σωκράτης","greek":"οὐκοῦν ταῦτα ποιήματά ἐστι περὶ διαφορᾶς δικαίων τε καὶ ἀδίκων;","english":"And are not these poems about a difference over what is just and unjust?","g":{},"c":{},"turn":true},{"steph":"112b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"112b","speaker":"Σωκράτης","greek":"καὶ αἱ μάχαι γε καὶ οἱ θάνατοι διὰ ταύτην τὴν διαφορὰν τοῖς τε Ἀχαιοῖς καὶ τοῖς ἄλλοις Τρωσὶν ἐγένοντο, καὶ τοῖς μνηστῆρσι τοῖς τῆς Πηνελόπης καὶ τῷ Ὀδυσσεῖ.","english":"And the battles and the deaths came about because of this difference, for the Achaeans and the Trojans, and for the suitors of Penelope{23} and for Odysseus.","g":{},"c":{"23":["τοῖς μνηστῆρσι τοῖς τῆς Πηνελόπης","The *Iliad* turns on a dispute over a wrong (the taking of Helen, then of Briseis), the *Odyssey* on the suitors’ wrong to Odysseus’ house. Socrates reads Homer as the great record of disagreement about justice."]},"turn":true},{"steph":"112c","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"You are right.","g":{},"c":{},"turn":true},{"steph":"112c","speaker":"Σωκράτης","greek":"οἶμαι δὲ καὶ τοῖς ἐν Τανάγρᾳ Ἀθηναίων τε καὶ Λακεδαιμονίων καὶ Βοιωτῶν ἀποθανοῦσι, καὶ τοῖς ὕστερον ἐν Κορωνείᾳ, ἐν οἷς καὶ ὁ σὸς πατὴρ [Κλεινίας] ἐτελεύτησεν, οὐδὲ περὶ ἑνὸς ἄλλου ἡ διαφορὰ ἢ περὶ τοῦ δικαίου καὶ ἀδίκου τοὺς θανάτους καὶ τὰς μάχας πεποίηκεν· ἦ γάρ;","english":"And I think that for those Athenians, Spartans and Boeotians who died at Tanagra, and those later at Coronea{24}, among whom your father Clinias also met his end, it was over nothing else but the just and the unjust that the difference brought about their deaths and battles. Is that not so?","g":{},"c":{"24":["ἐν Τανάγρᾳ … ἐν Κορωνείᾳ","Tanagra (457 BC): Spartans and Boeotians against Athens. Coronea (447 BC): the Boeotians routed the Athenians, and Alcibiades’ father died there. Socrates makes the argument personal: disagreement about justice killed his father."]},"turn":true},{"steph":"112c","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"You are right.","g":{},"c":{},"turn":true},{"steph":"112c","speaker":"Σωκράτης","greek":"τούτους οὖν φῶμεν ἐπίστασθαι περὶ ὧν οὕτως |112d| σφόδρα διαφέρονται, ὥστε ἀμφισβητοῦντες ἀλλήλοις τὰ ἔσχατα σφᾶς αὐτοὺς ἐργάζονται;","english":"Then shall we say that these people have knowledge of matters on which they differ so violently that in disputing with one another they do the utmost to each other?","g":{},"c":{},"turn":true},{"steph":"112d","speaker":"Ἀλκιβιάδης","greek":"οὐ φαίνεταί γε.","english":"It does not look like it.","g":{},"c":{},"turn":true},{"steph":"112d","speaker":"Σωκράτης","greek":"οὐκοῦν εἰς τοὺς τοιούτους διδασκάλους ἀναφέρεις οὓς ὁμολογεῖς αὐτὸς μὴ εἰδέναι;","english":"And you appeal to teachers of this sort, who you yourself admit do not know?","g":{},"c":{},"turn":true},{"steph":"112d","speaker":"Ἀλκιβιάδης","greek":"ἔοικα.","english":"It seems I do.","g":{},"c":{},"turn":true},{"steph":"112d","speaker":"Σωκράτης","greek":"πῶς οὖν εἰκός σε εἰδέναι τὰ δίκαια καὶ τὰ ἄδικα, περὶ ὧν οὕτω πλανᾷ{a} καὶ οὔτε μαθὼν φαίνῃ παρ᾽ οὐδενὸς οὔτ᾽ αὐτὸς ἐξευρών;","english":"How then is it likely that you know what is just and unjust, when you wander about so on these matters and appear neither to have learned them from anyone nor to have found them out yourself?","g":{"a":["πλανᾷ","2nd sing. present passive of πλανάω, “you wander, go astray”; hence *planet*, the “wandering” star."]},"c":{},"turn":true},{"steph":"112d","speaker":"Ἀλκιβιάδης","greek":"ἐκ μὲν ὧν σὺ λέγεις οὐκ εἰκός.","english":"From what you say, it is not likely.","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Σωκράτης","greek":"ὁρᾷς αὖ τοῦθ᾽ ὡς οὐ καλῶς εἶπες, ὦ Ἀλκιβιάδη;","english":"Do you see again that you have not spoken well, Alcibiades?","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Ἀλκιβιάδης","greek":"τὸ ποῖον;","english":"In what way?","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Σωκράτης","greek":"ὅτι ἐμὲ φῂς ταῦτα λέγειν.","english":"In saying that I say these things.","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Ἀλκιβιάδης","greek":"τί δέ; οὐ σὺ λέγεις ὡς ἐγὼ οὐδὲν ἐπίσταμαι περὶ τῶν δικαίων καὶ ἀδίκων;","english":"What? Are you not saying that I know nothing about just and unjust things?","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Σωκράτης","greek":"οὐ μέντοι.","english":"No indeed.","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Ἀλκιβιάδης","greek":"ἀλλ᾽ ἐγώ;","english":"Then am I?","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Σωκράτης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Ἀλκιβιάδης","greek":"πῶς δή;","english":"How so?","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Σωκράτης","greek":"ὧδε εἴσῃ. ἐάν σε ἔρωμαι τὸ ἓν καὶ τὰ δύο πότερα πλείω ἐστί, φήσεις ὅτι τὰ δύο;","english":"You will see this way. If I ask you which is more, one or two, you will say two?","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Ἀλκιβιάδης","greek":"ἔγωγε.","english":"I will.","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Σωκράτης","greek":"πόσῳ;","english":"By how much?","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Ἀλκιβιάδης","greek":"ἑνί.","english":"By one.","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Σωκράτης","greek":"πότερος οὖν ἡμῶν ὁ λέγων ὅτι τὰ δύο τοῦ ἑνὸς ἑνὶ πλείω;","english":"Then which of us is the one saying that two is more than one by one?","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Ἀλκιβιάδης","greek":"ἐγώ.","english":"I am.","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Σωκράτης","greek":"οὐκοῦν ἐγὼ μὲν ἠρώτων, σὺ δ᾽ ἀπεκρίνου;","english":"And I was asking, and you were answering?","g":{},"c":{},"turn":true},{"steph":"112e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"113a","speaker":"Σωκράτης","greek":"περὶ δὴ τούτων μῶν ἐγὼ φαίνομαι λέγων ὁ ἐρωτῶν, ἢ σὺ ὁ ἀποκρινόμενος;","english":"Then on this subject, is it I, the questioner, who am seen to be speaking, or you, the answerer?","g":{},"c":{},"turn":true},{"steph":"113a","speaker":"Ἀλκιβιάδης","greek":"ἐγώ.","english":"I am.","g":{},"c":{},"turn":true},{"steph":"113a","speaker":"Σωκράτης","greek":"τί δ᾽ ἂν ἐγὼ μὲν ἔρωμαι ποῖα γράμματα Σωκράτους, σὺ δ᾽ εἴπῃς, πότερος ὁ λέγων;","english":"And if I asked what the letters of ‘Socrates’ are, and you told me, which of us would be the one speaking?","g":{},"c":{},"turn":true},{"steph":"113a","speaker":"Ἀλκιβιάδης","greek":"ἐγώ.","english":"I would.","g":{},"c":{},"turn":true},{"steph":"113a","speaker":"Σωκράτης","greek":"ἴθι δή, ἑνὶ λόγῳ εἰπέ· ὅταν ἐρώτησίς τε καὶ ἀπόκρισις γίγνηται, πότερος ὁ λέγων, ὁ ἐρωτῶν ἢ ὁ ἀποκρινόμενος;","english":"Come then, say it in one word: when there is question and answer{25}, which is the one speaking, the questioner or the answerer?","g":{},"c":{"25":["ἐρώτησίς τε καὶ ἀπόκρισις","The turning point of the first argument. Whoever answers is the one asserting. Socrates only asked; Alcibiades himself said he does not know justice. This is the core of the Socratic method, the ἔλεγχος or refutation."]},"turn":true},{"steph":"113a","speaker":"Ἀλκιβιάδης","greek":"ὁ ἀποκρινόμενος, ἔμοιγε δοκεῖ, ὦ Σώκρατες.","english":"The answerer, I think, Socrates.","g":{},"c":{},"turn":true},{"steph":"113b","speaker":"Σωκράτης","greek":"οὐκοῦν ἄρτι διὰ παντὸς ἐγὼ μὲν ἦ ὁ ἐρωτῶν;","english":"And just now, all along, was I not the questioner?","g":{},"c":{},"turn":true},{"steph":"113b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"113b","speaker":"Σωκράτης","greek":"σὺ δ᾽ ὁ ἀποκρινόμενος;","english":"And you the answerer?","g":{},"c":{},"turn":true},{"steph":"113b","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"113b","speaker":"Σωκράτης","greek":"τί οὖν; τὰ λεχθέντα πότερος ἡμῶν εἴρηκεν;","english":"Well then, which of us has said what was said?","g":{},"c":{},"turn":true},{"steph":"113b","speaker":"Ἀλκιβιάδης","greek":"φαίνομαι μέν, ὦ Σώκρατες, ἐκ τῶν ὡμολογημένων ἐγώ.","english":"It is I, Socrates, by what we have agreed.","g":{},"c":{},"turn":true},{"steph":"113b","speaker":"Σωκράτης","greek":"οὐκοῦν ἐλέχθη περὶ δικαίων καὶ ἀδίκων ὅτι Ἀλκιβιάδης ὁ καλὸς ὁ Κλεινίου οὐκ ἐπίσταιτο, οἴοιτο δέ, καὶ μέλλοι εἰς ἐκκλησίαν ἐλθὼν συμβουλεύσειν Ἀθηναίοις περὶ ὧν οὐδὲν οἶδεν; οὐ ταῦτ᾽ ἦν;","english":"And what was said about the just and unjust was that Alcibiades, the handsome son of Clinias, did not know but thought he knew, and was about to go into the assembly to advise the Athenians on matters he knows nothing about. Was it not that?","g":{},"c":{},"turn":true},{"steph":"113c","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"113c","speaker":"Σωκράτης","greek":"τὸ τοῦ Εὐριπίδου ἄρα συμβαίνει, ὦ Ἀλκιβιάδη· σοῦ τάδε κινδυνεύεις, οὐκ ἐμοῦ ἀκηκοέναι, οὐδ᾽ ἐγώ εἰμι ὁ ταῦτα λέγων, ἀλλὰ σύ, ἐμὲ δὲ αἰτιᾷ μάτην. καὶ μέντοι καὶ εὖ λέγεις. μανικὸν{a} γὰρ ἐν νῷ ἔχεις ἐπιχείρημα ἐπιχειρεῖν, ὦ βέλτιστε, διδάσκειν ἃ οὐκ οἶσθα, ἀμελήσας μανθάνειν.","english":"Then it is as in Euripides{26}, Alcibiades: you are likely to have heard this ‘from yourself, not from me,’ and it is not I who say it, but you, and you blame me in vain. And indeed what you say is right. For the enterprise you have in mind is madness, my good friend: to teach what you do not know, having neglected to learn it.","g":{"a":["μανικὸν","“mad,” from μανία; hence *maniac*, *mania*."]},"c":{"26":["τὸ τοῦ Εὐριπίδου","A near quotation of *Hippolytus* 352: “You hear these things from yourself, not from me,” Phaedra’s words when her nurse names her secret love. The echo casts Alcibiades as the one who has blurted out his own secret."]},"turn":true},{"steph":"113d","speaker":"Ἀλκιβιάδης","greek":"οἶμαι μέν, ὦ Σώκρατες, ὀλιγάκις Ἀθηναίους βουλεύεσθαι καὶ τοὺς ἄλλους Ἕλληνας πότερα δικαιότερα ἢ ἀδικώτερα· τὰ μὲν γὰρ τοιαῦτα ἡγοῦνται δῆλα εἶναι, ἐάσαντες οὖν περὶ αὐτῶν σκοποῦσιν ὁπότερα συνοίσει πράξασιν. οὐ γὰρ ταὐτὰ οἶμαι ἐστὶν τά τε δίκαια καὶ τὰ συμφέροντα, ἀλλὰ πολλοῖς δὴ ἐλυσιτέλησεν ἀδικήσασι μεγάλα ἀδικήματα, καὶ ἑτέροις γε οἶμαι δίκαια ἐργασαμένοις οὐ συνήνεγκεν.","english":"I think, Socrates, that the Athenians and the other Greeks rarely deliberate about which course is more just or more unjust. They think such things are obvious, and so they leave them aside and consider which will be to their advantage when done. For the just and the advantageous{27} are not, I think, the same: many people have profited by committing great injustices, and others, I think, have gained nothing by doing just things.","g":{},"c":{"27":["τά τε δίκαια καὶ τὰ συμφέροντα","Alcibiades now retreats to the realist’s position, that justice and advantage come apart: a thesis Thucydides puts in Athenian mouths (the Melian Dialogue) and Thrasymachus defends in the *Republic*. The next argument (114–116) aims to show that the just is advantageous."]},"turn":true},{"steph":"113d","speaker":"Σωκράτης","greek":"τί οὖν; εἰ ὅτι μάλιστα ἕτερα μὲν τὰ δίκαια |113e| τυγχάνει ὄντα, ἕτερα δὲ τὰ συμφέροντα, οὔ τί που αὖ σὺ οἴει ταῦτ᾽ εἰδέναι ἃ συμφέρει τοῖς ἀνθρώποις, καὶ δι᾽ ὅτι;","english":"Well then: if the just and the advantageous really are as different as they can be, surely you do not think you know in turn what is advantageous to men, and why?","g":{},"c":{},"turn":true},{"steph":"113e","speaker":"Ἀλκιβιάδης","greek":"τί γὰρ κωλύει, ὦ Σώκρατες; εἰ μή με αὖ ἐρήσῃ παρ᾽ ὅτου ἔμαθον ἢ ὅπως αὐτὸς ηὗρον.","english":"What is to prevent me, Socrates? Unless you are going to ask me again from whom I learned it or how I found it out for myself.","g":{},"c":{},"turn":true},{"steph":"113e","speaker":"Σωκράτης","greek":"οἷον τοῦτο ποιεῖς. εἴ τι μὴ ὀρθῶς λέγεις, τυγχάνει δὲ δυνατὸν ὂν ἀποδεῖξαι δι᾽ οὗπερ καὶ τὸ πρότερον λόγου, οἴει δὴ καινὰ ἄττα δεῖν ἀκούειν ἀποδείξεις τε ἑτέρας, ὡς τῶν προτέρων οἷον σκευαρίων κατατετριμμένων{b}, καὶ οὐκέτ᾽ ἂν σὺ αὐτὰ ἀμπίσχοιο, εἰ μή τίς σοι τεκμήριον καθαρὸν |114a| καὶ ἄχραντον οἴσει.","english":"What a way you have! If what you say is not right, and it happens that it can be shown by the very argument we used before, you think you must hear something new and other proofs, as if the earlier ones were worn-out clothes you would not put on again, unless someone brings you a proof clean and unsoiled.","g":{"b":["σκευαρίων κατατετριμμένων","diminutive of σκεῦος, “little bits of gear, worn out”; κατατρίβω, “wear down,” as in *tribulation* via Latin *tribulum*."]},"c":{},"turn":true},{"steph":"114a","speaker":"Σωκράτης","greek":"ἐγὼ δὲ χαίρειν ἐάσας τὰς σὰς προδρομὰς τοῦ λόγου οὐδὲν ἧττον ἐρήσομαι πόθεν μαθὼν αὖ τὰ συμφέροντ᾽ ἐπίστασαι, καὶ ὅστις ἐστὶν ὁ διδάσκαλος, καὶ πάντ᾽ ἐκεῖνα τὰ πρότερον ἐρωτῶ μιᾷ ἐρωτήσει; ἀλλὰ γὰρ δῆλον ὡς εἰς ταὐτὸν ἥξεις καὶ οὐχ ἕξεις ἀποδεῖξαι οὔθ᾽ ὡς ἐξευρὼν οἶσθα τὰ συμφέροντα οὔθ᾽ ὡς μαθών.","english":"But I will let your skirmishes ahead of the argument go, and ask you all the same where you learned to know what is advantageous, and who your teacher is; all those earlier questions in a single question. But it is clear you will arrive at the same place and will not be able to show that you know what is advantageous either by finding it out or by learning it.","g":{},"c":{},"turn":false},{"steph":"114a","speaker":"Σωκράτης","greek":"ἐπειδὴ δὲ τρυφᾷς καὶ οὐκέτ᾽ ἂν ἡδέως τοῦ αὐτοῦ γεύσαιο λόγου, τοῦτον μὲν ἐῶ χαίρειν, εἴτ᾽ οἶσθα εἴτε μὴ τὰ Ἀθηναίοις συμφέροντα· |114b| πότερον δὲ ταὐτά ἐστι δίκαιά τε καὶ συμφέροντ᾽ ἢ ἕτερα, τί οὐκ ἀπέδειξας; εἰ μὲν βούλει, ἐρωτῶν με ὥσπερ ἐγὼ σέ, εἰ δέ, καὶ αὐτὸς ἐπὶ σεαυτοῦ λόγῳ διέξελθε.","english":"Since you are fastidious, though, and would not enjoy tasting the same argument again, I let that question go, whether you know what is advantageous to the Athenians or not. But whether the just and the advantageous are the same or different, why have you not shown that? Question me, if you like, as I questioned you; or else go through it yourself in an argument of your own.","g":{},"c":{},"turn":false},{"steph":"114b","speaker":"Ἀλκιβιάδης","greek":"ἀλλ᾽ οὐκ οἶδα εἰ οἷός τ᾽ ἂν εἴην, ὦ Σώκρατες, πρὸς σὲ διελθεῖν.","english":"But I do not know whether I would be able to go through it in front of you, Socrates.","g":{},"c":{},"turn":true},{"steph":"114b","speaker":"Σωκράτης","greek":"ἀλλ᾽, ὠγαθέ, ἐμὲ ἐκκλησίαν νόμισον καὶ δῆμον· καὶ ἐκεῖ τοί σε δεήσει ἕνα ἕκαστον πείθειν. ἦ γάρ;","english":"Then, my good man, think of me as the assembly and the people{28}; there too, you know, you will have to persuade each one. Is that not so?","g":{},"c":{"28":["ἐμὲ ἐκκλησίαν νόμισον καὶ δῆμον","Socrates offers himself as an audience of one. The claim that persuading one and many are the same skill is a quiet critique of rhetoric: it aims at crowds, while knowledge persuades anyone. ἐκκλησία later becomes the word for “church,” whence *ecclesiastical*."]},"turn":true},{"steph":"114b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"114b","speaker":"Σωκράτης","greek":"οὐκοῦν τοῦ αὐτοῦ ἕνα τε οἷόν τε εἶναι κατὰ μόνας |114c| πείθειν καὶ συμπόλλους περὶ ὧν ἂν εἰδῇ, ὥσπερ ὁ γραμματιστὴς ἕνα τέ που πείθει περὶ γραμμάτων καὶ πολλούς;","english":"And is it not the same man who is able to persuade one person on his own and many together, on the things he knows, just as the schoolmaster persuades one person about letters and many as well?","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν οὐ καὶ περὶ ἀριθμοῦ ὁ αὐτὸς ἕνα τε καὶ πολλοὺς πείσει;","english":"And will not the same man persuade one and many about number too?","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Σωκράτης","greek":"οὗτος δ᾽ ἔσται ὁ εἰδώς, ὁ ἀριθμητικός;","english":"And this will be the man who knows, the arithmetician?","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ σὺ ἅπερ καὶ πολλοὺς οἷός τε πείθειν εἶ, ταῦτα καὶ ἕνα;","english":"Then you too can persuade one person of the same things you can persuade many?","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Ἀλκιβιάδης","greek":"εἰκός γε.","english":"Probably.","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Σωκράτης","greek":"ἔστι δὲ ταῦτα δῆλον ὅτι ἃ οἶσθα.","english":"And these are clearly the things you know.","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"114c","speaker":"Σωκράτης","greek":"ἄλλο τι οὖν τοσοῦτον μόνον διαφέρει τοῦ ἐν τῷ |114d| δήμῳ ῥήτορος ὁ ἐν τῇ τοιᾷδε συνουσίᾳ, ὅτι ὁ μὲν ἁθρόους πείθει τὰ αὐτά, ὁ δὲ καθ᾽ ἕνα;","english":"Then is there any other difference between the orator before the people and the one in a conversation like ours, except that the one persuades a crowd of the same things, and the other one by one?","g":{},"c":{},"turn":true},{"steph":"114d","speaker":"Ἀλκιβιάδης","greek":"κινδυνεύει.","english":"It looks that way.","g":{},"c":{},"turn":true},{"steph":"114d","speaker":"Σωκράτης","greek":"ἴθι νῦν, ἐπειδὴ τοῦ αὐτοῦ φαίνεται πολλούς τε καὶ ἕνα πείθειν, ἐν ἐμοὶ ἐμμελέτησον καὶ ἐπιχείρησον ἐπιδεῖξαι ὡς τὸ δίκαιον ἐνίοτε οὐ συμφέρει.","english":"Come then, since it is evidently the same man’s task to persuade many and one, practice on me, and try to show that the just is sometimes not advantageous.","g":{},"c":{},"turn":true},{"steph":"114d","speaker":"Ἀλκιβιάδης","greek":"ὑβριστὴς{a} εἶ, ὦ Σώκρατες.","english":"You are insolent, Socrates.","g":{"a":["ὑβριστὴς","“insolent, outrageous,” from ὕβρις; English *hubris*."]},"c":{},"turn":true},{"steph":"114d","speaker":"Σωκράτης","greek":"νῦν γοῦν ὑφ᾽ ὕβρεως μέλλω σε πείθειν τἀναντία οἷς σὺ ἐμὲ οὐκ ἐθέλεις.","english":"Now, at any rate, I am going out of insolence to persuade you of the opposite of what you are unwilling to persuade me.","g":{},"c":{},"turn":true},{"steph":"114d","speaker":"Ἀλκιβιάδης","greek":"λέγε δή.","english":"Speak, then.","g":{},"c":{},"turn":true},{"steph":"114d","speaker":"Σωκράτης","greek":"ἀποκρίνου μόνον τὰ ἐρωτώμενα.","english":"Just answer the questions.","g":{},"c":{},"turn":true},{"steph":"114e","speaker":"Ἀλκιβιάδης","greek":"μή, ἀλλὰ σὺ αὐτὸς λέγε.","english":"No, you speak yourself.","g":{},"c":{},"turn":true},{"steph":"114e","speaker":"Σωκράτης","greek":"τί δ᾽; οὐχ ὅτι μάλιστα βούλει πεισθῆναι;","english":"What? Do you not want above all to be persuaded?","g":{},"c":{},"turn":true},{"steph":"114e","speaker":"Ἀλκιβιάδης","greek":"πάντως δήπου.","english":"By all means.","g":{},"c":{},"turn":true},{"steph":"114e","speaker":"Σωκράτης","greek":"οὐκοῦν εἰ λέγεις ὅτι ταῦθ᾽ οὕτως ἔχει, μάλιστ᾽ ἂν εἴης πεπεισμένος;","english":"And if you say that this is so, would you not be most thoroughly persuaded?","g":{},"c":{},"turn":true},{"steph":"114e","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε δοκεῖ.","english":"I think so.","g":{},"c":{},"turn":true},{"steph":"114e","speaker":"Σωκράτης","greek":"ἀποκρίνου δή· καὶ ἐὰν μὴ αὐτὸς σὺ σαυτοῦ ἀκούσῃς ὅτι τὰ δίκαια καὶ συμφέροντά ἐστιν, ἄλλῳ γε λέγοντι μὴ πιστεύσῃς.","english":"Then answer; and if you do not hear from your own lips that the just is advantageous, do not believe anyone else who says it.","g":{},"c":{},"turn":true},{"steph":"114e","speaker":"Ἀλκιβιάδης","greek":"οὔτοι, ἀλλ᾽ ἀποκριτέον· καὶ γὰρ οὐδὲν οἴομαι βλαβήσεσθαι.","english":"I will not; but I must answer, for I do not think I will come to any harm.","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Σωκράτης","greek":"μαντικὸς{a} γὰρ εἶ. καί μοι λέγε· τῶν δικαίων φῂς ἔνια μὲν συμφέρειν, ἔνια δ᾽ οὔ;","english":"You are a prophet. Now tell me: do you say that some just things are advantageous and some are not?","g":{"a":["μαντικὸς","“prophetic,” from μάντις, seer; Socrates teases that Alcibiades has foreseen the outcome. Root of *-mancy* (necromancy)."]},"c":{},"turn":true},{"steph":"115a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Σωκράτης","greek":"τί δέ; τὰ μὲν καλὰ αὐτῶν εἶναι, τὰ δ᾽ οὔ;","english":"And that some of them are fine and some are not?","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Ἀλκιβιάδης","greek":"πῶς τοῦτο ἐρωτᾷς;","english":"What do you mean by that question?","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Σωκράτης","greek":"εἴ τις ἤδη σοι ἔδοξεν αἰσχρὰ μέν, δίκαια δὲ πράττειν;","english":"Whether anyone has ever seemed to you to do things that were shameful and yet just?","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔμοιγε.","english":"Not to me.","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Σωκράτης","greek":"ἀλλὰ πάντα τὰ δίκαια καὶ καλά;","english":"Then all just things are also fine?","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Σωκράτης","greek":"τί δ᾽ αὖ τὰ καλά; πότερον πάντα ἀγαθά, ἢ τὰ μέν, τὰ δ᾽ οὔ;","english":"And again the fine things: are they all good, or some good and some not?","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Ἀλκιβιάδης","greek":"οἴομαι ἔγωγε, ὦ Σώκρατες, ἔνια τῶν καλῶν κακὰ εἶναι.","english":"I think, Socrates, that some fine things are bad.","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Σωκράτης","greek":"ἦ καὶ αἰσχρὰ ἀγαθά;","english":"And some shameful things good?","g":{},"c":{},"turn":true},{"steph":"115a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"115b","speaker":"Σωκράτης","greek":"ἆρα λέγεις τὰ τοιάδε, οἷον πολλοὶ ἐν πολέμῳ βοηθήσαντες ἑταίρῳ ἢ οἰκείῳ τραύματα ἔλαβον καὶ ἀπέθανον, οἱ δ᾽ οὐ βοηθήσαντες, δέον, ὑγιεῖς ἀπῆλθον;","english":"Do you mean such cases as this: many men in war have gone to help a comrade or a kinsman and been wounded and killed, while others who did not help, though they should have, came away safe?","g":{},"c":{},"turn":true},{"steph":"115b","speaker":"Ἀλκιβιάδης","greek":"πάνυ μὲν οὖν.","english":"Exactly.","g":{},"c":{},"turn":true},{"steph":"115b","speaker":"Σωκράτης","greek":"οὐκοῦν τὴν τοιαύτην βοήθειαν καλὴν μὲν λέγεις κατὰ τὴν ἐπιχείρησιν τοῦ σῶσαι οὓς ἔδει, τοῦτο δ᾽ ἐστὶν ἀνδρεία{b}· ἢ οὔ;","english":"Then you call help of this kind fine in respect of the attempt to save those one ought to save, and that is courage. Or not?","g":{"b":["ἀνδρεία","“courage,” literally “manliness,” from ἀνήρ, ἀνδρός, man; hence *android*, *Andrew*."]},"c":{},"turn":true},{"steph":"115b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"115b","speaker":"Σωκράτης","greek":"κακὴν δέ γε κατὰ τοὺς θανάτους τε καὶ ἕλκη· ἦ γάρ;","english":"But bad in respect of the deaths and wounds. Is that so?","g":{},"c":{},"turn":true},{"steph":"115b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"115c","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν οὐκ ἄλλο μὲν ἡ ἀνδρεία, ἄλλο δὲ ὁ θάνατος;","english":"And is not courage one thing and death another?","g":{},"c":{},"turn":true},{"steph":"115c","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"115c","speaker":"Σωκράτης","greek":"οὐκ ἄρα κατὰ ταὐτόν γ᾽ ἐστι καλὸν καὶ κακὸν τὸ τοῖς φίλοις βοηθεῖν;","english":"Then helping one’s friends is not fine and bad in the same respect?","g":{},"c":{},"turn":true},{"steph":"115c","speaker":"Ἀλκιβιάδης","greek":"οὐ φαίνεται.","english":"It seems not.","g":{},"c":{},"turn":true},{"steph":"115c","speaker":"Σωκράτης","greek":"ὅρα τοίνυν εἰ, ᾗ γε καλόν, καὶ ἀγαθόν, ὥσπερ καὶ ἐνταῦθα. κατὰ τὴν ἀνδρείαν γὰρ ὡμολόγεις καλὸν εἶναι τὴν βοήθειαν· τοῦτ᾽ οὖν αὐτὸ σκόπει, τὴν ἀνδρείαν, ἀγαθὸν ἢ κακόν; ὧδε δὲ σκόπει· σὺ πότερ᾽ ἂν δέξαιό σοι εἶναι, ἀγαθὰ ἢ κακά;","english":"Now see whether, insofar as it is fine, it is also good{29}, as here. For you agreed that the help was fine in respect of courage. Consider this very thing, courage: is it good or bad? Consider it this way: which would you choose to have, good things or bad?","g":{},"c":{"29":["ᾗ γε καλόν, καὶ ἀγαθόν","The argument rests on “insofar as” (ᾗ, κατά): an act can be fine in one respect (courage) and bad in another (death). Once the respects are separated, the fine and the good line up. Greek καλός covers beautiful, fine and noble at once."]},"turn":true},{"steph":"115c","speaker":"Ἀλκιβιάδης","greek":"ἀγαθά.","english":"Good.","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Σωκράτης","greek":"οὐκοῦν τὰ μέγιστα μάλιστα.","english":"And the greatest goods most of all?","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Ἀλκιβιάδης","greek":"⟨ναί.⟩","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Σωκράτης","greek":"καὶ ἥκιστα τῶν τοιούτων δέξαιο ἂν στέρεσθαι;","english":"And these you would least of all accept being deprived of?","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Σωκράτης","greek":"πῶς οὖν λέγεις περὶ ἀνδρείας; ἐπὶ πόσῳ ἂν αὐτοῦ δέξαιο στέρεσθαι;","english":"What do you say about courage, then? At what price would you accept being deprived of it?","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Ἀλκιβιάδης","greek":"οὐδὲ ζῆν ἂν ἐγὼ δεξαίμην δειλὸς{c} ὤν.","english":"I would not even accept living if I were a coward.","g":{"c":["δειλὸς","“cowardly”; noun δειλία, cowardice, from the root of δέος, fear."]},"c":{},"turn":true},{"steph":"115d","speaker":"Σωκράτης","greek":"ἔσχατον ἄρα κακῶν εἶναί σοι δοκεῖ ἡ δειλία.","english":"Then cowardice seems to you the worst of evils.","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε.","english":"It does.","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Σωκράτης","greek":"ἐξ ἴσου τῷ τεθνάναι, ὡς ἔοικε.","english":"On a par with being dead, it seems.","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Ἀλκιβιάδης","greek":"φημί.","english":"I agree.","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Σωκράτης","greek":"οὐκοῦν θανάτῳ τε καὶ δειλίᾳ ἐναντιώτατον ζωὴ καὶ ἀνδρεία;","english":"And are not life and courage the most opposite to death and cowardice?","g":{},"c":{},"turn":true},{"steph":"115d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Σωκράτης","greek":"καὶ τὰ μὲν μάλιστ᾽ ἂν εἶναι βούλοιό σοι, τὰ δὲ ἥκιστα;","english":"And the one pair you would most wish to have, the other least?","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Σωκράτης","greek":"ἆρ᾽ ὅτι τὰ μὲν ἄριστα ἡγῇ, τὰ δὲ κάκιστα;","english":"Because you think the one pair best and the other worst?","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Σωκράτης","greek":"ἐν τοῖς ἀρίστοις ἄρα σὺ ἡγῇ ἀνδρείαν εἶναι κἀν τοῖς κακίστοις θάνατον.","english":"Then you think courage among the best things and death among the worst.","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Ἀλκιβιάδης","greek":"ἔγωγε.","english":"I do.","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Σωκράτης","greek":"τὸ ἄρα βοηθεῖν ἐν πολέμῳ τοῖς φίλοις, ᾗ μὲν καλόν, κατ᾽ ἀγαθοῦ πρᾶξιν τὴν τῆς ἀνδρείας, καλὸν αὐτὸ προσεῖπας;","english":"So helping one’s friends in war, insofar as it is fine, in respect of the doing of a good, the act of courage, you called fine?","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Ἀλκιβιάδης","greek":"φαίνομαί γε.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Σωκράτης","greek":"κατὰ δέ γε κακοῦ πρᾶξιν τὴν τοῦ θανάτου κακόν;","english":"And in respect of the doing of an evil, the act of dying, bad?","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"115e","speaker":"Σωκράτης","greek":"οὐκοῦν ὧδε δίκαιον προσαγορεύειν ἑκάστην τῶν πράξεων· εἴπερ ᾗ κακὸν ἀπεργάζεται κακὴν καλεῖς, καὶ ᾗ |116a| ἀγαθὸν ἀγαθὴν κλητέον.","english":"Then it is right to name each of our actions this way: if you call it bad insofar as it produces something bad, it must also be called good insofar as it produces something good.","g":{},"c":{},"turn":true},{"steph":"116a","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε δοκεῖ.","english":"I think so.","g":{},"c":{},"turn":true},{"steph":"116a","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν καὶ ᾗ ἀγαθόν, καλόν· ᾗ δὲ κακόν, αἰσχρόν;","english":"And is it fine insofar as it is good, and shameful insofar as it is bad?","g":{},"c":{},"turn":true},{"steph":"116a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"116a","speaker":"Σωκράτης","greek":"τὴν ἄρ᾽ ἐν τῷ πολέμῳ τοῖς φίλοις βοήθειαν λέγων καλὴν μὲν εἶναι, κακὴν δέ, οὐδὲν διαφερόντως λέγεις ἢ εἰ προσεῖπες αὐτὴν ἀγαθὴν μέν, κακὴν δέ.","english":"So when you say that helping one’s friends in war is fine but bad, you are saying no differently than if you called it good but bad.","g":{},"c":{},"turn":true},{"steph":"116a","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ μοι δοκεῖς λέγειν, ὦ Σώκρατες.","english":"I think you are right, Socrates.","g":{},"c":{},"turn":true},{"steph":"116a","speaker":"Σωκράτης","greek":"οὐδὲν ἄρα τῶν καλῶν, καθ᾽ ὅσον καλόν, κακόν, οὐδὲ τῶν αἰσχρῶν, καθ᾽ ὅσον αἰσχρόν, ἀγαθόν.","english":"Then nothing fine, insofar as it is fine, is bad, and nothing shameful, insofar as it is shameful, is good.","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Ἀλκιβιάδης","greek":"οὐ φαίνεται.","english":"It seems not.","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Σωκράτης","greek":"ἔτι τοίνυν καὶ ὧδε σκέψαι. ὅστις καλῶς πράττει, οὐχὶ καὶ εὖ πράττει;","english":"Now look at it this way too. Whoever acts finely, does he not also do well?{30}","g":{},"c":{"30":["καλῶς πράττει … εὖ πράττει","εὖ πράττειν means both “to act well” and “to fare well, prosper,” as English “doing well” does. The argument uses the double sense to pass from right action to happiness. Plato uses the same move at *Gorgias* 507c."]},"turn":true},{"steph":"116b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Σωκράτης","greek":"οἱ δ᾽ εὖ πράττοντες οὐκ εὐδαίμονες{a};","english":"And are not those who do well happy?","g":{"a":["εὐδαίμονες","“happy,” literally “with a good δαίμων, a good guardian spirit”; εὐδαιμονία is the Greek word for the flourishing life. Compare English *eu-* (eulogy) and *demon*."]},"c":{},"turn":true},{"steph":"116b","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Σωκράτης","greek":"οὐκοῦν εὐδαίμονες δι᾽ ἀγαθῶν κτῆσιν;","english":"And happy because they possess good things?","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Ἀλκιβιάδης","greek":"μάλιστα.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Σωκράτης","greek":"κτῶνται δὲ ταῦτα τῷ εὖ καὶ καλῶς πράττειν;","english":"And they gain these by doing well and finely?","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Σωκράτης","greek":"τὸ εὖ ἄρα πράττειν ἀγαθόν;","english":"Then doing well is good?","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Ἀλκιβιάδης","greek":"πῶς δ᾽ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Σωκράτης","greek":"οὐκοῦν καλὸν ἡ εὐπραγία;","english":"And doing well is fine?","g":{},"c":{},"turn":true},{"steph":"116b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Σωκράτης","greek":"ταὐτὸν ἄρα ἐφάνη ἡμῖν πάλιν αὖ καλόν τε καὶ ἀγαθόν.","english":"Then the fine and the good have appeared to us once again as the same.","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Σωκράτης","greek":"ὅτι ἂν ἄρα εὕρωμεν καλόν, καὶ ἀγαθὸν εὑρήσομεν ἔκ γε τούτου τοῦ λόγου.","english":"So whatever we find to be fine we shall also find to be good, by this argument at least.","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Ἀλκιβιάδης","greek":"ἀνάγκη.","english":"Necessarily.","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Σωκράτης","greek":"τί δέ; τὰ ἀγαθὰ συμφέρει ἢ οὔ;","english":"Well then: are good things advantageous or not?","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Ἀλκιβιάδης","greek":"συμφέρει.","english":"Advantageous.","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Σωκράτης","greek":"μνημονεύεις οὖν περὶ τῶν δικαίων πῶς ὡμολογήσαμεν;","english":"Do you remember, then, what we agreed about just things?","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Ἀλκιβιάδης","greek":"οἶμαί γε τοὺς τὰ δίκαια πράττοντας ἀναγκαῖον εἶναι καλὰ πράττειν.","english":"I think that those who do just things necessarily do fine things.","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ τοὺς τὰ καλὰ ἀγαθά;","english":"And those who do fine things, good things?","g":{},"c":{},"turn":true},{"steph":"116c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"116d","speaker":"Σωκράτης","greek":"τὰ δὲ ἀγαθὰ συμφέρειν;","english":"And good things are advantageous?","g":{},"c":{},"turn":true},{"steph":"116d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"116d","speaker":"Σωκράτης","greek":"τὰ δίκαια ἄρα, ὦ Ἀλκιβιάδη, συμφέροντά ἐστιν.","english":"Then just things, Alcibiades, are advantageous.","g":{},"c":{},"turn":true},{"steph":"116d","speaker":"Ἀλκιβιάδης","greek":"ἔοικεν.","english":"It seems so.","g":{},"c":{},"turn":true},{"steph":"116d","speaker":"Σωκράτης","greek":"τί οὖν; ταῦτα οὐ σὺ ὁ λέγων, ἐγὼ δὲ ὁ ἐρωτῶν;","english":"Well then: is it not you who are saying this, and I who am asking?","g":{},"c":{},"turn":true},{"steph":"116d","speaker":"Ἀλκιβιάδης","greek":"φαίνομαι, ὡς ἔοικα.","english":"I appear to be, it seems.","g":{},"c":{},"turn":true},{"steph":"116d","speaker":"Σωκράτης","greek":"εἰ οὖν τις ἀνίσταται συμβουλεύσων εἴτε Ἀθηναίοις εἴτε Πεπαρηθίοις, οἰόμενος γιγνώσκειν τὰ δίκαια καὶ τὰ ἄδικα, φήσει δ᾽ εἶναι τὰ δίκαια κακὰ ἐνίοτε, ἄλλο τι ἢ καταγελῴης ἂν αὐτοῦ, ἐπειδήπερ τυγχάνεις καὶ σὺ λέγων |116e| ὅτι ταὐτά ἐστι δίκαιά τε καὶ συμφέροντα;","english":"So if someone stands up to advise the Athenians, or the Peparethians{31}, thinking he knows what is just and unjust, and says that just things are sometimes bad, would you do anything but laugh at him, since you yourself happen to be saying that the just and the advantageous are the same?","g":{},"c":{"31":["Πεπαρηθίοις","Peparethos, a small island in the northern Aegean. The pairing is comic: the art of advising is the same whether the audience is great Athens or a tiny island."]},"turn":true},{"steph":"116e","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ μὰ τοὺς θεούς, ὦ Σώκρατες, οὐκ οἶδ᾽ ἔγωγε οὐδ᾽ ὅτι λέγω, ἀλλ᾽ ἀτεχνῶς ἔοικα ἀτόπως ἔχοντι· τοτὲ μὲν γάρ μοι ἕτερα δοκεῖ σοῦ ἐρωτῶντος, τοτὲ δ᾽ ἄλλα.","english":"But by the gods, Socrates, I do not know what I am saying; I seem to be in a really strange state{32}. When you question me, I think one thing at one moment and another at the next.","g":{},"c":{"32":["ἀτόπως ἔχοντι","Alcibiades now uses of himself the word (ἄτοπος) he used of Socrates at 106a. This bewilderment is ἀπορία, “being at a loss,” the state Socratic questioning aims to produce as the start of real inquiry."]},"turn":true},{"steph":"116e","speaker":"Σωκράτης","greek":"εἶτα τοῦτο, ὦ φίλε, ἀγνοεῖς τὸ πάθημα τί ἐστιν;","english":"And do you not know, my friend, what this experience is?","g":{},"c":{},"turn":true},{"steph":"116e","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Not at all.","g":{},"c":{},"turn":true},{"steph":"116e","speaker":"Σωκράτης","greek":"οἴει ἂν οὖν, εἴ τις ἐρωτῴη σε δύο ὀφθαλμοὺς ἢ τρεῖς ἔχεις, καὶ δύο χεῖρας ἢ τέτταρας, ἢ ἄλλο τι τῶν τοιούτων, τοτὲ μὲν ἕτερα ἂν ἀποκρίνασθαι, τοτὲ δὲ ἄλλα, ἢ ἀεὶ τὰ αὐτά;","english":"Do you think that if someone asked you whether you have two eyes or three, two hands or four, or anything of that sort, you would answer one thing at one moment and another at the next, or always the same?","g":{},"c":{},"turn":true},{"steph":"117a","speaker":"Ἀλκιβιάδης","greek":"δέδοικα μὲν ἔγωγε ἤδη περὶ ἐμαυτοῦ, οἶμαι μέντοι τὰ αὐτά.","english":"I am beginning to be afraid for myself; but I think the same.","g":{},"c":{},"turn":true},{"steph":"117a","speaker":"Σωκράτης","greek":"οὐκοῦν ὅτι οἶσθα; τοῦτ᾽ αἴτιον;","english":"Because you know? Is that the reason?","g":{},"c":{},"turn":true},{"steph":"117a","speaker":"Ἀλκιβιάδης","greek":"οἶμαι ἔγωγε.","english":"I think so.","g":{},"c":{},"turn":true},{"steph":"117a","speaker":"Σωκράτης","greek":"περὶ ὧν ἄρα ἄκων τἀναντία ἀποκρίνῃ, δῆλον ὅτι περὶ τούτων οὐκ οἶσθα.","english":"Then on matters where you give contrary answers against your will, clearly you do not know.","g":{},"c":{},"turn":true},{"steph":"117a","speaker":"Ἀλκιβιάδης","greek":"εἰκός γε.","english":"Probably.","g":{},"c":{},"turn":true},{"steph":"117a","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ περὶ τῶν δικαίων καὶ ἀδίκων καὶ καλῶν καὶ αἰσχρῶν καὶ κακῶν καὶ ἀγαθῶν καὶ συμφερόντων καὶ μὴ ἀποκρινόμενος φῂς πλανᾶσθαι; εἶτα οὐ δῆλον ὅτι διὰ τὸ μὴ εἰδέναι περὶ αὐτῶν, διὰ ταῦτα πλανᾷ;","english":"And about the just and unjust, the fine and shameful, the bad and good, the advantageous and not, you say you wander in your answers? Then is it not clear that it is because you do not know about them that you wander?","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε.","english":"It is to me.","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν οὕτω καὶ ἔχει· ἐπειδάν τίς τι μὴ εἰδῇ, ἀναγκαῖον περὶ τούτου πλανᾶσθαι τὴν ψυχήν;","english":"Is it so, then: when someone does not know something, his soul necessarily wanders about it?","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Σωκράτης","greek":"τί οὖν; οἶσθα ὅντινα τρόπον ἀναβήσῃ εἰς τὸν οὐρανόν;","english":"Well then: do you know in what way you will climb up to heaven?","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Ἀλκιβιάδης","greek":"μὰ Δί᾽ οὐκ ἔγωγε.","english":"By Zeus, not I.","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Σωκράτης","greek":"ἦ καὶ πλανᾶταί σου ἡ δόξα περὶ ταῦτα;","english":"And does your opinion wander about this?","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Σωκράτης","greek":"τὸ δ᾽ αἴτιον οἶσθα ἢ ἐγὼ φράσω;","english":"Do you know the reason, or shall I tell you?","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Ἀλκιβιάδης","greek":"φράσον.","english":"Tell me.","g":{},"c":{},"turn":true},{"steph":"117b","speaker":"Σωκράτης","greek":"ὅτι, ὦ φίλε, οὐκ οἴει αὐτὸ ἐπίστασθαι οὐκ ἐπιστάμενος.","english":"It is because, my friend, you do not think you know it when you do not know it.","g":{},"c":{},"turn":true},{"steph":"117c","speaker":"Ἀλκιβιάδης","greek":"πῶς αὖ τοῦτο λέγεις;","english":"What do you mean by that, again?","g":{},"c":{},"turn":true},{"steph":"117c","speaker":"Σωκράτης","greek":"ὅρα καὶ σὺ κοινῇ. ἃ μὴ ἐπίστασαι, γιγνώσκεις δὲ ὅτι οὐκ ἐπίστασαι, πλανᾷ περὶ τὰ τοιαῦτα; ὥσπερ περὶ ὄψου σκευασίας{a} οἶσθα δήπου ὅτι οὐκ οἶσθα;","english":"Look at it with me. Things you do not know, and know that you do not know, do you wander about them? For example, about preparing a dish, you surely know that you do not know?","g":{"a":["ὄψου σκευασίας","“preparation of a dish”; ὄψον is cooked food eaten with bread, hence *opsophagy*."]},"c":{},"turn":true},{"steph":"117c","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"117c","speaker":"Σωκράτης","greek":"πότερον οὖν αὐτὸς περὶ ταῦτα δοξάζεις ὅπως χρὴ σκευάζειν καὶ πλανᾷ, ἢ τῷ ἐπισταμένῳ ἐπιτρέπεις;","english":"Do you then form your own opinions about how it should be prepared, and wander, or do you leave it to the one who knows?","g":{},"c":{},"turn":true},{"steph":"117c","speaker":"Ἀλκιβιάδης","greek":"οὕτως.","english":"The latter.","g":{},"c":{},"turn":true},{"steph":"117c","speaker":"Σωκράτης","greek":"τί δ᾽ εἰ ἐν νηῒ πλέοις, ἆρα δοξάζοις ἂν πότερον |117d| χρὴ τὸν οἴακα εἴσω ἄγειν ἢ ἔξω, καὶ ἅτε οὐκ εἰδὼς πλανῷο ἄν, ἢ τῷ κυβερνήτῃ{b} ἐπιτρέψας ἂν ἡσυχίαν ἄγοις;","english":"And if you were sailing in a ship, would you form an opinion whether the tiller should be pulled in or pushed out, and wander about it because you do not know, or would you leave it to the helmsman and keep quiet?","g":{"b":["τῷ κυβερνήτῃ","“helmsman, steersman,” from κυβερνάω, to steer; via Latin *gubernare* comes *govern*, and directly *cybernetics*."]},"c":{},"turn":true},{"steph":"117d","speaker":"Ἀλκιβιάδης","greek":"τῷ κυβερνήτῃ.","english":"To the helmsman.","g":{},"c":{},"turn":true},{"steph":"117d","speaker":"Σωκράτης","greek":"οὐκ ἄρα περὶ ἃ μὴ οἶσθα πλανᾷ, ἄνπερ εἰδῇς ὅτι οὐκ οἶσθα;","english":"Then you do not wander about what you do not know, if you know that you do not know?","g":{},"c":{},"turn":true},{"steph":"117d","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔοικα.","english":"It seems not.","g":{},"c":{},"turn":true},{"steph":"117d","speaker":"Σωκράτης","greek":"ἐννοεῖς οὖν ὅτι καὶ τὰ ἁμαρτήματα ἐν τῇ πράξει διὰ ταύτην τὴν ἄγνοιάν ἐστι, τὴν τοῦ μὴ εἰδότα οἴεσθαι εἰδέναι;","english":"Do you see, then, that mistakes in action also come from this ignorance, the ignorance of thinking one knows when one does not{33}?","g":{},"c":{"33":["τὴν τοῦ μὴ εἰδότα οἴεσθαι εἰδέναι","The central diagnosis of the dialogue, and of the *Apology* (21d): the worst ignorance is not knowing that one does not know. Admitting ignorance is the start of wisdom; hiding it ruins action."]},"turn":true},{"steph":"117d","speaker":"Ἀλκιβιάδης","greek":"πῶς αὖ λέγεις τοῦτο;","english":"What do you mean by that, again?","g":{},"c":{},"turn":true},{"steph":"117d","speaker":"Σωκράτης","greek":"τότε που ἐπιχειροῦμεν πράττειν, ὅταν οἰώμεθα εἰδέναι ὅτι πράττομεν;","english":"We set about doing something, I take it, when we think we know what we are doing?","g":{},"c":{},"turn":true},{"steph":"117d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"117e","speaker":"Σωκράτης","greek":"ὅταν δέ γέ πού τινες μὴ οἴωνται εἰδέναι, ἄλλοις παραδιδόασι;","english":"But when people do not think they know, they hand it over to others?","g":{},"c":{},"turn":true},{"steph":"117e","speaker":"Ἀλκιβιάδης","greek":"πῶς δ᾽ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"117e","speaker":"Σωκράτης","greek":"οὐκοῦν οἱ τοιοῦτοι τῶν μὴ εἰδότων ἀναμάρτητοι ζῶσι διὰ τὸ ἄλλοις περὶ αὐτῶν ἐπιτρέπειν;","english":"So people of that sort, among those who do not know, live without making mistakes, because they leave these matters to others?","g":{},"c":{},"turn":true},{"steph":"117e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"117e","speaker":"Σωκράτης","greek":"τίνες οὖν οἱ ἁμαρτάνοντες; οὐ γάρ που οἵ γε εἰδότες.","english":"Who, then, are the ones who make mistakes? Surely not those who know.","g":{},"c":{},"turn":true},{"steph":"117e","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"117e","speaker":"Σωκράτης","greek":"ἐπειδὴ δ᾽ οὔθ᾽ οἱ εἰδότες οὔθ᾽ οἱ τῶν μὴ εἰδότων |118a| εἰδότες ὅτι οὐκ ἴσασιν, ἦ ἄλλοι λείπονται ἢ οἱ μὴ εἰδότες, οἰόμενοι δ᾽ εἰδέναι;","english":"And since it is neither those who know, nor those among the ignorant who know that they do not know, who else is left but those who do not know, but think they know?","g":{},"c":{},"turn":true},{"steph":"118a","speaker":"Ἀλκιβιάδης","greek":"οὔκ, ἀλλ᾽ οὗτοι.","english":"No one; it is these.","g":{},"c":{},"turn":true},{"steph":"118a","speaker":"Σωκράτης","greek":"αὕτη ἄρα ἡ ἄγνοια τῶν κακῶν αἰτία καὶ ἡ ἐπονείδιστος ἀμαθία{a};","english":"Then this ignorance is the cause of evils, the disgraceful kind of stupidity?","g":{"a":["ἐπονείδιστος ἀμαθία","ἀμαθία, “un-learning,” from ἀ- + μανθάνω (learn), root also of *mathematics*, “things learned”; ἐπονείδιστος, “disgraceful, open to reproach.”"]},"c":{},"turn":true},{"steph":"118a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"118a","speaker":"Σωκράτης","greek":"οὐκοῦν ὅταν ᾖ περὶ τὰ μέγιστα, τότε κακουργοτάτη καὶ αἰσχίστη;","english":"And when it concerns the greatest matters, it is then most harmful and most shameful?","g":{},"c":{},"turn":true},{"steph":"118a","speaker":"Ἀλκιβιάδης","greek":"πολύ γε.","english":"By far.","g":{},"c":{},"turn":true},{"steph":"118a","speaker":"Σωκράτης","greek":"τί οὖν; ἔχεις μείζω εἰπεῖν δικαίων τε καὶ καλῶν καὶ ἀγαθῶν καὶ συμφερόντων;","english":"Well then: can you name anything greater than the just, the fine, the good and the advantageous?","g":{},"c":{},"turn":true},{"steph":"118a","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"118a","speaker":"Σωκράτης","greek":"οὐκοῦν περὶ ταῦτα σὺ φῂς πλανᾶσθαι;","english":"And it is about these that you say you wander?","g":{},"c":{},"turn":true},{"steph":"118a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"118a","speaker":"Σωκράτης","greek":"εἰ δὲ πλανᾷ, ἆρ᾽ οὐ δῆλον ἐκ τῶν ἔμπροσθεν ὅτι |118b| οὐ μόνον ἀγνοεῖς τὰ μέγιστα, ἀλλὰ καὶ οὐκ εἰδὼς οἴει αὐτὰ εἰδέναι;","english":"And if you wander, is it not clear from what we said before that you are not only ignorant of the greatest things, but also, not knowing them, think that you know them?","g":{},"c":{},"turn":true},{"steph":"118b","speaker":"Ἀλκιβιάδης","greek":"κινδυνεύω.","english":"It looks that way.","g":{},"c":{},"turn":true},{"steph":"118b","speaker":"Σωκράτης","greek":"βαβαῖ ἄρα, ὦ Ἀλκιβιάδη, οἷον πάθος πέπονθας· ὃ ἐγὼ ὀνομάζειν μὲν ὀκνῶ, ὅμως δέ, ἐπειδὴ μόνω ἐσμέν, ῥητέον. ἀμαθίᾳ γὰρ συνοικεῖς, ὦ βέλτιστε, τῇ ἐσχάτῃ, ὡς ὁ λόγος σου κατηγορεῖ καὶ σὺ σαυτοῦ· διὸ καὶ ᾁττεις ἄρα πρὸς τὰ πολιτικὰ πρὶν παιδευθῆναι. πέπονθας δὲ τοῦτο οὐ σὺ μόνος, ἀλλὰ καὶ οἱ πολλοὶ τῶν πραττόντων τὰ τῆσδε |118c| τῆς πόλεως, πλὴν ὀλίγων γε καὶ ἴσως τοῦ σοῦ ἐπιτρόπου Περικλέους.","english":"Oh dear, Alcibiades, what a condition you are in! I hesitate to name it, but since we are alone, it must be said. You are living with stupidity{34}, my good friend, of the most extreme kind, as your own argument accuses you, and you accuse yourself. That is why you are rushing into politics before you have been educated. And you are not alone in this condition: so are most of those who manage the affairs of this city, except for a few, and perhaps your guardian Pericles.","g":{},"c":{"34":["ἀμαθίᾳ γὰρ συνοικεῖς","συνοικεῖν, “to live with, cohabit,” is also the word for marriage. Socrates pictures ignorance as Alcibiades’ housemate, a jab at a young man courted by everyone."]},"turn":true},{"steph":"118c","speaker":"Ἀλκιβιάδης","greek":"λέγεταί γέ τοι, ὦ Σώκρατες, οὐκ ἀπὸ τοῦ αὐτομάτου σοφὸς γεγονέναι, ἀλλὰ πολλοῖς καὶ σοφοῖς συγγεγονέναι, καὶ Πυθοκλείδῃ καὶ Ἀναξαγόρᾳ· καὶ νῦν ἔτι τηλικοῦτος ὢν Δάμωνι σύνεστιν αὐτοῦ τούτου ἕνεκα.","english":"Well, Socrates, they do say he did not become wise by chance, but kept company with many wise men, with Pythocleides and Anaxagoras; and even now, at his age, he spends time with Damon{35} for this very purpose.","g":{},"c":{"35":["Πυθοκλείδῃ καὶ Ἀναξαγόρᾳ … Δάμωνι","Pythocleides and Damon were music theorists, Anaxagoras the natural philosopher who said Mind (νοῦς) orders the cosmos. Plutarch (*Pericles* 4–6) confirms that Pericles studied with all three."]},"turn":true},{"steph":"118c","speaker":"Σωκράτης","greek":"τί οὖν; ἤδη τιν᾽ εἶδες σοφὸν ὁτιοῦν ἀδυνατοῦντα ποιῆσαι ἄλλον σοφὸν ἅπερ αὐτός; ὥσπερ ὅς σε ἐδίδαξεν γράμματα, αὐτός τ᾽ ἦν σοφὸς καὶ σὲ ἐποίησε τῶν τε ἄλλων ὅντιν᾽ ἐβούλετο· ἦ γάρ;","english":"Well then: have you ever seen anyone who was wise in anything and yet unable to make another wise in the same things? The man who taught you letters, for instance, was wise himself and made you wise, and anyone else he wanted. Is that not so?","g":{},"c":{},"turn":true},{"steph":"118c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"118d","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ σὺ ὁ παρ᾽ ἐκείνου μαθὼν ἄλλον οἷός τε ἔσῃ;","english":"And you, having learned from him, will be able to make another wise too?","g":{},"c":{},"turn":true},{"steph":"118d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"118d","speaker":"Σωκράτης","greek":"καὶ ὁ κιθαριστὴς δὲ καὶ ὁ παιδοτρίβης ὡσαύτως;","english":"And the lyre teacher and the trainer likewise?","g":{},"c":{},"turn":true},{"steph":"118d","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"118d","speaker":"Σωκράτης","greek":"καλὸν γὰρ δήπου τεκμήριον τοῦτο τῶν ἐπισταμένων ὁτιοῦν ὅτι ἐπίστανται, ἐπειδὰν καὶ ἄλλον οἷοί τ᾽ ὦσιν ἀποδεῖξαι ἐπιστάμενον.","english":"For surely this is a fine proof that those who know anything do know it, when they are able to show another person knowing it as well.","g":{},"c":{},"turn":true},{"steph":"118d","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε δοκεῖ.","english":"I think so.","g":{},"c":{},"turn":true},{"steph":"118d","speaker":"Σωκράτης","greek":"τί οὖν; ἔχεις εἰπεῖν Περικλῆς τίνα ἐποίησεν σοφόν, ἀπὸ τῶν ὑέων ἀρξάμενος;","english":"Well then: can you tell me whom Pericles has made wise, starting with his sons?","g":{},"c":{},"turn":true},{"steph":"118e","speaker":"Ἀλκιβιάδης","greek":"τί δ᾽ εἰ τὼ Περικλέους ὑεῖ ἠλιθίω{b} ἐγενέσθην, ὦ Σώκρατες;","english":"But what if Pericles’ two sons turned out simpletons, Socrates?","g":{"b":["ἠλιθίω","dual, “two simpletons”; τὼ … ὑεῖ is also dual, “the two sons.” Greek keeps a special number for pairs. Pericles’ sons were Xanthippus and Paralus."]},"c":{},"turn":true},{"steph":"118e","speaker":"Σωκράτης","greek":"ἀλλὰ Κλεινίαν τὸν σὸν ἀδελφόν.","english":"Then Clinias, your brother.","g":{},"c":{},"turn":true},{"steph":"118e","speaker":"Ἀλκιβιάδης","greek":"τί δ᾽ ἂν αὖ Κλεινίαν λέγοις, μαινόμενον ἄνθρωπον;","english":"But why mention Clinias, a madman?","g":{},"c":{},"turn":true},{"steph":"118e","speaker":"Σωκράτης","greek":"ἐπειδὴ τοίνυν Κλεινίας μὲν μαίνεται, τὼ δὲ Περικλέους ὑεῖ ἠλιθίω ἐγενέσθην, σοὶ τίνα αἰτίαν ἀναθῶμεν, δι᾽ ὅτι σε οὕτως ἔχοντα περιορᾷ;","english":"Well, since Clinias is mad and the two sons of Pericles turned out simpletons, what reason shall we give in your case, why he lets you go on as you are?","g":{},"c":{},"turn":true},{"steph":"118e","speaker":"Ἀλκιβιάδης","greek":"ἐγὼ οἶμαι αἴτιος οὐ προσέχων τὸν νοῦν.","english":"I suppose I am to blame, for not paying attention.","g":{},"c":{},"turn":true},{"steph":"119a","speaker":"Σωκράτης","greek":"ἀλλὰ τῶν ἄλλων Ἀθηναίων ἢ τῶν ξένων δοῦλον ἢ ἐλεύθερον εἰπὲ ὅστις αἰτίαν ἔχει διὰ τὴν Περικλέους συνουσίαν σοφώτερος γεγονέναι, ὥσπερ ἐγὼ ἔχω σοι εἰπεῖν διὰ τὴν Ζήνωνος Πυθόδωρον τὸν Ἰσολόχου καὶ Καλλίαν τὸν Καλλιάδου, ὧν ἑκάτερος Ζήνωνι ἑκατὸν μνᾶς τελέσας σοφός τε καὶ ἐλλόγιμος γέγονεν.","english":"Then tell me of any other Athenian or foreigner, slave or free, who is said to have become wiser through keeping company with Pericles; as I can name for you, through Zeno’s company, Pythodorus son of Isolochus and Callias son of Calliades, each of whom paid Zeno a hundred minas{36} and became wise and distinguished.","g":{},"c":{"36":["Ζήνωνι ἑκατὸν μνᾶς","Zeno of Elea, Parmenides’ pupil, famous for his paradoxes. A hundred minas was a vast fee, more than a skilled worker earned in a lifetime. Pythodorus appears as host of Zeno in the *Parmenides*."]},"turn":true},{"steph":"119a","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ μὰ Δί᾽ οὐκ ἔχω.","english":"By Zeus, I cannot.","g":{},"c":{},"turn":true},{"steph":"119a","speaker":"Σωκράτης","greek":"εἶεν· τί οὖν διανοῇ περὶ σαυτοῦ; πότερον ἐᾶν ὡς νῦν ἔχεις, ἢ ἐπιμέλειάν τινα ποιεῖσθαι;","english":"Very well. What do you intend about yourself, then? To leave yourself as you are, or to take some care of yourself?","g":{},"c":{},"turn":true},{"steph":"119b","speaker":"Ἀλκιβιάδης","greek":"κοινὴ βουλή, ὦ Σώκρατες. καίτοι ἐννοῶ σου εἰπόντος καὶ συγχωρῶ· δοκοῦσι γάρ μοι οἱ τὰ τῆς πόλεως πράττοντες ἐκτὸς ὀλίγων ἀπαίδευτοι εἶναι.","english":"Let us take counsel together, Socrates. And yet I understand what you have said and I agree: those who manage the city’s affairs, apart from a few, seem to me uneducated.","g":{},"c":{},"turn":true},{"steph":"119b","speaker":"Σωκράτης","greek":"εἶτα τί δὴ τοῦτο;","english":"And what then?","g":{},"c":{},"turn":true},{"steph":"119b","speaker":"Ἀλκιβιάδης","greek":"εἰ μέν που ἦσαν πεπαιδευμένοι, ἔδει ἂν τὸν ἐπιχειροῦντα αὐτοῖς ἀνταγωνίζεσθαι μαθόντα καὶ ἀσκήσαντα ἰέναι ὡς ἐπ᾽ ἀθλητάς· νῦν δ᾽ ἐπειδὴ καὶ οὗτοι ἰδιωτικῶς ἔχοντες{a} ἐληλύθασιν ἐπὶ τὰ τῆς πόλεως, τί δεῖ ἀσκεῖν καὶ μανθάνοντα πράγματα ἔχειν; ἐγὼ γὰρ εὖ οἶδ᾽ ὅτι τούτων |119c| τῇ γε φύσει πάνυ πολὺ περιέσομαι.","english":"If they were educated, anyone who undertook to compete against them would have to learn and train before going against them, as against athletes. But as it is, since even these have come into the city’s affairs as amateurs, why should I train and take the trouble of learning? For I know well that in natural ability, at least, I shall far surpass them.","g":{"a":["ἰδιωτικῶς ἔχοντες","“being in the state of private men,” i.e. amateurs. ἰδιώτης is a private citizen without office or training, the root of English *idiot*."]},"c":{},"turn":true},{"steph":"119c","speaker":"Σωκράτης","greek":"βαβαῖ, οἷον, ὦ ἄριστε, τοῦτ᾽ εἴρηκας· ὡς ἀνάξιον τῆς ἰδέας καὶ τῶν ἄλλων τῶν σοι ὑπαρχόντων.","english":"Oh dear, my excellent friend, what a thing you have said! How unworthy of your looks and your other advantages!","g":{},"c":{},"turn":true},{"steph":"119c","speaker":"Ἀλκιβιάδης","greek":"τί μάλιστα καὶ πρὸς τί τοῦτο λέγεις, ὦ Σώκρατες;","english":"What exactly do you mean, Socrates, and why?","g":{},"c":{},"turn":true},{"steph":"119c","speaker":"Σωκράτης","greek":"ἀγανακτῶ ὑπέρ τε σοῦ καὶ τοῦ ἐμαυτοῦ ἔρωτος.","english":"I am vexed on your behalf and on behalf of my love.","g":{},"c":{},"turn":true},{"steph":"119c","speaker":"Ἀλκιβιάδης","greek":"τί δή;","english":"Why?","g":{},"c":{},"turn":true},{"steph":"119c","speaker":"Σωκράτης","greek":"εἰ ἠξίωσας τὸν ἀγῶνά σοι εἶναι πρὸς τοὺς ἐνθάδε ἀνθρώπους.","english":"That you think your contest is against the people here.","g":{},"c":{},"turn":true},{"steph":"119c","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ πρὸς τίνας μήν;","english":"Against whom, then?","g":{},"c":{},"turn":true},{"steph":"119d","speaker":"Σωκράτης","greek":"ἄξιον τοῦτό γε καὶ ἐρέσθαι ἄνδρα οἰόμενον μεγαλόφρονα{b} εἶναι.","english":"That is a question worth asking, from a man who thinks himself great-minded.","g":{"b":["μεγαλόφρονα","“great-minded, proud”: Socrates throws back the word from 103b."]},"c":{},"turn":true},{"steph":"119d","speaker":"Ἀλκιβιάδης","greek":"πῶς λέγεις; οὐ πρὸς τούτους μοι ὁ ἀγών;","english":"What do you mean? Is my contest not against these?","g":{},"c":{},"turn":true},{"steph":"119d","speaker":"Σωκράτης","greek":"ἀλλὰ κἂν εἰ τριήρη{c} διενοοῦ κυβερνᾶν μέλλουσαν ναυμαχεῖν, ἤρκει ἄν σοι τῶν συνναυτῶν βελτίστῳ εἶναι τὰ κυβερνητικά, ἢ ταῦτα μὲν ᾤου ἂν δεῖν ὑπάρχειν, ἀπέβλεπες δ᾽ ἂν εἰς τοὺς ὡς ἀληθῶς ἀνταγωνιστάς, ἀλλ᾽ οὐχ ὡς νῦν εἰς τοὺς συναγωνιστάς;","english":"Well, if you were intending to steer a warship going into battle, would it be enough for you to be the best helmsman among your crew? Or would you think that this much must be taken for granted, and look to your true opponents, and not, as now, to your fellow combatants?","g":{"c":["τριήρη","accusative of τριήρης, the trireme, the Athenian warship with three banks of oars (τρι- + ἐρέσσω, row)."]},"c":{},"turn":true},{"steph":"119d","speaker":"Σωκράτης","greek":"ὧν δήπου περιγενέσθαι σε δεῖ τοσοῦτον |119e| ὥστε μὴ ἀξιοῦν ἀνταγωνίζεσθαι, ἀλλὰ καταφρονηθέντας συναγωνίζεσθαί σοι πρὸς τοὺς πολεμίους, εἰ δὴ τῷ ὄντι γε καλόν τι ἔργον ἀποδείξασθαι διανοῇ καὶ ἄξιον σαυτοῦ τε καὶ τῆς πόλεως.","english":"These, surely, you should surpass so far that they do not think of competing with you, but, looked down on, compete alongside you against the enemy, if you really intend to show some fine deed worthy of yourself and the city.","g":{},"c":{},"turn":false},{"steph":"119e","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ μὲν δὴ διανοοῦμαί γε.","english":"But that is just what I intend.","g":{},"c":{},"turn":true},{"steph":"119e","speaker":"Σωκράτης","greek":"πάνυ σοι ἄρα ἄξιον ἀγαπᾶν εἰ τῶν στρατιωτῶν βελτίων εἶ, ἀλλ᾽ οὐ πρὸς τοὺς τῶν ἀντιπάλων ἡγεμόνας ἀποβλέπειν εἴ ποτε ἐκείνων βελτίων γέγονας, σκοποῦντα καὶ ἀσκοῦντα πρὸς ἐκείνους.","english":"So it is quite worthy of you to be content if you are better than the soldiers, and not to look to the leaders of the enemy, to see whether you ever become better than they are, studying and training with them in view!","g":{},"c":{},"turn":true},{"steph":"120a","speaker":"Ἀλκιβιάδης","greek":"λέγεις δὲ τίνας τούτους, ὦ Σώκρατες;","english":"Whom do you mean, Socrates?","g":{},"c":{},"turn":true},{"steph":"120a","speaker":"Σωκράτης","greek":"οὐκ οἶσθα ἡμῶν τὴν πόλιν Λακεδαιμονίοις τε καὶ τῷ μεγάλῳ βασιλεῖ πολεμοῦσαν ἑκάστοτε;","english":"Do you not know that our city is at war, again and again, with the Spartans and the Great King?","g":{},"c":{},"turn":true},{"steph":"120a","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"That is true.","g":{},"c":{},"turn":true},{"steph":"120a","speaker":"Σωκράτης","greek":"οὐκοῦν εἴπερ ἐν νῷ ἔχεις ἡγεμὼν εἶναι τῆσδε τῆς πόλεως, πρὸς τοὺς Λακεδαιμονίων βασιλέας καὶ τοὺς Περσῶν τὸν ἀγῶνα ἡγούμενός σοι εἶναι ὀρθῶς ἂν ἡγοῖο;","english":"Then if you intend to be the leader of this city, would you not be right to think that your contest is against the kings of the Spartans and of the Persians?","g":{},"c":{},"turn":true},{"steph":"120a","speaker":"Ἀλκιβιάδης","greek":"κινδυνεύεις ἀληθῆ λέγειν.","english":"You may well be right.","g":{},"c":{},"turn":true},{"steph":"120a","speaker":"Σωκράτης","greek":"οὔκ, ὠγαθέ, ἀλλὰ πρὸς Μειδίαν σε δεῖ τὸν ὀρτυγοκόπον |120b| ἀποβλέπειν καὶ ἄλλους τοιούτους—οἳ τὰ τῆς πόλεως πράττειν ἐπιχειροῦσιν, ἔτι τὴν ἀνδραποδώδη, φαῖεν ἂν αἱ γυναῖκες, τρίχα ἔχοντες ἐν τῇ ψυχῇ ὑπ᾽ ἀμουσίας καὶ οὔπω ἀποβεβληκότες, ἔτι δὲ βαρβαρίζοντες ἐληλύθασι κολακεύσοντες τὴν πόλιν ἀλλ᾽ οὐκ ἄρξοντες—πρὸς τούτους σε δεῖ, οὕσπερ λέγω, βλέποντα σαυτοῦ δὴ ἀμελεῖν, καὶ μήτε μανθάνειν ὅσα μαθήσεως ἔχεται, μέλλοντα τοσοῦτον ἀγῶνα ἀγωνίζεσθαι, μήτε ἀσκεῖν ὅσα δεῖται ἀσκήσεως, |120c| καὶ πᾶσαν παρασκευὴν παρεσκευασμένον οὕτως ἰέναι ἐπὶ τὰ τῆς πόλεως.","english":"No, my good man; you must look to Meidias the quail-tapper{37} and others like him, who try to manage the city’s affairs still with the slave’s haircut in their souls, as the women would say, from their lack of culture, and have not yet cast it off; who have come, still talking like barbarians, to flatter the city, not to rule it. It is to these, I say, that you must look, and neglect yourself, and neither learn what needs learning, though you are about to compete in so great a contest, nor train in what needs training, and so go into the city’s affairs fully prepared!","g":{},"c":{"37":["Μειδίαν … τὸν ὀρτυγοκόπον","Quail-tapping was a gambling game: one tapped a quail on the head to see if it would stand its ground. Meidias was a politician mocked in comedy (Aristophanes, *Birds* 1297). The “slave’s haircut” in the soul means a servile mind."]},"turn":true},{"steph":"120c","speaker":"Ἀλκιβιάδης","greek":"ἀλλ᾽, ὦ Σώκρατες, δοκεῖς μέν μοι ἀληθῆ λέγειν, οἶμαι μέντοι τούς τε Λακεδαιμονίων στρατηγοὺς καὶ τὸν Περσῶν βασιλέα οὐδὲν διαφέρειν τῶν ἄλλων.","english":"But Socrates, I think you are right; and yet I think the Spartan generals and the Persian king are no different from anyone else.","g":{},"c":{},"turn":true},{"steph":"120c","speaker":"Σωκράτης","greek":"ἀλλ᾽, ὦ ἄριστε, τὴν οἴησιν ταύτην σκόπει οἵαν ἔχεις.","english":"But consider, my excellent friend, what this notion of yours is like.","g":{},"c":{},"turn":true},{"steph":"120c","speaker":"Ἀλκιβιάδης","greek":"τοῦ πέρι;","english":"In what respect?","g":{},"c":{},"turn":true},{"steph":"120c","speaker":"Σωκράτης","greek":"πρῶτον μὲν ποτέρως ἂν οἴει σαυτοῦ μᾶλλον ἐπιμεληθῆναι, |120d| φοβούμενός τε καὶ οἰόμενος δεινοὺς αὐτοὺς εἶναι, ἢ μή;","english":"First, in which case do you think you would take more care of yourself: if you feared them and thought them formidable, or if not?","g":{},"c":{},"turn":true},{"steph":"120d","speaker":"Ἀλκιβιάδης","greek":"δῆλον ὅτι εἰ δεινοὺς οἰοίμην.","english":"Clearly if I thought them formidable.","g":{},"c":{},"turn":true},{"steph":"120d","speaker":"Σωκράτης","greek":"μῶν οὖν οἴει τι βλαβήσεσθαι ἐπιμεληθεὶς σαυτοῦ;","english":"And do you think you would be harmed in any way by taking care of yourself?","g":{},"c":{},"turn":true},{"steph":"120d","speaker":"Ἀλκιβιάδης","greek":"οὐδαμῶς, ἀλλὰ καὶ μεγάλα ὀνήσεσθαι.","english":"Not at all; I would even benefit greatly.","g":{},"c":{},"turn":true},{"steph":"120d","speaker":"Σωκράτης","greek":"οὐκοῦν ἓν μὲν τοῦτο τοσοῦτον κακὸν ἔχει ἡ οἴησις αὕτη.","english":"So this notion has this one great evil in it.","g":{},"c":{},"turn":true},{"steph":"120d","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"True.","g":{},"c":{},"turn":true},{"steph":"120d","speaker":"Σωκράτης","greek":"τὸ δεύτερον τοίνυν, ὅτι καὶ ψευδής ἐστιν, ἐκ τῶν εἰκότων σκέψαι.","english":"Second, then, consider from what is likely that it is also false.","g":{},"c":{},"turn":true},{"steph":"120d","speaker":"Ἀλκιβιάδης","greek":"πῶς δή;","english":"How so?","g":{},"c":{},"turn":true},{"steph":"120d","speaker":"Σωκράτης","greek":"πότερον εἰκὸς ἀμείνους γίγνεσθαι φύσεις ἐν γενναίοις |120e| γένεσιν ἢ μή;","english":"Is it likely that better natures arise in noble families, or not?","g":{},"c":{},"turn":true},{"steph":"120e","speaker":"Ἀλκιβιάδης","greek":"δῆλον ὅτι ἐν τοῖς γενναίοις.","english":"Clearly in noble ones.","g":{},"c":{},"turn":true},{"steph":"120e","speaker":"Σωκράτης","greek":"οὐκοῦν τοὺς εὖ φύντας, ἐὰν καὶ εὖ τραφῶσιν, οὕτω τελέους γίγνεσθαι πρὸς ἀρετήν;","english":"And that those who are well born, if they are also well brought up, become complete in excellence?","g":{},"c":{},"turn":true},{"steph":"120e","speaker":"Ἀλκιβιάδης","greek":"ἀνάγκη.","english":"Necessarily.","g":{},"c":{},"turn":true},{"steph":"120e","speaker":"Σωκράτης","greek":"σκεψώμεθα δή, τοῖς ἐκείνων τὰ ἡμέτερα ἀντιτιθέντες, πρῶτον μὲν εἰ δοκοῦσι φαυλοτέρων γενῶν εἶναι οἱ Λακεδαιμονίων καὶ Περσῶν βασιλῆς. ἢ οὐκ ἴσμεν ὡς οἱ μὲν Ἡρακλέους, οἱ δὲ Ἀχαιμένους ἔκγονοι, τὸ δ᾽ Ἡρακλέους τε γένος καὶ τὸ Ἀχαιμένους εἰς Περσέα τὸν Διὸς ἀναφέρεται;","english":"Let us consider, then, setting our circumstances against theirs, first whether the kings of the Spartans and the Persians seem to be of meaner families. Do we not know that the one line descends from Heracles and the other from Achaemenes, and that the line of Heracles and that of Achaemenes both go back to Perseus son of Zeus{38}?","g":{},"c":{"38":["Ἡρακλέους … Ἀχαιμένους … Περσέα","The Spartan kings claimed descent from Heracles, the Persian kings from Achaemenes; Greek legend made Perseus the ancestor of both, and the Greeks derived the Persians’ name from his son Perses."]},"turn":true},{"steph":"121a","speaker":"Ἀλκιβιάδης","greek":"καὶ γὰρ τὸ ἡμέτερον, ὦ Σώκρατες, εἰς Εὐρυσάκη, τὸ δ᾽ Εὐρυσάκους εἰς Δία.","english":"Yes, and ours, Socrates, goes back to Eurysaces, and that of Eurysaces to Zeus.","g":{},"c":{},"turn":true},{"steph":"121a","speaker":"Σωκράτης","greek":"καὶ γὰρ τὸ ἡμέτερον, ὦ γενναῖε Ἀλκιβιάδη, εἰς Δαίδαλον, ὁ δὲ Δαίδαλος εἰς Ἥφαιστον τὸν Διός.","english":"Yes, and ours, noble Alcibiades, goes back to Daedalus{39}, and Daedalus to Hephaestus son of Zeus.","g":{},"c":{"39":["εἰς Δαίδαλον","Socrates’ father Sophroniscus was a stonemason, so Socrates jokingly claims descent from Daedalus, the legendary craftsman, and through him from Hephaestus, the craftsman god. The joke deflates Alcibiades’ boast of descent from Eurysaces, son of Ajax."]},"turn":true},{"steph":"121a","speaker":"Σωκράτης","greek":"ἀλλὰ τὰ μὲν τούτων ἀπ᾽ αὐτῶν ἀρξάμενα βασιλῆς εἰσιν ἐκ βασιλέων μέχρι Διός, οἱ μὲν Ἄργους τε καὶ Λακεδαίμονος, οἱ δὲ τῆς Περσίδος τὸ ἀεί, πολλάκις δὲ καὶ τῆς Ἀσίας, ὥσπερ καὶ νῦν· ἡμεῖς δὲ αὐτοί τε ἰδιῶται καὶ οἱ πατέρες. |121b| εἰ δὲ καὶ τοὺς προγόνους σε δέοι καὶ τὴν πατρίδα Εὐρυσάκους ἐπιδεῖξαι Σαλαμῖνα ἢ τὴν Αἰακοῦ τοῦ ἔτι προτέρου Αἴγιναν Ἀρτοξέρξῃ τῷ Ξέρξου, πόσον ἂν οἴει γέλωτα ὀφλεῖν;","english":"But in their case, starting from themselves, they are kings descended from kings all the way back to Zeus: the one kings of Argos and Sparta, the other always of Persia, and often of Asia too, as now; whereas we are private persons ourselves, and so were our fathers. And if you had to show off your ancestors, and Salamis, the homeland of Eurysaces, or Aegina, the homeland of Aeacus still earlier, to Artaxerxes son of Xerxes, how much laughter do you think you would earn?","g":{},"c":{},"turn":false},{"steph":"121b","speaker":"Σωκράτης","greek":"ἀλλ᾽ ὅρα μὴ τοῦ τε γένους ὄγκῳ ἐλαττώμεθα τῶν ἀνδρῶν καὶ τῇ ἄλλῃ τροφῇ. ἢ οὐκ ᾔσθησαι τοῖς τε Λακεδαιμονίων βασιλεῦσιν ὡς μεγάλα τὰ ὑπάρχοντα, ὧν αἱ γυναῖκες δημοσίᾳ φυλάττονται ὑπὸ τῶν ἐφόρων{a}, ὅπως εἰς δύναμιν μὴ λάθῃ ἐξ ἄλλου γενόμενος ὁ βασιλεὺς ἢ ἐξ |121c| Ἡρακλειδῶν;","english":"But see whether we do not fall short of these men both in the dignity of birth and in the rest of their upbringing. Have you not noticed how great are the advantages of the Spartan kings, whose wives are guarded at public expense by the ephors, so that as far as possible the king may not be born, without anyone knowing it, from any but the Heraclids?","g":{"a":["ἐφόρων","genitive plural of ἔφορος, “overseer,” the five annually elected magistrates of Sparta (ἐπί + ὁράω, see)."]},"c":{},"turn":false},{"steph":"121c","speaker":"Σωκράτης","greek":"ὁ δὲ Περσῶν τοσοῦτον ὑπερβάλλει, ὥστ᾽ οὐδεὶς ὑποψίαν ἔχει ὡς ἐξ ἄλλου ἂν βασιλεὺς γένοιτο ἢ ἐξ αὐτοῦ· διὸ οὐ φρουρεῖται ἡ βασιλέως γυνὴ ἀλλ᾽ ἢ ὑπὸ φόβου.","english":"And the Persian king so far surpasses this that no one has any suspicion that a king could be born from anyone but himself; and so the king’s wife is guarded by nothing but fear.","g":{},"c":{},"turn":false},{"steph":"121c","speaker":"Σωκράτης","greek":"ἐπειδὰν δὲ γένηται ὁ παῖς ὁ πρεσβύτατος, οὗπερ ἡ ἀρχή, πρῶτον μὲν ἑορτάζουσι πάντες οἱ ἐν τῇ βασιλέως, ὧν ἂν ἄρχῃ, εἶτα εἰς τὸν ἄλλον χρόνον ταύτῃ τῇ ἡμέρᾳ βασιλέως γενέθλια{b} πᾶσα θύει καὶ ἑορτάζει ἡ Ἀσία· ἡμῶν |121d| δὲ γενομένων, τὸ τοῦ κωμῳδοποιοῦ, οὐδ᾽ οἱ γείτονες σφόδρα τι αἰσθάνονται, ὦ Ἀλκιβιάδη.","english":"When the eldest son is born, to whom the rule belongs, first all those in the king’s realm, as many as he rules, hold a feast, and then for all time afterward on that day the whole of Asia sacrifices and feasts for the king’s birthday. But when we are born, as the comic poet says, not even the neighbors notice much, Alcibiades.","g":{"b":["γενέθλια","“birthday celebrations,” from γένεθλον, birth; same root as *genesis*, *genealogy*."]},"c":{},"turn":false},{"steph":"121d","speaker":"Σωκράτης","greek":"μετὰ τοῦτο τρέφεται ὁ παῖς, οὐχ ὑπὸ γυναικὸς τροφοῦ ὀλίγου ἀξίας, ἀλλ᾽ ὑπ᾽ εὐνούχων οἳ ἂν δοκῶσιν τῶν περὶ βασιλέα ἄριστοι εἶναι· οἷς τά τε ἄλλα προστέτακται ἐπιμέλεσθαι τοῦ γενομένου, καὶ ὅπως ὅτι κάλλιστος ἔσται μηχανᾶσθαι, ἀναπλάττοντας τὰ μέλη τοῦ παιδὸς καὶ κατορθοῦντας· καὶ ταῦτα δρῶντες |121e| ἐν μεγάλῃ τιμῇ εἰσιν.","english":"After this the child is brought up, not by a nurse of little worth, but by eunuchs who are thought the best of those about the king. They are charged with taking care of the newborn in every way, and with contriving that he become as handsome as possible, shaping and straightening the child’s limbs; and for doing this they are held in great honor.","g":{},"c":{},"turn":false},{"steph":"121e","speaker":"Σωκράτης","greek":"ἐπειδὰν δὲ ἑπτέτεις γένωνται οἱ παῖδες, ἐπὶ τοὺς ἵππους καὶ ἐπὶ τοὺς τούτων διδασκάλους φοιτῶσιν, καὶ ἐπὶ τὰς θήρας ἄρχονται ἰέναι. δὶς ἑπτὰ δὲ γενόμενον ἐτῶν τὸν παῖδα παραλαμβάνουσιν οὓς ἐκεῖνοι βασιλείους παιδαγωγοὺς ὀνομάζουσιν· εἰσὶ δὲ ἐξειλεγμένοι Περσῶν οἱ ἄριστοι δόξαντες ἐν ἡλικίᾳ τέτταρες, ὅ τε σοφώτατος καὶ ὁ δικαιότατος καὶ ὁ σωφρονέστατος καὶ ὁ |122a| ἀνδρειότατος.","english":"When the boys are seven years old they go to the horses and their riding masters, and begin to go out hunting. And when the boy is twice seven, he is taken over by those they call the royal tutors. These are four chosen men, the Persians judged best in their prime: the wisest, the most just, the most temperate and the most courageous.","g":{},"c":{},"turn":false},{"steph":"122a","speaker":"Σωκράτης","greek":"ὧν ὁ μὲν μαγείαν τε διδάσκει τὴν Ζωροάστρου τοῦ Ὡρομάζου—ἔστι δὲ τοῦτο θεῶν θεραπεία— διδάσκει δὲ καὶ τὰ βασιλικά, ὁ δὲ δικαιότατος ἀληθεύειν διὰ παντὸς τοῦ βίου, ὁ δὲ σωφρονέστατος μηδ᾽ ὑπὸ μιᾶς ἄρχεσθαι τῶν ἡδονῶν, ἵνα ἐλεύθερος εἶναι ἐθίζηται καὶ ὄντως βασιλεύς, ἄρχων πρῶτον τῶν ἐν αὑτῷ ἀλλὰ μὴ δουλεύων, ὁ δὲ ἀνδρειότατος ἄφοβον καὶ ἀδεᾶ παρασκευάζων, ὡς ὅταν δείσῃ δοῦλον ὄντα· σοὶ δ᾽, ὦ Ἀλκιβιάδη, |122b| Περικλῆς ἐπέστησε παιδαγωγὸν τῶν οἰκετῶν τὸν ἀχρειότατον ὑπὸ γήρως, Ζώπυρον τὸν Θρᾷκα.","english":"The first teaches him the magian lore of Zoroaster son of Horomazes{40}, which is the worship of the gods, and he also teaches him the things of kingship; the most just teaches him to speak the truth all his life; the most temperate, not to be ruled by even a single one of his pleasures, so that he may become used to being free and truly a king, ruling first the things within himself and not being their slave; the most courageous makes him fearless and undaunted, telling him that when he is afraid he is a slave. But for you, Alcibiades, Pericles set as tutor the one of his household servants most useless from old age, Zopyrus the Thracian{41}.","g":{},"c":{"40":["μαγείαν … Ζωροάστρου τοῦ Ὡρομάζου","The earliest mention of Zoroaster in Greek literature. Horomazes is Ahura Mazda, the supreme god of Zoroastrianism. The Magi were Persian priests; μαγεία, “magian lore,” gives *magic*."],"41":["τὸν ἀχρειότατον ὑπὸ γήρως","The four royal tutors stand for the four cardinal virtues: wisdom, justice, temperance and courage. Against them Socrates sets Alcibiades’ single tutor, an old slave. A παιδαγωγός was the slave who escorted a boy to school, whence *pedagogue*."]},"turn":true},{"steph":"122b","speaker":"Σωκράτης","greek":"διῆλθον δὲ καὶ τὴν ἄλλην ἄν σοι τῶν ἀνταγωνιστῶν τροφήν τε καὶ παιδείαν, εἰ μὴ πολὺ ἔργον ἦν καὶ ἅμα ταῦθ᾽ ἱκανὰ δηλῶσαι καὶ τἆλλα ὅσα τούτοις ἀκόλουθα· τῆς δὲ σῆς γενέσεως, ὦ Ἀλκιβιάδη, καὶ τροφῆς καὶ παιδείας, ἢ ἄλλου ὁτουοῦν Ἀθηναίων, ὡς ἔπος εἰπεῖν οὐδενὶ μέλει, εἰ μὴ εἴ τις ἐραστής σου τυγχάνει ὤν.","english":"I could go through the rest of your rivals’ upbringing and education too, if it were not a long task, and these things are enough to show the rest that follows from them. But as for your birth, Alcibiades, and upbringing and education, or that of any other Athenian, no one cares about it, so to speak, unless it happens to be some lover of yours.","g":{},"c":{},"turn":false},{"steph":"122b","speaker":"Σωκράτης","greek":"εἰ δ᾽ αὖ ἐθέλεις εἰς πλούτους |122c| ἀποβλέψαι καὶ τρυφὰς καὶ ἐσθῆτας ἱματίων θ᾽ ἕλξεις καὶ μύρων ἀλοιφὰς καὶ θεραπόντων πλήθους ἀκολουθίας τήν τε ἄλλην ἁβρότητα τὴν Περσῶν, αἰσχυνθείης ἂν ἐπὶ σεαυτῷ, αἰσθόμενος ὅσον αὐτῶν ἐλλείπεις.","english":"Again, if you are willing to look at the wealth of the Persians, their luxury, their clothes and trailing robes, their perfumed ointments, their retinues of crowds of servants and the rest of their refinement, you would be ashamed of yourself, seeing how far short of them you fall.","g":{},"c":{},"turn":false},{"steph":"122c","speaker":"Σωκράτης","greek":"εἰ δ᾽ αὖ ἐθελήσεις εἰς σωφροσύνην τε καὶ κοσμιότητα ἀποβλέψαι καὶ εὐχέρειαν καὶ εὐκολίαν καὶ μεγαλοφροσύνην καὶ εὐταξίαν καὶ ἀνδρείαν καὶ καρτερίαν καὶ φιλοπονίαν καὶ φιλονικίαν καὶ φιλοτιμίας{a} τὰς Λακεδαιμονίων, παῖδ᾽ ἂν ἡγήσαιο σαυτὸν πᾶσι τοῖς |122d| τοιούτοις. εἰ δ᾽ αὖ τι καὶ πλούτῳ προσέχεις καὶ κατὰ τοῦτο οἴει τι εἶναι, μηδὲ τοῦθ᾽ ἡμῖν ἄρρητον ἔστω, ἐάν πως αἴσθῃ οὗ εἶ.","english":"And if you are willing to look at the temperance and orderliness of the Spartans, their good temper and ease, their greatness of mind, their discipline, courage, endurance, love of labor, love of victory and love of honor, you would think yourself a child in all such things. And if you pay any attention to wealth and think yourself something on that account, let us not leave this unsaid either, in case you somehow see where you stand.","g":{"a":["φιλοπονίαν καὶ φιλονικίαν καὶ φιλοτιμίας","three compounds of φιλ- “love of”: labor (πόνος), victory (νίκη), honor (τιμή). Compare *philosophy*, *Nike*."]},"c":{},"turn":false},{"steph":"122d","speaker":"Σωκράτης","greek":"τοῦτο μὲν γὰρ εἰ ἐθέλεις ⟨εἰς⟩ τοὺς Λακεδαιμονίων πλούτους ἰδεῖν, γνώσῃ ὅτι πολὺ τἀνθάδε τῶν ἐκεῖ ἐλλείπει· γῆν μὲν γὰρ ὅσην ἔχουσιν τῆς θ᾽ ἑαυτῶν καὶ Μεσσήνης, οὐδ᾽ ἂν εἷς ἀμφισβητήσειε τῶν τῇδε πλήθει οὐδ᾽ ἀρετῇ, οὐδ᾽ αὖ ἀνδραπόδων κτήσει τῶν τε ἄλλων καὶ τῶν εἱλωτικῶν, οὐδὲ μὴν ἵππων γε, οὐδ᾽ ὅσα ἄλλα βοσκήματα |122e| κατὰ Μεσσήνην νέμεται.","english":"For if you are willing to look at the wealth of the Spartans, you will recognize that ours falls far short of theirs. Consider the land they have, in their own country and in Messene: no one here could dispute it with them for extent or quality, nor for the number of slaves they own, the helots especially, nor of horses, nor of all the other flocks that graze in Messene.","g":{},"c":{},"turn":false},{"steph":"122e","speaker":"Σωκράτης","greek":"ἀλλὰ ταῦτα μὲν πάντα ἐῶ χαίρειν, χρυσίον δὲ καὶ ἀργύριον οὐκ ἔστιν ἐν πᾶσιν Ἕλλησιν ὅσον ἐν Λακεδαίμονι ἰδίᾳ· πολλὰς γὰρ ἤδη γενεὰς εἰσέρχεται μὲν αὐτόσε ἐξ ἁπάντων τῶν Ἑλλήνων, πολλάκις δὲ καὶ ἐκ τῶν βαρβάρων, ἐξέρχεται δὲ οὐδαμόσε, |123a| ἀλλ᾽ ἀτεχνῶς κατὰ τὸν Αἰσώπου μῦθον ὃν ἡ ἀλώπηξ πρὸς τὸν λέοντα εἶπεν, καὶ τοῦ εἰς Λακεδαίμονα νομίσματος εἰσιόντος μὲν τὰ ἴχνη τὰ ἐκεῖσε τετραμμένα δῆλα, ἐξιόντος δὲ οὐδαμῇ ἄν τις ἴδοι.","english":"But I let all these go. Of gold and silver, there is not as much in all of Greece as there is privately in Sparta. For many generations now it has been coming in there from all the Greeks, and often from the barbarians too, and going out nowhere; just as in Aesop’s fable{42} that the fox told the lion, the tracks of the money going into Sparta, turned that way, are plain to see, but of money coming out one would see none anywhere.","g":{},"c":{"42":["κατὰ τὸν Αἰσώπου μῦθον","The sick lion invited the animals into his den; the fox declined, noting that all the tracks led in and none came out. Sparta, like the lion’s cave, takes in money and lets none out."]},"turn":false},{"steph":"123a","speaker":"Σωκράτης","greek":"ὥστε εὖ χρὴ εἰδέναι ὅτι καὶ χρυσῷ καὶ ἀργύρῳ οἱ ἐκεῖ πλουσιώτατοί εἰσιν τῶν Ἑλλήνων, καὶ αὐτῶν ἐκείνων ὁ βασιλεύς· ἔκ τε γὰρ τῶν τοιούτων μέγισται λήψεις καὶ πλεῖσταί εἰσι τοῖς βασιλεῦσιν, ἔτι δὲ καὶ ὁ βασιλικὸς φόρος οὐκ ὀλίγος γίγνεται, ὃν τελοῦσιν οἱ Λακεδαιμόνιοι |123b| τοῖς βασιλεῦσιν.","english":"So one must know well that the people there are the richest of the Greeks in gold and silver, and their king the richest of them all. For the kings have the greatest and most numerous receipts from such sources, and besides there is no small royal tribute which the Spartans pay to their kings.","g":{},"c":{},"turn":true},{"steph":"123b","speaker":"Σωκράτης","greek":"καὶ τὰ μὲν Λακεδαιμονίων ὡς πρὸς Ἑλληνικοὺς μὲν πλούτους μεγάλα, ὡς δὲ πρὸς τοὺς Περσικοὺς καὶ τοῦ ἐκείνων βασιλέως οὐδέν.","english":"And the Spartans’ wealth is great compared with Greek wealth, but compared with that of the Persians and their king it is nothing.","g":{},"c":{},"turn":false},{"steph":"123b","speaker":"Σωκράτης","greek":"ἐπεί ποτ᾽ ἐγὼ ἤκουσα ἀνδρὸς ἀξιοπίστου τῶν ἀναβεβηκότων παρὰ βασιλέα, ὃς ἔφη παρελθεῖν χώραν πάνυ πολλὴν καὶ ἀγαθήν, ἐγγὺς ἡμερησίαν ὁδόν, ἣν καλεῖν τοὺς ἐπιχωρίους ζώνην τῆς βασιλέως γυναικός· εἶναι δὲ καὶ ἄλλην ἣν αὖ καλεῖσθαι |123c| καλύπτραν, καὶ ἄλλους πολλοὺς τόπους καλοὺς καὶ ἀγαθοὺς εἰς τὸν κόσμον ἐξῃρημένους τὸν τῆς γυναικός, καὶ ὀνόματα ἔχειν ἑκάστους τ
