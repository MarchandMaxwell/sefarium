ῶν τόπων ἀπὸ ἑκάστου τῶν κόσμων.","english":"For I once heard a trustworthy man, one of those who had gone up to the king’s court, say that he passed through a large and fertile territory, nearly a day’s journey across, which the inhabitants called the queen’s girdle; and there was another which in turn was called her veil, and many other fine and fertile places set aside for the queen’s adornment, each place named after one of her adornments.","g":{},"c":{},"turn":false},{"steph":"123c","speaker":"Σωκράτης","greek":"ὥστ᾽ οἶμαι ἐγώ, εἴ τις εἴποι τῇ βασιλέως μητρί, Ξέρξου δὲ γυναικί, Ἀμήστριδι, ὅτι ἐν νῷ ἔχει σοῦ τῷ ὑεῖ ἀντιτάττεσθαι ὁ Δεινομάχης ὑός, ᾗ ἔστι κόσμος ἴσως ἄξιος μνῶν πεντήκοντα εἰ πάνυ πολλοῦ, τῷ δ᾽ ὑεῖ αὐτῆς γῆς πλέθρα Ἐρχίασιν οὐδὲ τριακόσια, θαυμάσαι ἂν ὅτῳ ποτὲ πιστεύων |123d| ἐν νῷ ἔχει οὗτος ὁ Ἀλκιβιάδης τῷ Ἀρτοξέρξῃ διαγωνίζεσθαι, καὶ οἶμαι ἂν αὐτὴν εἰπεῖν ὅτι οὐκ ἔσθ᾽ ὅτῳ ἄλλῳ πιστεύων οὗτος ἀνὴρ ἐπιχειρεῖ πλὴν ἐπιμελείᾳ τε καὶ σοφίᾳ· ταῦτα γὰρ μόνα ἄξια λόγου ἐν Ἕλλησιν.","english":"So I think that if someone said to the king’s mother, Amestris, the wife of Xerxes, that the son of Deinomache intends to set himself against her son, a woman whose adornments are worth perhaps fifty minas at the very most, and whose son has not even three hundred acres of land at Erchiae{43}, she would wonder what this Alcibiades can be relying on that he intends to contend with Artaxerxes. And I think she would say that there is nothing else this man can be relying on in his attempt except care and wisdom; for these are the only things of any account among the Greeks.","g":{},"c":{"43":["Ἀμήστριδι … Ἐρχίασιν","Amestris, the formidable queen of Xerxes, mother of Artaxerxes I. Erchiae was the Attic district (deme) where Alcibiades owned land; a πλέθρον was about a tenth of an acre, so his estate was small by Persian measure."]},"turn":false},{"steph":"123d","speaker":"Σωκράτης","greek":"ἐπεὶ εἴ γε πύθοιτο ὅτι Ἀλκιβιάδης οὗτος νῦν ἐπιχειρεῖ πρῶτον μὲν ἔτη οὐδέπω γεγονὼς σφόδρα εἴκοσιν, ἔπειτα παντάπασιν ἀπαίδευτος, πρὸς δὲ τούτοις, τοῦ ἐραστοῦ αὐτῷ λέγοντος ὅτι χρὴ πρῶτον μαθόντα καὶ ἐπιμεληθέντα αὑτοῦ |123e| καὶ ἀσκήσαντα οὕτως ἰέναι διαγωνιούμενον βασιλεῖ, οὐκ ἐθέλει, ἀλλά φησιν ἐξαρκεῖν καὶ ὡς ἔχει, οἶμαι ἂν αὐτὴν θαυμάσαι τε καὶ ἐρέσθαι· τί οὖν ποτ᾽ ἔστιν ὅτῳ πιστεύει τὸ μειράκιον{a};","english":"For if she learned that this Alcibiades is now making the attempt, first, when he is not yet quite twenty years old, second, wholly uneducated, and besides, when his lover tells him that he must first learn and take care of himself and train, and only then go to contend with the king, he refuses, and says he is good enough as he is; I think she would be amazed and ask, ‘What then can the lad be relying on?’","g":{"a":["τὸ μειράκιον","“the lad,” a diminutive of μεῖραξ, a youth around eighteen to twenty; often a little condescending."]},"c":{},"turn":false},{"steph":"123e","speaker":"Σωκράτης","greek":"εἰ οὖν λέγοιμεν ὅτι κάλλει τε καὶ μεγέθει καὶ γένει καὶ πλούτῳ καὶ φύσει τῆς ψυχῆς, ἡγήσαιτ᾽ ἂν ἡμᾶς, ὦ Ἀλκιβιάδη, μαίνεσθαι πρὸς τὰ παρὰ σφίσιν ἀποβλέψασα πάντα τὰ τοιαῦτα.","english":"And if we said, on his beauty and stature and birth and wealth and natural gifts of soul, she would think us mad, Alcibiades, looking to everything of that kind they have at home.","g":{},"c":{},"turn":false},{"steph":"123e","speaker":"Σωκράτης","greek":"οἶμαι δὲ κἂν Λαμπιδώ, τὴν |124a| Λεωτυχίδου μὲν θυγατέρα, Ἀρχιδάμου δὲ γυναῖκα, Ἄγιδος δὲ μητέρα, οἳ πάντες βασιλῆς γεγόνασιν, θαυμάσαι ἂν καὶ ταύτην εἰς τὰ παρὰ σφίσιν ὑπάρχοντα ἀποβλέψασαν, εἰ σὺ ἐν νῷ ἔχεις τῷ ὑεῖ αὐτῆς διαγωνίζεσθαι οὕτω κακῶς ἠγμένος.","english":"And I think Lampido too{44}, the daughter of Leotychides, wife of Archidamus and mother of Agis, all of whom have been kings, would be amazed, looking to what they have at home, that you intend to contend with her son when you have been so badly brought up.","g":{},"c":{"44":["Λαμπιδώ","A real Spartan queen: daughter of King Leotychides, wife of King Archidamus II, mother of King Agis II. Agis would later be Alcibiades’ enemy, after Alcibiades seduced his wife during his exile in Sparta (Plutarch, *Alcibiades* 23)."]},"turn":true},{"steph":"124a","speaker":"Σωκράτης","greek":"καίτοι οὐκ αἰσχρὸν δοκεῖ εἶναι, εἰ αἱ τῶν πολεμίων γυναῖκες βέλτιον περὶ ἡμῶν διανοοῦνται, οἵους χρὴ ὄντας σφίσιν ἐπιχειρεῖν, ἢ ἡμεῖς περὶ ἡμῶν αὐτῶν;","english":"And yet does it not seem shameful that the women of our enemies should have a better idea of what sort of men we must be to attack them than we have of ourselves?","g":{},"c":{},"turn":false},{"steph":"124a","speaker":"Σωκράτης","greek":"ἀλλ᾽, ὦ μακάριε, πειθόμενος ἐμοί τε καὶ τῷ ἐν Δελφοῖς γράμματι, γνῶθι |124b| σαυτόν, ὅτι οὗτοι ἡμῖν εἰσιν ἀντίπαλοι, ἀλλ᾽ οὐχ οὓς σὺ οἴει· ὧν ἄλλῳ μὲν οὐδ᾽ ἂν ἑνὶ περιγενοίμεθα, εἰ μή περ ἐπιμελείᾳ γε ἂν καὶ τέχνῃ. ὧν σὺ εἰ ἀπολειφθήσῃ{a}, καὶ τοῦ ὀνομαστὸς γενέσθαι ἀπολειφθήσῃ ἐν Ἕλλησί τε καὶ βαρβάροις, οὗ μοι δοκεῖς ἐρᾶν ὡς οὐδεὶς ἄλλος ἄλλου.","english":"No, my blessed friend: be persuaded by me and by the inscription at Delphi, ‘Know yourself,’{45} that these are our rivals, not the ones you think. And we could get the better of them by nothing else than by care and skill. If you fall short of these, you will also fall short of becoming famous among Greeks and barbarians, which you seem to me to love as no one has ever loved anything.","g":{"a":["ἀπολειφθήσῃ","2nd sing. future passive of ἀπολείπω, “you will be left behind, fall short of” (+ genitive)."]},"c":{"45":["γνῶθι σαυτόν","The maxim inscribed at Apollo’s temple at Delphi. Here it first means “know your place, know who your real rivals are”; by 129a–133c Socrates will turn it into the dialogue’s great question: what is the self that one must know?"]},"turn":false},{"steph":"124b","speaker":"Ἀλκιβιάδης","greek":"τίνα οὖν χρὴ τὴν ἐπιμέλειαν, ὦ Σώκρατες, ποιεῖσθαι; ἔχεις ἐξηγήσασθαι; παντὸς γὰρ μᾶλλον ἔοικας ἀληθῆ εἰρηκότι.","english":"What sort of care, then, Socrates, must one take? Can you explain? For you seem to have spoken the truth more than anyone.","g":{},"c":{},"turn":true},{"steph":"124b","speaker":"Σωκράτης","greek":"ναί· ἀλλὰ γὰρ κοινὴ βουλὴ ᾧτινι τρόπῳ ἂν ὅτι |124c| βέλτιστοι γενοίμεθα. ἐγὼ γάρ τοι οὐ περὶ μὲν σοῦ λέγω ὡς χρὴ παιδευθῆναι, περὶ ἐμοῦ δὲ οὔ· οὐ γὰρ ἔσθ᾽ ὅτῳ σου διαφέρω πλήν γ᾽ ἑνί.","english":"Yes; but it is a matter for joint counsel, in what way we might become as good as possible. For I am not saying that you need to be educated and I do not; there is no respect in which I differ from you, except one.","g":{},"c":{},"turn":true},{"steph":"124c","speaker":"Ἀλκιβιάδης","greek":"τίνι;","english":"What is that?","g":{},"c":{},"turn":true},{"steph":"124c","speaker":"Σωκράτης","greek":"ὁ ἐπίτροπος ὁ ἐμὸς βελτίων ἐστὶ καὶ σοφώτερος ἢ Περικλῆς ὁ σός.","english":"My guardian is better and wiser than Pericles, your guardian.","g":{},"c":{},"turn":true},{"steph":"124c","speaker":"Ἀλκιβιάδης","greek":"τίς οὗτος, ὦ Σώκρατες;","english":"Who is he, Socrates?","g":{},"c":{},"turn":true},{"steph":"124c","speaker":"Σωκράτης","greek":"θεός, ὦ Ἀλκιβιάδη, ὅσπερ σοί με οὐκ εἴα πρὸ τῆσδε τῆς ἡμέρας διαλεχθῆναι· ᾧ καὶ πιστεύων λέγω ὅτι ἡ ἐπιφάνεια{b} δι᾽ οὐδενὸς ἄλλου σοι ἔσται ἢ δι᾽ ἐμοῦ.","english":"A god, Alcibiades{46}, the very one who would not let me talk with you before this day. And it is trusting him that I say your renown will come to you through no one but me.","g":{"b":["ἡ ἐπιφάνεια","“renown, coming into view,” from ἐπιφαίνομαι, appear; hence *epiphany*."]},"c":{"46":["θεός","Socrates’ guardian (ἐπίτροπος) is the god who sends his divine sign, set against Alcibiades’ human guardian Pericles. The claim is half joke (Alcibiades says “you are joking”) and half serious: Socrates presents his teaching as divinely sanctioned care."]},"turn":true},{"steph":"124d","speaker":"Ἀλκιβιάδης","greek":"παίζεις, ὦ Σώκρατες.","english":"You are joking, Socrates.","g":{},"c":{},"turn":true},{"steph":"124d","speaker":"Σωκράτης","greek":"ἴσως· λέγω μέντοι ἀληθῆ, ὅτι ἐπιμελείας δεόμεθα, μᾶλλον μὲν πάντες ἄνθρωποι, ἀτὰρ νώ{c} γε καὶ μάλα σφόδρα.","english":"Perhaps. But I am telling the truth in saying that we need care: all men do, but the two of us very much indeed.","g":{"c":["νώ","dual pronoun, “we two.” Socrates puts himself beside Alcibiades: both need care."]},"c":{},"turn":true},{"steph":"124d","speaker":"Ἀλκιβιάδης","greek":"ὅτι μὲν ἐγώ, οὐ ψεύδῃ.","english":"That I do, you are not lying.","g":{},"c":{},"turn":true},{"steph":"124d","speaker":"Σωκράτης","greek":"οὐδὲ μὴν ὅτι γε ἐγώ.","english":"Nor that I do.","g":{},"c":{},"turn":true},{"steph":"124d","speaker":"Ἀλκιβιάδης","greek":"τί οὖν ἂν ποιοῖμεν;","english":"What should we do, then?","g":{},"c":{},"turn":true},{"steph":"124d","speaker":"Σωκράτης","greek":"οὐκ ἀπορρητέον οὐδὲ μαλθακιστέον{d}, ὦ ἑταῖρε.","english":"We must not give up or go soft, my friend.","g":{"d":["ἀπορρητέον οὐδὲ μαλθακιστέον","two verbal adjectives of necessity: “one must not give up, nor go soft” (μαλθακός, soft)."]},"c":{},"turn":true},{"steph":"124d","speaker":"Ἀλκιβιάδης","greek":"οὔτοι δὴ πρέπει γ᾽, ὦ Σώκρατες.","english":"That would certainly not be fitting, Socrates.","g":{},"c":{},"turn":true},{"steph":"124d","speaker":"Σωκράτης","greek":"οὐ γάρ, ἀλλὰ σκεπτέον κοινῇ. καί μοι λέγε· |124e| φαμὲν γὰρ δὴ ὡς ἄριστοι βούλεσθαι γενέσθαι. ἦ γάρ;","english":"No; we must consider it together. Tell me: we say we want to become as good as possible. Is that so?","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Σωκράτης","greek":"τίνα ἀρετήν;","english":"In what excellence?","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Ἀλκιβιάδης","greek":"δῆλον ὅτι ἥνπερ οἱ ἄνδρες οἱ ἀγαθοί.","english":"Clearly that in which good men are good.","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Σωκράτης","greek":"οἱ τί ἀγαθοί;","english":"Good at what?","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Ἀλκιβιάδης","greek":"δῆλον ὅτι οἱ πράττειν τὰ πράγματα.","english":"Clearly at managing affairs.","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Σωκράτης","greek":"ποῖα; ἆρα τὰ ἱππικά;","english":"What sort? Horsemanship?","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Σωκράτης","greek":"παρὰ τοὺς ἱππικοὺς γὰρ ἂν ᾖμεν;","english":"For then we would go to horsemen?","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Σωκράτης","greek":"ἀλλὰ τὰ ναυτικὰ λέγεις;","english":"Seamanship, then, do you mean?","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Ἀλκιβιάδης","greek":"οὔ.","english":"No.","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Σωκράτης","greek":"παρὰ τοὺς ναυτικοὺς γὰρ ἂν ᾖμεν;","english":"For then we would go to seamen?","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Σωκράτης","greek":"ἀλλὰ ποῖα; ἃ τίνες πράττουσιν;","english":"What sort, then? The affairs that which men manage?","g":{},"c":{},"turn":true},{"steph":"124e","speaker":"Ἀλκιβιάδης","greek":"ἅπερ Ἀθηναίων οἱ καλοὶ κἀγαθοί.","english":"Those that the fine and good men of Athens{47} manage.","g":{},"c":{"47":["οἱ καλοὶ κἀγαθοί","καλὸς κἀγαθός, “fine and good,” was the Athenian phrase for a gentleman of the upper class. Socrates takes the social label literally and asks what knowledge makes a man good."]},"turn":true},{"steph":"125a","speaker":"Σωκράτης","greek":"καλοὺς δὲ κἀγαθοὺς λέγεις τοὺς φρονίμους ἢ τοὺς ἄφρονας;","english":"And by fine and good do you mean the sensible or the senseless?","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Ἀλκιβιάδης","greek":"τοὺς φρονίμους.","english":"The sensible.","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Σωκράτης","greek":"οὐκοῦν ὃ ἕκαστος φρόνιμος, τοῦτ᾽ ἀγαθός;","english":"And each man is good at that in which he is sensible?","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Σωκράτης","greek":"ὃ δὲ ἄφρων, πονηρός;","english":"And bad at that in which he is senseless?","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν ὁ σκυτοτόμος{a} φρόνιμος εἰς ὑποδημάτων ἐργασίαν;","english":"Is the shoemaker, then, sensible about making shoes?","g":{"a":["ὁ σκυτοτόμος","“leather-cutter,” shoemaker; σκῦτος (hide) + τέμνω (cut), as in *anatomy*, *atom*."]},"c":{},"turn":true},{"steph":"125a","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Σωκράτης","greek":"ἀγαθὸς ἄρ᾽ εἰς αὐτά;","english":"Then he is good at it?","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Ἀλκιβιάδης","greek":"ἀγαθός.","english":"Good.","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Σωκράτης","greek":"τί δ᾽; εἰς ἱματίων ἐργασίαν οὐκ ἄφρων ὁ σκυτοτόμος;","english":"Well then: about making clothes, is not the shoemaker senseless?","g":{},"c":{},"turn":true},{"steph":"125a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Σωκράτης","greek":"κακὸς ἄρα εἰς τοῦτο;","english":"Then bad at it?","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Σωκράτης","greek":"ὁ αὐτὸς ἄρα τούτῳ γε τῷ λόγῳ κακός τε καὶ ἀγαθός.","english":"Then by this account the same man is both bad and good.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Σωκράτης","greek":"ἦ οὖν λέγεις τοὺς ἀγαθοὺς ἄνδρας εἶναι καὶ κακούς;","english":"Do you say, then, that good men are also bad?","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Σωκράτης","greek":"ἀλλὰ τίνας ποτὲ τοὺς ἀγαθοὺς λέγεις;","english":"Then whom on earth do you mean by the good?","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Ἀλκιβιάδης","greek":"τοὺς δυναμένους ἔγωγε ἄρχειν ἐν τῇ πόλει.","english":"I mean those who are able to rule in the city.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Σωκράτης","greek":"οὐ δήπου ἵππων γε;","english":"Not over horses, surely?","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Σωκράτης","greek":"ἀλλ᾽ ἀνθρώπων;","english":"Over men, then?","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Σωκράτης","greek":"ἆρα καμνόντων;","english":"Over men who are sick?","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Ἀλκιβιάδης","greek":"οὔ.","english":"No.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Σωκράτης","greek":"ἀλλὰ πλεόντων;","english":"Who are sailing, then?","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Ἀλκιβιάδης","greek":"οὔ φημι.","english":"I say no.","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Σωκράτης","greek":"ἀλλὰ θεριζόντων;","english":"Who are reaping, then?","g":{},"c":{},"turn":true},{"steph":"125b","speaker":"Ἀλκιβιάδης","greek":"οὔ.","english":"No.","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Σωκράτης","greek":"ἀλλ᾽ οὐδὲν ποιούντων ἤ τι ποιούντων;","english":"Over men who are doing nothing, or doing something?","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Ἀλκιβιάδης","greek":"ποιούντων λέγω.","english":"Doing something, I say.","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Σωκράτης","greek":"τί; πειρῶ καὶ ἐμοὶ δηλῶσαι.","english":"Doing what? Try to make it clear to me too.","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Ἀλκιβιάδης","greek":"οὐκοῦν τῶν καὶ συμβαλλόντων ἑαυτοῖς καὶ χρωμένων ἀλλήλοις, ὥσπερ ἡμεῖς ζῶμεν ἐν ταῖς πόλεσιν.","english":"Men who deal with one another and make use of one another, as we live in our cities.","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Σωκράτης","greek":"οὐκοῦν ἀνθρώπων λέγεις ἄρχειν ἀνθρώποις χρωμένων;","english":"So you mean ruling over men who make use of men?","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Σωκράτης","greek":"ἆρα κελευστῶν{b} χρωμένων ἐρέταις;","english":"Over boatswains who make use of rowers?","g":{"b":["κελευστῶν","genitive plural of κελευστής, the officer who called the stroke for the rowers, from κελεύω, command."]},"c":{},"turn":true},{"steph":"125c","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Σωκράτης","greek":"κυβερνητικὴ γὰρ αὕτη γε ἀρετή;","english":"For that is the excellence of a helmsman?","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"125c","speaker":"Σωκράτης","greek":"ἀλλ᾽ ἀνθρώπων λέγεις ἄρχειν αὐλητῶν, ἀνθρώποις |125d| ἡγουμένων ᾠδῆς καὶ χρωμένων χορευταῖς;","english":"Over men who are pipers, then, who lead men in song and make use of dancers?","g":{},"c":{},"turn":true},{"steph":"125d","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"125d","speaker":"Σωκράτης","greek":"χοροδιδασκαλικὴ γὰρ αὕτη γ᾽ αὖ;","english":"For that, again, is the art of the chorus master?","g":{},"c":{},"turn":true},{"steph":"125d","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"125d","speaker":"Σωκράτης","greek":"ἀλλὰ τί ποτε λέγεις χρωμένων ἀνθρώπων ἀνθρώποις οἷόν τ᾽ εἶναι ἄρχειν;","english":"Then what can you mean by being able to rule over men who make use of men?","g":{},"c":{},"turn":true},{"steph":"125d","speaker":"Ἀλκιβιάδης","greek":"κοινωνούντων ἔγωγε λέγω πολιτείας καὶ συμβαλλόντων πρὸς ἀλλήλους, τούτων ἄρχειν τῶν ἐν τῇ πόλει.","english":"I mean ruling over those in the city who share in citizenship{48} and deal with one another.","g":{},"c":{"48":["κοινωνούντων … πολιτείας","πολιτεία means citizenship, constitution and civic life at once; it is the Greek title of Plato’s *Republic*. Alcibiades’ answer points toward a real definition: ruling a community of citizens."]},"turn":true},{"steph":"125d","speaker":"Σωκράτης","greek":"τίς οὖν αὕτη ἡ τέχνη; ὥσπερ ἂν εἴ σε ἐροίμην πάλιν τὰ νυνδή, κοινωνούντων ναυτιλίας ἐπίστασθαι ἄρχειν τίς ποιεῖ τέχνη;","english":"What art is this, then? Just as if I asked you again the question of a moment ago: what art makes one know how to rule over those who share in navigation?","g":{},"c":{},"turn":true},{"steph":"125d","speaker":"Ἀλκιβιάδης","greek":"κυβερνητική.","english":"The helmsman’s.","g":{},"c":{},"turn":true},{"steph":"125e","speaker":"Σωκράτης","greek":"κοινωνούντων δ᾽ ᾠδῆς, ὡς νυνδὴ ἐλέγετο, τις ἐπιστήμη ποιεῖ ἄρχειν;","english":"And over those who share in song, as was said just now, what knowledge makes one rule?","g":{},"c":{},"turn":true},{"steph":"125e","speaker":"Ἀλκιβιάδης","greek":"ἥνπερ σὺ ἄρτι ἔλεγες, ἡ χοροδιδασκαλία.","english":"The one you mentioned just now, the art of the chorus master.","g":{},"c":{},"turn":true},{"steph":"125e","speaker":"Σωκράτης","greek":"τί δέ; πολιτείας κοινωνούντων τίνα καλεῖς ἐπιστήμην;","english":"Well then: what do you call the knowledge of those who share in citizenship?","g":{},"c":{},"turn":true},{"steph":"125e","speaker":"Ἀλκιβιάδης","greek":"εὐβουλίαν{c} ἔγωγε, ὦ Σώκρατες.","english":"Good counsel, Socrates.","g":{"c":["εὐβουλίαν","“good counsel,” εὖ (well) + βουλή (counsel, council). Protagoras claims to teach exactly this (*Protagoras* 318e)."]},"c":{},"turn":true},{"steph":"125e","speaker":"Σωκράτης","greek":"τί δέ; μῶν ἀβουλία δοκεῖ εἶναι ἡ τῶν κυβερνητῶν;","english":"What? Does the helmsmen’s knowledge seem to you to be bad counsel?","g":{},"c":{},"turn":true},{"steph":"125e","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"125e","speaker":"Σωκράτης","greek":"ἀλλ᾽ εὐβουλία;","english":"Good counsel, then?","g":{},"c":{},"turn":true},{"steph":"126a","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε δοκεῖ, εἴς γε τὸ σῴζεσθαι πλέοντας.","english":"I think so, for the safety of those at sea.","g":{},"c":{},"turn":true},{"steph":"126a","speaker":"Σωκράτης","greek":"καλῶς λέγεις. τί δέ; ἣν σὺ λέγεις εὐβουλίαν, εἰς τί ἐστιν;","english":"Well said. And the good counsel you speak of, what is it for?","g":{},"c":{},"turn":true},{"steph":"126a","speaker":"Ἀλκιβιάδης","greek":"εἰς τὸ ἄμεινον τὴν πόλιν διοικεῖν καὶ σῴζεσθαι.","english":"For managing the city better and keeping it safe.","g":{},"c":{},"turn":true},{"steph":"126a","speaker":"Σωκράτης","greek":"ἄμεινον δὲ διοικεῖται καὶ σῴζεται τίνος παραγιγνομένου ἢ ἀπογιγνομένου; ὥσπερ ἂν εἰ σύ με ἔροιο· ἄμεινον διοικεῖται σῶμα καὶ σῴζεται τίνος παραγιγνομένου ἢ ἀπογιγνομένου; εἴποιμ᾽ ἂν ὅτι ὑγιείας μὲν παραγιγνομένης, νόσου δὲ ἀπογιγνομένης. οὐ καὶ σὺ οἴει οὕτως;","english":"And through the presence or absence of what is it better managed and kept safe? Just as if you asked me, ‘Through the presence or absence of what is the body better managed and kept safe?’, I would say, ‘Through the presence of health and the absence of disease.’ Do you not think so too?","g":{},"c":{},"turn":true},{"steph":"126b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"126b","speaker":"Σωκράτης","greek":"καὶ εἴ μ᾽ αὖ ἔροιο· τίνος δὲ παραγιγνομένου ἄμεινον ὄμματα; ὡσαύτως εἴποιμ᾽ ἂν ὅτι ὄψεως μὲν παραγιγνομένης, τυφλότητος δὲ ἀπογιγνομένης. καὶ ὦτα δὲ κωφότητος μὲν ἀπογιγνομένης, ἀκοῆς δὲ ἐγγιγνομένης βελτίω τε γίγνεται καὶ ἄμεινον θεραπεύεται.","english":"And if you asked me again, ‘Through the presence of what are the eyes better?’, I would likewise say, ‘Through the presence of sight and the absence of blindness.’ And the ears become better and are better cared for when deafness is absent and hearing is present.","g":{},"c":{},"turn":true},{"steph":"126b","speaker":"Ἀλκιβιάδης","greek":"ὀρθῶς.","english":"Right.","g":{},"c":{},"turn":true},{"steph":"126b","speaker":"Σωκράτης","greek":"τί δὲ δή; πόλις τίνος παραγιγνομένου καὶ ἀπογιγνομένου βελτίων τε γίγνεται καὶ ἄμεινον θεραπεύεται καὶ διοικεῖται;","english":"Well then, and a city: through the presence and absence of what does it become better and is better cared for and managed?","g":{},"c":{},"turn":true},{"steph":"126c","speaker":"Ἀλκιβιάδης","greek":"ἐμοὶ μὲν δοκεῖ, ὦ Σώκρατες, ὅταν φιλία μὲν αὐτοῖς γίγνηται πρὸς ἀλλήλους, τὸ μισεῖν δὲ καὶ στασιάζειν{a} ἀπογίγνηται.","english":"I think, Socrates, when friendship arises among the citizens toward one another, and hatred and faction are absent.","g":{"a":["στασιάζειν","“to be in faction,” from στάσις, civil strife (literally “a standing,” taking sides); hence *stasis* in its political sense."]},"c":{},"turn":true},{"steph":"126c","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν φιλίαν λέγεις ὁμόνοιαν ἢ διχόνοιαν;","english":"By friendship, then, do you mean agreement or disagreement{49}?","g":{},"c":{"49":["ὁμόνοιαν ἢ διχόνοιαν","ὁμόνοια, “same-mindedness” (ὁμο- + νοῦς), was the Greek political ideal of concord. Socrates asks what knowledge produces it, as arithmetic produces agreement about numbers."]},"turn":true},{"steph":"126c","speaker":"Ἀλκιβιάδης","greek":"ὁμόνοιαν.","english":"Agreement.","g":{},"c":{},"turn":true},{"steph":"126c","speaker":"Σωκράτης","greek":"διὰ τίν᾽ οὖν τέχνην ὁμονοοῦσιν αἱ πόλεις περὶ ἀριθμούς;","english":"Through what art, then, do cities agree about numbers?","g":{},"c":{},"turn":true},{"steph":"126c","speaker":"Ἀλκιβιάδης","greek":"διὰ τὴν ἀριθμητικήν.","english":"Through arithmetic.","g":{},"c":{},"turn":true},{"steph":"126c","speaker":"Σωκράτης","greek":"τί δὲ οἱ ἰδιῶται; οὐ διὰ τὴν αὐτήν;","english":"And private individuals? Not through the same art?","g":{},"c":{},"turn":true},{"steph":"126c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"126c","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ αὐτὸς αὑτῷ ἕκαστος;","english":"And each man with himself?","g":{},"c":{},"turn":true},{"steph":"126c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"126c","speaker":"Σωκράτης","greek":"διὰ τίνα δὲ τέχνην ἕκαστος αὐτὸς αὑτῷ ὁμονοεῖ |126d| περὶ σπιθαμῆς καὶ πήχεος{b} ὁπότερον μεῖζον; οὐ διὰ τὴν μετρητικήν;","english":"And through what art does each man agree with himself about whether a span or a cubit is longer? Is it not through the art of measurement?","g":{"b":["σπιθαμῆς καὶ πήχεος","a span (thumb to little finger, about 9 inches) and a cubit (elbow to fingertip, about 18 inches), Greek measures taken from the body."]},"c":{},"turn":true},{"steph":"126d","speaker":"Ἀλκιβιάδης","greek":"τί μήν;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"126d","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ οἱ ἰδιῶται ἀλλήλοις καὶ αἱ πόλεις;","english":"And individuals with one another, and cities too?","g":{},"c":{},"turn":true},{"steph":"126d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"126d","speaker":"Σωκράτης","greek":"τί δέ; περὶ σταθμοῦ οὐχ ὡσαύτως;","english":"And is it not the same with weighing?","g":{},"c":{},"turn":true},{"steph":"126d","speaker":"Ἀλκιβιάδης","greek":"φημί.","english":"I agree.","g":{},"c":{},"turn":true},{"steph":"126d","speaker":"Σωκράτης","greek":"ἣν δὲ δὴ σὺ λέγεις ὁμόνοιαν, τίς ἐστι καὶ περὶ τοῦ, καὶ τίς αὐτὴν τέχνη παρασκευάζει; καὶ ἆρα ἥπερ πόλει, αὑτὴ καὶ ἰδιώτῃ, αὐτῷ τε πρὸς αὑτὸν καὶ πρὸς ἄλλον;","english":"Then the agreement you speak of: what is it, and about what, and what art provides it? And is it the same for a city as for an individual, both with himself and with another?","g":{},"c":{},"turn":true},{"steph":"126d","speaker":"Ἀλκιβιάδης","greek":"εἰκός γέ τοι.","english":"So it seems likely.","g":{},"c":{},"turn":true},{"steph":"126d","speaker":"Σωκράτης","greek":"τίς οὖν ἔστι; μὴ κάμῃς ἀποκρινόμενος, ἀλλὰ |126e| προθυμοῦ εἰπεῖν.","english":"What is it, then? Do not tire of answering; try hard to say.","g":{},"c":{},"turn":true},{"steph":"126e","speaker":"Ἀλκιβιάδης","greek":"ἐγὼ μὲν οἶμαι φιλίαν τε λέγειν καὶ ὁμόνοιαν, ἥνπερ πατήρ τε ὑὸν φιλῶν ὁμονοεῖ καὶ μήτηρ, καὶ ἀδελφὸς ἀδελφῷ καὶ γυνὴ ἀνδρί.","english":"I think I mean friendship and agreement such as a father who loves his son has with him, and a mother, and brother with brother, and wife with husband.","g":{},"c":{},"turn":true},{"steph":"126e","speaker":"Σωκράτης","greek":"οἴει ἂν οὖν, ὦ Ἀλκιβιάδη, ἄνδρα γυναικὶ περὶ ταλασιουργίας{c} δύνασθαι ὁμονοεῖν, τὸν μὴ ἐπιστάμενον τῇ ἐπισταμένῃ;","english":"Do you think, then, Alcibiades, that a husband could agree with his wife about wool-working, he not knowing it and she knowing it?","g":{"c":["ταλασιουργίας","“wool-working,” spinning and weaving, the household work of Greek women; τάλαρος, wool basket + ἔργον, work (as in *energy*, *ergonomic*)."]},"c":{},"turn":true},{"steph":"126e","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"126e","speaker":"Σωκράτης","greek":"οὐδέ γε δεῖ οὐδέν· γυναικεῖον γὰρ τοῦτό γε μάθημα.","english":"Nor need he at all; for this is a woman’s branch of learning.","g":{},"c":{},"turn":true},{"steph":"126e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Σωκράτης","greek":"τί δέ; γυνὴ ἀνδρὶ περὶ ὁπλιτικῆς δύναιτ᾽ ἂν ὁμονοεῖν μὴ μαθοῦσα;","english":"Well then: could a wife agree with her husband about soldiering, if she had not learned it?","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Σωκράτης","greek":"ἀνδρεῖον γὰρ τοῦτό γε ἴσως αὖ φαίης ἂν εἶναι.","english":"For you would say, perhaps, that this in turn is a man’s.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Ἀλκιβιάδης","greek":"ἔγωγε.","english":"I would.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Σωκράτης","greek":"ἔστιν ἄρα τὰ μὲν γυναικεῖα, τὰ δὲ ἀνδρεῖα μαθήματα κατὰ τὸν σὸν λόγον.","english":"So by your account some branches of learning are women’s and some men’s.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Ἀλκιβιάδης","greek":"πῶς δ᾽ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Σωκράτης","greek":"οὐκ ἄρα ἔν γε τούτοις ἐστὶν ὁμόνοια γυναιξὶ πρὸς ἄνδρας.","english":"Then in these, at least, there is no agreement between wives and husbands.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Ἀλκιβιάδης","greek":"οὔ.","english":"No.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Σωκράτης","greek":"οὐδ᾽ ἄρα φιλία, εἴπερ ἡ φιλία ὁμόνοια ἦν.","english":"Nor friendship either, if friendship was agreement.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Ἀλκιβιάδης","greek":"οὐ φαίνεται.","english":"It seems not.","g":{},"c":{},"turn":true},{"steph":"127a","speaker":"Σωκράτης","greek":"ἧι ἄρα αἱ γυναῖκες τὰ αὑτῶν πράττουσιν, οὐ φιλοῦνται ὑπὸ τῶν ἀνδρῶν.","english":"So insofar as wives do their own work, they are not loved by their husbands.","g":{},"c":{},"turn":true},{"steph":"127b","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔοικεν.","english":"It seems not.","g":{},"c":{},"turn":true},{"steph":"127b","speaker":"Σωκράτης","greek":"οὐδ᾽ ἄρα οἱ ἄνδρες ὑπὸ τῶν γυναικῶν ᾗ τὰ αὑτῶν.","english":"Nor husbands by their wives, insofar as they do their own.","g":{},"c":{},"turn":true},{"steph":"127b","speaker":"Ἀλκιβιάδης","greek":"οὔ.","english":"No.","g":{},"c":{},"turn":true},{"steph":"127b","speaker":"Σωκράτης","greek":"οὐδ᾽ εὖ ἄρα ταύτῃ οἰκοῦνται αἱ πόλεις, ὅταν τὰ αὑτῶν ἕκαστοι πράττωσιν;","english":"Then cities are not well governed in this respect, when each group does its own work{50}?","g":{},"c":{"50":["τὰ αὑτῶν ἕκαστοι πράττωσιν","“Doing one’s own” is the formula Plato’s *Republic* (433a–b) makes the definition of justice. Here the phrase leads Alcibiades into contradiction: specialized work seems to exclude the shared knowledge that agreement requires."]},"turn":true},{"steph":"127b","speaker":"Ἀλκιβιάδης","greek":"οἶμαι ἔγωγε, ὦ Σώκρατες.","english":"I think they are, Socrates.","g":{},"c":{},"turn":true},{"steph":"127b","speaker":"Σωκράτης","greek":"πῶς λέγεις, φιλίας μὴ παρούσης, ἧς ἔφαμεν ἐγγιγνομένης εὖ οἰκεῖσθαι τὰς πόλεις, ἄλλως δ᾽ οὔ;","english":"How can you say so, when friendship is not present, which we said must be present for cities to be well governed, and not otherwise?","g":{},"c":{},"turn":true},{"steph":"127b","speaker":"Ἀλκιβιάδης","greek":"ἀλλά μοι δοκεῖ καὶ κατὰ τοῦτ᾽ αὐτοῖς φιλία ἐγγίγνεσθαι, ὅτι τὰ αὑτῶν ἑκάτεροι πράττουσιν.","english":"But I think friendship arises among them in just this respect, that each does its own work.","g":{},"c":{},"turn":true},{"steph":"127c","speaker":"Σωκράτης","greek":"οὐκ ἄρτι γε· νῦν δὲ πῶς αὖ λέγεις; ὁμονοίας μὴ ἐγγιγνομένης φιλία ἐγγίγνεται; ἢ οἷόν θ᾽ ὁμόνοιαν ἐγγίγνεσθαι [περὶ τούτων] ὧν οἱ μὲν ἴσασι περὶ τούτων, οἱ δ᾽ οὔ;","english":"It did not a moment ago. But what do you mean now? Does friendship arise where agreement does not? Or can agreement arise about things some know and others do not?","g":{},"c":{},"turn":true},{"steph":"127c","speaker":"Ἀλκιβιάδης","greek":"ἀδύνατον.","english":"It is impossible.","g":{},"c":{},"turn":true},{"steph":"127c","speaker":"Σωκράτης","greek":"δίκαια δὲ πράττουσιν ἢ ἄδικα, ὅταν τὰ αὑτῶν ἕκαστοι πράττωσιν;","english":"And when each does its own work, are they doing just or unjust things?","g":{},"c":{},"turn":true},{"steph":"127c","speaker":"Ἀλκιβιάδης","greek":"δίκαια· πῶς γὰρ οὔ;","english":"Just things; of course.","g":{},"c":{},"turn":true},{"steph":"127c","speaker":"Σωκράτης","greek":"τὰ δίκαια οὖν πραττόντων ἐν τῇ πόλει τῶν πολιτῶν φιλία οὐκ ἐγγίγνεται πρὸς ἀλλήλους;","english":"Then when the citizens do just things in the city, does friendship not arise among them?","g":{},"c":{},"turn":true},{"steph":"127c","speaker":"Ἀλκιβιάδης","greek":"ἀνάγκη αὖ μοι δοκεῖ εἶναι, ὦ Σώκρατες.","english":"Again it seems to me that it must, Socrates.","g":{},"c":{},"turn":true},{"steph":"127d","speaker":"Σωκράτης","greek":"τίνα οὖν ποτε λέγεις τὴν φιλίαν ἢ ὁμόνοιαν περὶ ἧς δεῖ ἡμᾶς σοφούς τε εἶναι καὶ εὐβούλους, ἵνα ἀγαθοὶ ἄνδρες ὦμεν; οὐ γὰρ δύναμαι μαθεῖν οὔθ᾽ ἥτις οὔτ᾽ ἐν οἷστισιν· τοτὲ μὲν γὰρ ἐν τοῖς αὐτοῖς φαίνεται ἐνοῦσα, τοτὲ δ᾽ οὔ, ὡς ἐκ τοῦ σοῦ λόγου.","english":"What, then, do you mean by the friendship or agreement about which we must be wise and well-counseled in order to be good men? For I cannot learn what it is, or in whom; from your account, it sometimes appears present in the same people and sometimes not.","g":{},"c":{},"turn":true},{"steph":"127d","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ μὰ τοὺς θεούς, ὦ Σώκρατες, οὐδ᾽ αὐτὸς οἶδ᾽ ὅτι λέγω, κινδυνεύω δὲ καὶ πάλαι λεληθέναι ἐμαυτὸν αἴσχιστα ἔχων.","english":"But by the gods, Socrates, I do not know myself what I am saying; it looks as if I have long been in a most shameful state without noticing it.","g":{},"c":{},"turn":true},{"steph":"127d","speaker":"Σωκράτης","greek":"ἀλλὰ χρὴ θαρρεῖν. εἰ μὲν γὰρ αὐτὸ ᾔσθου πεπονθὼς |127e| πεντηκονταετής, χαλεπὸν ἂν ἦν σοι ἐπιμεληθῆναι σαυτοῦ· νῦν δ᾽ ἣν ἔχεις ἡλικίαν, αὕτη ἐστὶν ἐν ᾗ δεῖ αὐτὸ αἰσθέσθαι.","english":"But you must take heart. If you had noticed this condition at fifty{51}, it would be hard for you to take care of yourself; but the age you are now is the very age at which one should notice it.","g":{},"c":{"51":["πεντηκονταετής","The encouragement matters. Alcibiades is about twenty, the age at which Athenians could first speak in the assembly. Socratic perplexity is not a verdict but an opening: now is the time to begin caring for oneself."]},"turn":true},{"steph":"127e","speaker":"Ἀλκιβιάδης","greek":"τί οὖν τὸν αἰσθανόμενον χρὴ ποιεῖν, ὦ Σώκρατες;","english":"What should the one who notices it do, then, Socrates?","g":{},"c":{},"turn":true},{"steph":"127e","speaker":"Σωκράτης","greek":"ἀποκρίνεσθαι τὰ ἐρωτώμενα, ὦ Ἀλκιβιάδη· καὶ ἐὰν τοῦτο ποιῇς, ἂν θεὸς θέλῃ, εἴ τι δεῖ καὶ τῇ ἐμῇ μαντείᾳ πιστεύειν, σύ τε κἀγὼ βέλτιον σχήσομεν.","english":"Answer the questions, Alcibiades. And if you do this, god willing, if my prophetic sense is to be trusted at all, you and I shall both be better off.","g":{},"c":{},"turn":true},{"steph":"127e","speaker":"Ἀλκιβιάδης","greek":"ἔσται ταῦτα ἕνεκά γε τοῦ ἐμὲ ἀποκρίνεσθαι.","english":"That will be so, as far as my answering goes.","g":{},"c":{},"turn":true},{"steph":"127e","speaker":"Σωκράτης","greek":"φέρε δή, τί ἐστιν τὸ ἑαυτοῦ ἐπιμελεῖσθαι—μὴ πολλάκις |128a| λάθωμεν οὐχ ἡμῶν αὐτῶν ἐπιμελούμενοι, οἰόμενοι δέ —καὶ πότ᾽ ἄρα αὐτὸ ποιεῖ ἅνθρωπος; ἆρ᾽ ὅταν τῶν αὑτοῦ ἐπιμελῆται, τότε καὶ αὑτοῦ;","english":"Come then: what is taking care of oneself{52} (so that we do not often fail to notice that we are not taking care of ourselves while thinking we are), and when does a man actually do it? When he takes care of the things that are his, does he then take care of himself as well?","g":{},"c":{"52":["τὸ ἑαυτοῦ ἐπιμελεῖσθαι","“Care of the self” (ἐπιμέλεια ἑαυτοῦ) is the theme that made this dialogue central in antiquity; later Platonists read it first in their curriculum, and Michel Foucault built a late lecture course around it (*The Hermeneutics of the Subject*, 1981–82)."]},"turn":true},{"steph":"128a","speaker":"Ἀλκιβιάδης","greek":"ἐμοὶ γοῦν δοκεῖ.","english":"I think so, at least.","g":{},"c":{},"turn":true},{"steph":"128a","speaker":"Σωκράτης","greek":"τί δέ; ποδῶν ἅνθρωπος ποτε ἐπιμελεῖται; ἆρ᾽ ὅταν ἐκείνων ἐπιμελῆται ἅ ἐστι τῶν ποδῶν;","english":"Well then: when does a man take care of his feet? When he takes care of the things that belong to his feet?","g":{},"c":{},"turn":true},{"steph":"128a","speaker":"Ἀλκιβιάδης","greek":"οὐ μανθάνω.","english":"I do not understand.","g":{},"c":{},"turn":true},{"steph":"128a","speaker":"Σωκράτης","greek":"καλεῖς δέ τι χειρός; οἷον δακτύλιον ἔστιν ὅτου ἂν ἄλλου τῶν τοῦ ἀνθρώπου φαίης ἢ δακτύλου;","english":"Do you call something a hand’s? For instance, a ring: is there any other part of a man you would say it belongs to but a finger?","g":{},"c":{},"turn":true},{"steph":"128a","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"128a","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ ποδὸς ὑπόδημα τὸν αὐτὸν τρόπον;","english":"And a shoe belongs to the foot in the same way?","g":{},"c":{},"turn":true},{"steph":"128a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"128a","speaker":"Σωκράτης","greek":"καὶ ἱμάτια καὶ στρώματα τοῦ ἄλλου σώματος ὁμοίως;","english":"And clothes and bedding likewise to the rest of the body?","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν ὅταν ὑποδημάτων ἐπιμελώμεθα, τότε ποδῶν ἐπιμελούμεθα;","english":"So when we take care of our shoes, do we then take care of our feet?","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Ἀλκιβιάδης","greek":"οὐ πάνυ μανθάνω, ὦ Σώκρατες.","english":"I do not quite understand, Socrates.","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Σωκράτης","greek":"τί δέ, ὦ Ἀλκιβιάδη; ὀρθῶς ἐπιμελεῖσθαι καλεῖς τι ὁτουοῦν πράγματος;","english":"Well, Alcibiades: do you speak of taking care of anything rightly?","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Ἀλκιβιάδης","greek":"ἔγωγε.","english":"I do.","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν ὅταν τίς τι βέλτιον ποιῇ, τότε ὀρθὴν λέγεις ἐπιμέλειαν;","english":"And do you call it right care when someone makes something better?","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Σωκράτης","greek":"τίς οὖν τέχνη ὑποδήματα βελτίω ποιεῖ;","english":"What art makes shoes better, then?","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Ἀλκιβιάδης","greek":"σκυτική.","english":"Shoemaking.","g":{},"c":{},"turn":true},{"steph":"128b","speaker":"Σωκράτης","greek":"σκυτικῇ ἄρα ὑποδημάτων ἐπιμελούμεθα;","english":"By shoemaking, then, we take care of shoes?","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Σωκράτης","greek":"ἦ καὶ ποδὸς σκυτικῇ; ἢ ἐκείνῃ ᾗ πόδας βελτίους ποιοῦμεν;","english":"And of the foot, too, by shoemaking? Or by the art by which we make feet better?","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Ἀλκιβιάδης","greek":"ἐκείνῃ.","english":"By that.","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Σωκράτης","greek":"βελτίους δὲ πόδας οὐχ ᾗπερ καὶ τὸ ἄλλο σῶμα;","english":"And do we not make the feet better by the same art as the rest of the body?","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε δοκεῖ.","english":"I think so.","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Σωκράτης","greek":"αὕτη δ᾽ οὐ γυμναστική;","english":"And is that not gymnastics?","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Ἀλκιβιάδης","greek":"μάλιστα.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Σωκράτης","greek":"γυμναστικῇ μὲν ἄρα ποδὸς ἐπιμελούμεθα, σκυτικῇ δὲ τῶν τοῦ ποδός;","english":"So by gymnastics we take care of the foot, and by shoemaking of the foot’s belongings?","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Σωκράτης","greek":"καὶ γυμναστικῇ μὲν χειρῶν, δακτυλιογλυφίᾳ{a} δὲ τῶν τῆς χειρός;","english":"And by gymnastics of the hands, and by ring-engraving of the hand’s belongings?","g":{"a":["δακτυλιογλυφίᾳ","“ring-engraving,” from δακτύλιος (ring, from δάκτυλος, finger; hence *dactyl*, *pterodactyl*) + γλύφω (carve; hence *glyph*, *hieroglyph*)."]},"c":{},"turn":true},{"steph":"128c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"128c","speaker":"Σωκράτης","greek":"καὶ γυμναστικῇ μὲν σώματος, ὑφαντικῇ δὲ καὶ ταῖς |128d| ἄλλαις τῶν τοῦ σώματος;","english":"And by gymnastics of the body, and by weaving and the other arts of the body’s belongings?","g":{},"c":{},"turn":true},{"steph":"128d","speaker":"Ἀλκιβιάδης","greek":"παντάπασι μὲν οὖν.","english":"Absolutely.","g":{},"c":{},"turn":true},{"steph":"128d","speaker":"Σωκράτης","greek":"ἄλλῃ μὲν ἄρα τέχνῃ αὐτοῦ ἑκάστου ἐπιμελούμεθα, ἄλλῃ δὲ τῶν αὐτοῦ.","english":"Then by one art we take care of each thing itself, and by another of its belongings{53}.","g":{},"c":{"53":["αὐτοῦ ἑκάστου … τῶν αὐτοῦ","The key distinction of the dialogue’s last part: a thing itself (αὐτό) versus what belongs to it (τὰ αὐτοῦ). Body and wealth will prove to be belongings; the self is something else."]},"turn":true},{"steph":"128d","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"128d","speaker":"Σωκράτης","greek":"οὐκ ἄρα ὅταν τῶν σαυτοῦ ἐπιμελῇ, σαυτοῦ ἐπιμελῇ.","english":"So when you take care of your belongings, you are not taking care of yourself.","g":{},"c":{},"turn":true},{"steph":"128d","speaker":"Ἀλκιβιάδης","greek":"οὐδαμῶς.","english":"Not at all.","g":{},"c":{},"turn":true},{"steph":"128d","speaker":"Σωκράτης","greek":"οὐ γὰρ ἡ αὐτὴ τέχνη, ὡς ἔοικεν, ᾗ τις ἂν αὑτοῦ τε ἐπιμελοῖτο καὶ τῶν αὑτοῦ.","english":"For it is not the same art, it seems, by which one would take care of oneself and of one’s belongings.","g":{},"c":{},"turn":true},{"steph":"128d","speaker":"Ἀλκιβιάδης","greek":"οὐ φαίνεται.","english":"It seems not.","g":{},"c":{},"turn":true},{"steph":"128d","speaker":"Σωκράτης","greek":"φέρε δή, ποίᾳ ποτ᾽ ἂν ἡμῶν αὐτῶν ἐπιμεληθείημεν;","english":"Come then: by what kind of art could we take care of ourselves?","g":{},"c":{},"turn":true},{"steph":"128d","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔχω λέγειν.","english":"I cannot say.","g":{},"c":{},"turn":true},{"steph":"128e","speaker":"Σωκράτης","greek":"ἀλλὰ τοσόνδε γε ὡμολόγηται, ὅτι οὐχ ᾗ ἂν τῶν ἡμετέρων καὶ ὁτιοῦν βέλτιον ποιοῖμεν, ἀλλ᾽ ᾗ ἡμᾶς αὐτούς;","english":"But this much has been agreed: it is not by the art by which we would make any of our belongings better, but by the one by which we would make ourselves better?","g":{},"c":{},"turn":true},{"steph":"128e","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"True.","g":{},"c":{},"turn":true},{"steph":"128e","speaker":"Σωκράτης","greek":"ἦ οὖν ἔγνωμεν ἄν ποτε τίς τέχνη ὑπόδημα βέλτιον ποιεῖ, μὴ εἰδότες ὑπόδημα;","english":"Could we ever have known what art makes a shoe better if we did not know what a shoe is?","g":{},"c":{},"turn":true},{"steph":"128e","speaker":"Ἀλκιβιάδης","greek":"ἀδύνατον.","english":"Impossible.","g":{},"c":{},"turn":true},{"steph":"128e","speaker":"Σωκράτης","greek":"οὐδέ γε τίς τέχνη δακτυλίους βελτίους ποιεῖ, ἀγνοοῦντες δακτύλιον.","english":"Nor what art makes rings better, if we were ignorant of what a ring is.","g":{},"c":{},"turn":true},{"steph":"128e","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ.","english":"True.","g":{},"c":{},"turn":true},{"steph":"128e","speaker":"Σωκράτης","greek":"τί δέ; τίς τέχνη βελτίω ποιεῖ αὐτόν, ἆρ᾽ ἄν ποτε γνοῖμεν ἀγνοοῦντες τί ποτ᾽ ἐσμὲν αὐτοί;","english":"Well then: could we ever know what art makes oneself better, if we were ignorant of what we ourselves are?","g":{},"c":{},"turn":true},{"steph":"129a","speaker":"Ἀλκιβιάδης","greek":"ἀδύνατον.","english":"Impossible.","g":{},"c":{},"turn":true},{"steph":"129a","speaker":"Σωκράτης","greek":"πότερον οὖν δὴ ῥᾴδιον τυγχάνει τὸ γνῶναι ἑαυτόν, καί τις ἦν φαῦλος ὁ τοῦτο ἀναθεὶς εἰς τὸν ἐν Πυθοῖ νεών{a}, ἢ χαλεπόν τι καὶ οὐχὶ παντός;","english":"Is it easy, then, to know oneself, and was it some ordinary person who dedicated this inscription in the temple at Pytho? Or is it something hard, and not for everyone?","g":{"a":["ἐν Πυθοῖ νεών","“the temple at Pytho,” the old name of Delphi; νεών is Attic accusative of νεώς (temple), Ionic ναός, as in *naos*."]},"c":{},"turn":true},{"steph":"129a","speaker":"Ἀλκιβιάδης","greek":"ἐμοὶ μέν, ὦ Σώκρατες, πολλάκις μὲν ἔδοξε παντὸς εἶναι, πολλάκις δὲ παγχάλεπον.","english":"To me, Socrates, it has often seemed to be for everyone, and often very hard.","g":{},"c":{},"turn":true},{"steph":"129a","speaker":"Σωκράτης","greek":"ἀλλ᾽, ὦ Ἀλκιβιάδη, εἴτε ῥᾴδιον εἴτε μή ἐστιν, ὅμως γε ἡμῖν ὧδ᾽ ἔχει· γνόντες μὲν αὐτὸ τάχ᾽ ἂν γνοῖμεν τὴν ἐπιμέλειαν ἡμῶν αὐτῶν, ἀγνοοῦντες δὲ οὐκ ἄν ποτε.","english":"But Alcibiades, whether it is easy or not, this is how it stands with us: knowing it, we might perhaps know how to take care of ourselves; not knowing it, we never could.","g":{},"c":{},"turn":true},{"steph":"129a","speaker":"Ἀλκιβιάδης","greek":"ἔστι ταῦτα.","english":"That is so.","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Σωκράτης","greek":"φέρε δή, τίν᾽ ἂν τρόπον εὑρεθείη αὐτὸ ταὐτό; οὕτω μὲν γὰρ ἂν τάχ᾽ εὕροιμεν τί ποτ᾽ ἐσμὲν αὐτοί, τούτου δ᾽ ἔτι ὄντες ἐν ἀγνοίᾳ ἀδύνατοί που.","english":"Come then: in what way could the self itself{54} be found? For in that way we might perhaps find what we ourselves are; but while we are still in ignorance of that, we are presumably unable to.","g":{},"c":{"54":["αὐτὸ ταὐτό","Literally “the itself itself” (or “the same itself”): Socrates’ phrase for the self in its essence, the standard by which each particular self is a self. He sets this harder question aside at 130d and settles for “the soul.”"]},"turn":true},{"steph":"129b","speaker":"Ἀλκιβιάδης","greek":"ὀρθῶς λέγεις.","english":"You are right.","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Σωκράτης","greek":"ἔχε οὖν πρὸς Διός. τῷ διαλέγῃ σὺ νῦν; ἄλλο τι ἢ ἐμοί;","english":"Hold on, then, by Zeus. With whom are you conversing now? With anyone but me?","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"No.","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ ἐγὼ σοί;","english":"And I with you?","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Σωκράτης","greek":"Σωκράτης ἄρ᾽ ἐστὶν ὁ διαλεγόμενος;","english":"Then Socrates is the one conversing?","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Σωκράτης","greek":"Ἀλκιβιάδης δ᾽ ὁ ἀκούων;","english":"And Alcibiades the one listening?","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"129b","speaker":"Σωκράτης","greek":"οὐκοῦν λόγῳ διαλέγεται ὁ Σωκράτης;","english":"And Socrates converses by means of speech?","g":{},"c":{},"turn":true},{"steph":"129c","speaker":"Ἀλκιβιάδης","greek":"τί μήν;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"129c","speaker":"Σωκράτης","greek":"τὸ δὲ διαλέγεσθαι καὶ τὸ λόγῳ χρῆσθαι ταὐτόν που καλεῖς.","english":"And you call conversing and using speech the same thing, I suppose.","g":{},"c":{},"turn":true},{"steph":"129c","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"129c","speaker":"Σωκράτης","greek":"ὁ δὲ χρώμενος καὶ ᾧ χρῆται οὐκ ἄλλο;","english":"And the user and what he uses{55} are different?","g":{},"c":{"55":["ὁ δὲ χρώμενος καὶ ᾧ χρῆται","The decisive premise of the dialogue’s argument about the self: the user (ὁ χρώμενος) differs from the instrument (ᾧ χρῆται). Since a person uses his body, the person is not the body."]},"turn":true},{"steph":"129c","speaker":"Ἀλκιβιάδης","greek":"πῶς λέγεις;","english":"What do you mean?","g":{},"c":{},"turn":true},{"steph":"129c","speaker":"Σωκράτης","greek":"ὥσπερ σκυτοτόμος τέμνει που τομεῖ καὶ σμίλῃ{b} καὶ ἄλλοις ὀργάνοις.","english":"For example, a shoemaker cuts with a knife and a chisel and other tools.","g":{"b":["τομεῖ καὶ σμίλῃ","datives of instrument: τομεύς, a leather-cutting knife (τέμνω, cut, as in *tome*, *atom*), and σμίλη, a chisel or knife."]},"c":{},"turn":true},{"steph":"129c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"129c","speaker":"Σωκράτης","greek":"οὐκοῦν ἄλλο μὲν ὁ τέμνων καὶ χρώμενος, ἄλλο δὲ οἷς τέμνων χρῆται;","english":"Then the one who cuts and uses them is one thing, and the tools he uses in cutting another?","g":{},"c":{},"turn":true},{"steph":"129c","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"129c","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν οὕτως καὶ οἷς ὁ κιθαριστὴς κιθαρίζει καὶ αὐτὸς ὁ κιθαριστὴς ἄλλο ἂν εἴη;","english":"And in the same way, what the lyre player plays with and the lyre player himself would be different?","g":{},"c":{},"turn":true},{"steph":"129c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Σωκράτης","greek":"τοῦτο τοίνυν ἀρτίως ἠρώτων, εἰ ὁ χρώμενος καὶ ᾧ χρῆται ἀεὶ δοκεῖ ἕτερον εἶναι.","english":"That, then, is what I was asking just now: whether the user and what he uses always seem to be different.","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Ἀλκιβιάδης","greek":"δοκεῖ.","english":"They do.","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Σωκράτης","greek":"τί οὖν φῶμεν τὸν σκυτοτόμον; τέμνειν ὀργάνοις μόνον ἢ καὶ χερσίν;","english":"What shall we say of the shoemaker, then? Does he cut with tools only, or with his hands too?","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Ἀλκιβιάδης","greek":"καὶ χερσίν.","english":"With his hands too.","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Σωκράτης","greek":"χρῆται ἄρα καὶ ταύταις;","english":"Then he uses these as well?","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Σωκράτης","greek":"ἦ καὶ τοῖς ὀφθαλμοῖς χρώμενος σκυτοτομεῖ;","english":"And does he use his eyes too in making shoes?","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Σωκράτης","greek":"τὸν δὲ χρώμενον καὶ οἷς χρῆται ἕτερα ὁμολογοῦμεν;","english":"And we agree that the user and what he uses are different?","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"129d","speaker":"Σωκράτης","greek":"ἕτερον ἄρα σκυτοτόμος καὶ κιθαριστὴς χειρῶν καὶ |129e| ὀφθαλμῶν οἷς ἐργάζονται;","english":"Then the shoemaker and the lyre player are different from the hands and eyes they work with?","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ παντὶ τῷ σώματι χρῆται ἅνθρωπος;","english":"And does a man not use his whole body too?","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Σωκράτης","greek":"ἕτερον δ᾽ ἦν τό τε χρώμενον καὶ ᾧ χρῆται;","english":"And the user and what it uses were different?","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Σωκράτης","greek":"ἕτερον ἄρα ἅνθρωπός ἐστι τοῦ σώματος τοῦ ἑαυτοῦ;","english":"Then a man is different from his own body?","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Ἀλκιβιάδης","greek":"ἔοικεν.","english":"It seems so.","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Σωκράτης","greek":"τί ποτ᾽ οὖν ὁ ἄνθρωπος;","english":"What, then, is the man?","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔχω λέγειν.","english":"I cannot say.","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Σωκράτης","greek":"ἔχεις μὲν οὖν, ὅτι γε τὸ τῷ σώματι χρώμενον.","english":"Yes you can: that it is what uses the body.","g":{},"c":{},"turn":true},{"steph":"129e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Σωκράτης","greek":"ἦ οὖν ἄλλο τι χρῆται αὐτῷ ἢ ψυχή;","english":"And does anything use it but the soul?","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἄλλο.","english":"Nothing else.","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Σωκράτης","greek":"οὐκοῦν ἄρχουσα;","english":"And rules it?","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Σωκράτης","greek":"καὶ μὴν τόδε γ᾽ οἶμαι οὐδένα ἂν ἄλλως οἰηθῆναι.","english":"And here is something, I think, that no one would think otherwise.","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Ἀλκιβιάδης","greek":"τὸ ποῖον;","english":"What is that?","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Σωκράτης","greek":"μὴ οὐ τριῶν ἕν γέ τι εἶναι τὸν ἄνθρωπον.","english":"That the man is one of three things.","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Ἀλκιβιάδης","greek":"τίνων;","english":"Which?","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Σωκράτης","greek":"ψυχὴν ἢ σῶμα ἢ συναμφότερον{a}, τὸ ὅλον τοῦτο.","english":"Soul, or body, or both together, this whole.","g":{"a":["συναμφότερον","“both together,” the composite of soul and body; σύν + ἀμφότερος (both), as in *amphibian*."]},"c":{},"turn":true},{"steph":"130a","speaker":"Ἀλκιβιάδης","greek":"τί μήν;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"130a","speaker":"Σωκράτης","greek":"ἀλλὰ μὴν αὐτό γε τὸ τοῦ σώματος ἄρχον ὡμολογήσαμεν ἄνθρωπον εἶναι;","english":"But we agreed that the very thing that rules the body is the man?","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Ἀλκιβιάδης","greek":"ὡμολογήσαμεν.","english":"We did.","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν σῶμα αὐτὸ αὑτοῦ ἄρχει;","english":"Does the body rule itself, then?","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Ἀλκιβιάδης","greek":"οὐδαμῶς.","english":"Not at all.","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Σωκράτης","greek":"ἄρχεσθαι γὰρ αὐτὸ εἴπομεν.","english":"For we said that it is ruled.","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Σωκράτης","greek":"οὐκ ἂν δὴ τοῦτό γε εἴη ὃ ζητοῦμεν.","english":"Then this would not be what we are looking for.","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔοικεν.","english":"It seems not.","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Σωκράτης","greek":"ἀλλ᾽ ἄρα τὸ συναμφότερον τοῦ σώματος ἄρχει, καὶ ἔστι δὴ τοῦτο ἄνθρωπος;","english":"Then does the combination rule the body, and is this the man?","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Ἀλκιβιάδης","greek":"ἴσως δῆτα.","english":"Perhaps it is.","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Σωκράτης","greek":"πάντων γε ἥκιστα· μὴ γὰρ συνάρχοντος τοῦ ἑτέρου οὐδεμία που μηχανὴ τὸ συναμφότερον ἄρχειν.","english":"Least of all; for if one of the two does not share in ruling, there is no way the combination can rule.","g":{},"c":{},"turn":true},{"steph":"130b","speaker":"Ἀλκιβιάδης","greek":"ὀρθῶς.","english":"Right.","g":{},"c":{},"turn":true},{"steph":"130c","speaker":"Σωκράτης","greek":"ἐπειδὴ δ᾽ οὔτε σῶμα οὔτε τὸ συναμφότερόν ἐστιν ἄνθρωπος, λείπεται οἶμαι ἢ μηδὲν αὔτ᾽ εἶναι, ἢ εἴπερ τί ἐστι, μηδὲν ἄλλο τὸν ἄνθρωπον συμβαίνειν ἢ ψυχήν.","english":"Since neither the body nor the combination is the man, what remains, I think, is either that the man is nothing, or, if he is something, that the man turns out to be nothing other than soul{56}.","g":{},"c":{"56":["μηδὲν ἄλλο τὸν ἄνθρωπον συμβαίνειν ἢ ψυχήν","The conclusion later Platonism took as the dialogue’s center: the human being is the soul, and the body its instrument. Proclus and Olympiadus wrote full commentaries on *Alcibiades I* for this reason."]},"turn":true},{"steph":"130c","speaker":"Ἀλκιβιάδης","greek":"κομιδῇ μὲν οὖν.","english":"Exactly so.","g":{},"c":{},"turn":true},{"steph":"130c","speaker":"Σωκράτης","greek":"ἔτι οὖν τι σαφέστερον δεῖ ἀποδειχθῆναί σοι ὅτι ἡ ψυχή ἐστιν ἄνθρωπος;","english":"Do you need it shown to you any more clearly, then, that the soul is the man?","g":{},"c":{},"turn":true},{"steph":"130c","speaker":"Ἀλκιβιάδης","greek":"μὰ Δία, ἀλλ᾽ ἱκανῶς μοι δοκεῖ ἔχειν.","english":"By Zeus, no; I think it is sufficiently shown.","g":{},"c":{},"turn":true},{"steph":"130c","speaker":"Σωκράτης","greek":"εἰ δέ γε μὴ ἀκριβῶς ἀλλὰ καὶ μετρίως, ἐξαρκεῖ ἡμῖν· ἀκριβῶς μὲν γὰρ τότε εἰσόμεθα, ὅταν εὕρωμεν ὃ νυνδὴ |130d| παρήλθομεν διὰ τὸ πολλῆς εἶναι σκέψεως.","english":"And if not with precision, but even adequately, that is enough for us. We shall know with precision when we have found what we passed over just now because it would need much inquiry.","g":{},"c":{},"turn":true},{"steph":"130d","speaker":"Ἀλκιβιάδης","greek":"τί τοῦτο;","english":"What is that?","g":{},"c":{},"turn":true},{"steph":"130d","speaker":"Σωκράτης","greek":"ὃ ἄρτι οὕτω πως ἐρρήθη, ὅτι πρῶτον σκεπτέον εἴη αὐτὸ τὸ αὐτό· νῦν δὲ ἀντὶ τοῦ αὐτοῦ αὐτὸ ἕκαστον ἐσκέμμεθα ὅτι ἐστί. καὶ ἴσως ἐξαρκέσει· οὐ γάρ που κυριώτερόν{b} γε οὐδὲν ἂν ἡμῶν αὐτῶν φήσαιμεν ἢ τὴν ψυχήν.","english":"What was said a moment ago, more or less: that we must first consider the self itself. As it is, instead of the self itself we have considered what each single self is. And perhaps that will suffice; for surely we would say there is nothing in us more sovereign than the soul.","g":{"b":["κυριώτερόν","comparative of κύριος, “sovereign, having authority”; κύριος becomes the New Testament word for “Lord” (*Kyrie eleison*)."]},"c":{},"turn":true},{"steph":"130d","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"130d","speaker":"Σωκράτης","greek":"οὐκοῦν καλῶς ἔχει οὕτω νομίζειν, ἐμὲ καὶ σὲ προσομιλεῖν ἀλλήλοις τοῖς λόγοις χρωμένους τῇ ψυχῇ πρὸς τὴν ψυχήν;","english":"Then is it right to think this way: that you and I are conversing with each other by means of words, soul to soul?","g":{},"c":{},"turn":true},{"steph":"130e","speaker":"Ἀλκιβιάδης","greek":"πάνυ μὲν οὖν.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"130e","speaker":"Σωκράτης","greek":"τοῦτ᾽ ἄρα ἦν ὃ καὶ ὀλίγῳ ἔμπροσθεν εἴπομεν, ὅτι Σωκράτης Ἀλκιβιάδῃ διαλέγεται λόγῳ χρώμενος, οὐ πρὸς τὸ σὸν πρόσωπον, ὡς ἔοικεν, ἀλλὰ πρὸς τὸν Ἀλκιβιάδην ποιούμενος τοὺς λόγους· τοῦτο δέ ἐστιν ἡ ψυχή.","english":"That, then, is what we said a little earlier: that Socrates converses with Alcibiades by using speech, addressing his words not to your face{57}, it seems, but to Alcibiades; and that is the soul.","g":{},"c":{"57":["οὐ πρὸς τὸ σὸν πρόσωπον","πρόσωπον, “face,” later “mask” and “person” (Latin *persona*). The famous beauty of Alcibiades’ face is precisely what Socrates says he is not speaking to. The whole courtship is re-described: Socrates woos the soul."]},"turn":true},{"steph":"130e","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε δοκεῖ.","english":"I think so.","g":{},"c":{},"turn":true},{"steph":"130e","speaker":"Σωκράτης","greek":"ψυχὴν ἄρα ἡμᾶς κελεύει γνωρίσαι ὁ ἐπιτάττων γνῶναι ἑαυτόν.","english":"So the one who commands us to know ourselves bids us come to know the soul.","g":{},"c":{},"turn":true},{"steph":"131a","speaker":"Ἀλκιβιάδης","greek":"ἔοικεν.","english":"It seems so.","g":{},"c":{},"turn":true},{"steph":"131a","speaker":"Σωκράτης","greek":"ὅστις ἄρα τῶν τοῦ σώματός τι γιγνώσκει, τὰ αὑτοῦ ἀλλ᾽ οὐχ αὑτὸν ἔγνωκεν.","english":"Then whoever knows something of the body has come to know what belongs to him, but not himself.","g":{},"c":{},"turn":true},{"steph":"131a","speaker":"Ἀλκιβιάδης","greek":"οὕτως.","english":"So it is.","g":{},"c":{},"turn":true},{"steph":"131a","speaker":"Σωκράτης","greek":"οὐδεὶς ἄρα τῶν ἰατρῶν ἑαυτὸν γιγνώσκει, καθ᾽ ὅσον ἰατρός, οὐδὲ τῶν παιδοτριβῶν, καθ᾽ ὅσον παιδοτρίβης.","english":"Then no doctor knows himself, insofar as he is a doctor, nor any trainer, insofar as he is a trainer.","g":{},"c":{},"turn":true},{"steph":"131a","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔοικεν.","english":"It seems not.","g":{},"c":{},"turn":true},{"steph":"131a","speaker":"Σωκράτης","greek":"πολλοῦ ἄρα δέουσιν οἱ γεωργοὶ καὶ οἱ ἄλλοι δημιουργοὶ{a} γιγνώσκειν ἑαυτούς. οὐδὲ γὰρ τὰ ἑαυτῶν οὗτοί γε, ὡς ἔοικεν, ἀλλ᾽ ἔτι πορρωτέρω τῶν ἑαυτῶν κατά γε τὰς |131b| τέχνας ἃς ἔχουσιν· τὰ γὰρ τοῦ σώματος γιγνώσκουσιν, οἷς τοῦτο θεραπεύεται.","english":"And farmers and the other craftsmen are far from knowing themselves. For they do not even know what belongs to them, it seems, but things still more remote than what belongs to them, at least in the arts they practice; for they know the things that belong to the body, by which it is tended.","g":{"a":["δημιουργοὶ","“craftsmen,” literally “workers for the people” (δῆμος + ἔργον); Plato’s *Timaeus* makes ὁ δημιουργός the divine craftsman, the *Demiurge*."]},"c":{},"turn":true},{"steph":"131b","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"You are right.","g":{},"c":{},"turn":true},{"steph":"131b","speaker":"Σωκράτης","greek":"εἰ ἄρα σωφροσύνη ἐστὶ τὸ ἑαυτὸν γιγνώσκειν, οὐδεὶς τούτων σώφρων κατὰ τὴν τέχνην.","english":"So if self-knowledge is temperance{58}, none of these is temperate by virtue of his art.","g":{},"c":{"58":["σωφροσύνη","σωφροσύνη, “soundness of mind,” temperance or self-control, from σῶς (safe, sound) + φρήν (mind). Equating it with self-knowledge is the thesis Plato examines in the *Charmides* (164d)."]},"turn":true},{"steph":"131b","speaker":"Ἀλκιβιάδης","greek":"οὔ μοι δοκεῖ.","english":"I do not think so.","g":{},"c":{},"turn":true},{"steph":"131b","speaker":"Σωκράτης","greek":"διὰ ταῦτα δὴ καὶ βάναυσοι{b} αὗται αἱ τέχναι δοκοῦσιν εἶναι καὶ οὐκ ἀνδρὸς ἀγαθοῦ μαθήματα.","english":"That is why these arts are thought to be vulgar, and not branches of learning for a good man.","g":{"b":["βάναυσοι","“mechanical, vulgar,” the aristocratic Greek term for manual trades; hence English *banausic*."]},"c":{},"turn":true},{"steph":"131b","speaker":"Ἀλκιβιάδης","greek":"πάνυ μὲν οὖν.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"131b","speaker":"Σωκράτης","greek":"οὐκοῦν πάλιν ὅστις αὖ σῶμα θεραπεύει, τὰ ἑαυτοῦ ἀλλ᾽ οὐχ αὑτὸν θεραπεύει;","english":"Then again, whoever tends his body is tending what belongs to him, and not himself?","g":{},"c":{},"turn":true},{"steph":"131b","speaker":"Ἀλκιβιάδης","greek":"κινδυνεύει.","english":"It looks that way.","g":{},"c":{},"turn":true},{"steph":"131b","speaker":"Σωκράτης","greek":"ὅστις δέ γε τὰ χρήματα, οὔθ᾽ ἑαυτὸν οὔτε τὰ |131c| ἑαυτοῦ, ἀλλ᾽ ἔτι πορρωτέρω τῶν ἑαυτοῦ;","english":"And whoever tends his money tends neither himself nor what belongs to him, but something still more remote than what belongs to him?","g":{},"c":{},"turn":true},{"steph":"131c","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε δοκεῖ.","english":"I think so.","g":{},"c":{},"turn":true},{"steph":"131c","speaker":"Σωκράτης","greek":"οὐ τὰ αὑτοῦ ἄρα ἔτι πράττει ὁ χρηματιστής.","english":"Then the money-maker is no longer even doing his own business.","g":{},"c":{},"turn":true},{"steph":"131c","speaker":"Ἀλκιβιάδης","greek":"ὀρθῶς.","english":"Right.","g":{},"c":{},"turn":true},{"steph":"131c","speaker":"Σωκράτης","greek":"εἰ ἄρα τις γέγονεν ἐραστὴς τοῦ Ἀλκιβιάδου σώματος, οὐκ Ἀλκιβιάδου ἄρα ἠράσθη ἀλλά τινος τῶν Ἀλκιβιάδου.","english":"So if anyone has become a lover of Alcibiades’ body, he did not love Alcibiades, but something belonging to Alcibiades.","g":{},"c":{},"turn":true},{"steph":"131c","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"You are right.","g":{},"c":{},"turn":true},{"steph":"131c","speaker":"Σωκράτης","greek":"ὅστις δέ σου τῆς ψυχῆς ἐρᾷ;","english":"But whoever loves your soul?","g":{},"c":{},"turn":true},{"steph":"131c","speaker":"Ἀλκιβιάδης","greek":"ἀνάγκη φαίνεται ἐκ τοῦ λόγου.","english":"He loves you; that follows necessarily from the argument.","g":{},"c":{},"turn":true},{"steph":"131c","speaker":"Σωκράτης","greek":"οὐκοῦν ὁ μὲν τοῦ σώματός σου ἐρῶν, ἐπειδὴ λήγει ἀνθοῦν, ἀπιὼν οἴχεται;","english":"And the lover of your body, when it stops blooming{59}, goes off and leaves?","g":{},"c":{"59":["ἐπειδὴ λήγει ἀνθοῦν","The argument returns to the dialogue’s opening (103a): the other lovers left because they loved the body, whose bloom fades. Socrates alone stays because he loves the soul. The whole philosophical argument has been an explanation of his constancy."]},"turn":true},{"steph":"131c","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"131d","speaker":"Σωκράτης","greek":"ὁ δέ γε τῆς ψυχῆς ἐρῶν οὐκ ἄπεισιν, ἕως ἂν ἐπὶ τὸ βέλτιον ἴῃ;","english":"But the lover of the soul does not leave, so long as it is going toward what is better?","g":{},"c":{},"turn":true},{"steph":"131d","speaker":"Ἀλκιβιάδης","greek":"εἰκός γε.","english":"Probably.","g":{},"c":{},"turn":true},{"steph":"131d","speaker":"Σωκράτης","greek":"οὐκοῦν ἐγώ εἰμι ὁ οὐκ ἀπιὼν ἀλλὰ παραμένων λήγοντος τοῦ σώματος, τῶν ἄλλων ἀπεληλυθότων.","english":"And I am the one who does not leave, but stays as the body fades, when the others have gone away.","g":{},"c":{},"turn":true},{"steph":"131d","speaker":"Ἀλκιβιάδης","greek":"εὖ γε ποιῶν, ὦ Σώκρατες· καὶ μηδὲ ἀπέλθοις.","english":"And you do well, Socrates; please do not go away.","g":{},"c":{},"turn":true},{"steph":"131d","speaker":"Σωκράτης","greek":"προθυμοῦ τοίνυν ὅτι κάλλιστος εἶναι.","english":"Then be eager to be as beautiful as possible.","g":{},"c":{},"turn":true},{"steph":"131d","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ προθυμήσομαι.","english":"I will be eager.","g":{},"c":{},"turn":true},{"steph":"131e","speaker":"Σωκράτης","greek":"ὡς οὕτω γέ σοι ἔχει· οὔτ᾽ ἐγένεθ᾽, ὡς ἔοικεν, Ἀλκιβιάδῃ τῷ Κλεινίου ἐραστὴς οὔτ᾽ ἔστιν ἀλλ᾽ ἢ εἷς μόνος, καὶ οὗτος ἀγαπητός, Σωκράτης ὁ Σωφρονίσκου καὶ Φαιναρέτης.","english":"For this is how it stands with you: there never has been, it seems, any lover of Alcibiades son of Clinias, nor is there, except one only, and he is to be cherished: Socrates, son of Sophroniscus and Phaenarete{60}.","g":{},"c":{"60":["Σωκράτης ὁ Σωφρονίσκου καὶ Φαιναρέτης","Socrates now names himself with both parents, as he named Alcibiades at 105d. Phaenarete was a midwife, the image Socrates uses for his own art in the *Theaetetus* (149a): he helps others give birth to their thoughts."]},"turn":true},{"steph":"131e","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ.","english":"True.","g":{},"c":{},"turn":true},{"steph":"131e","speaker":"Σωκράτης","greek":"οὐκοῦν ἔφησθα σμικρὸν φθῆναί με προσελθόντα σοι, ἐπεὶ πρότερος ἄν μοι προσελθεῖν, βουλόμενος πυθέσθαι δι᾽ ὅτι μόνος οὐκ ἀπέρχομαι;","english":"And you said that I had only just beaten you in approaching you, since you would have come to me first, wanting to learn why I alone do not go away?","g":{},"c":{},"turn":true},{"steph":"131e","speaker":"Ἀλκιβιάδης","greek":"ἦν γὰρ οὕτω.","english":"Yes, that was so.","g":{},"c":{},"turn":true},{"steph":"131e","speaker":"Σωκράτης","greek":"τοῦτο τοίνυν αἴτιον, ὅτι μόνος ἐραστὴς ἦν σός, οἱ δ᾽ ἄλλοι τῶν σῶν· τὰ δὲ σὰ λήγει ὥρας, σὺ δ᾽ ἄρχῃ ἀνθεῖν. |132a| καὶ νῦν γε ἂν μὴ διαφθαρῇς{c} ὑπὸ τοῦ Ἀθηναίων δήμου καὶ αἰσχίων γένῃ, οὐ μή σε ἀπολίπω. τοῦτο γὰρ δὴ μάλιστα ἐγὼ φοβοῦμαι, μὴ δημεραστὴς ἡμῖν γενόμενος διαφθαρῇς· πολλοὶ γὰρ ἤδη καὶ ἀγαθοὶ αὐτὸ πεπόνθασιν Ἀθηναίων.","english":"This, then, is the reason: that I alone was a lover of you, while the others were lovers of what is yours; and what is yours is passing its prime, while you are beginning to bloom. And now, unless you are corrupted by the Athenian people and become uglier, I will never leave you. For this is what I fear most, that you may become a lover of the people{61} and be corrupted; for many good Athenians have suffered this already.","g":{"c":["διαφθαρῇς","aorist passive subjunctive of διαφθείρω, “be corrupted, ruined,” the same word used in the charge against Socrates of “corrupting the young.”"]},"c":{"61":["δημεραστὴς","A coinage, δῆμος + ἐραστής: a man in love with the crowd. It names Alcibiades’ real danger and, for Plato’s readers, his actual career: the demagogue who led the Sicilian expedition (415) and was later exiled."]},"turn":true},{"steph":"132a","speaker":"Σωκράτης","greek":"εὐπρόσωπος γὰρ ὁ τοῦ μεγαλήτορος δῆμος Ἐρεχθέως· ἀλλ᾽ ἀποδύντα χρὴ αὐτὸν θεάσασθαι. εὐλαβοῦ οὖν τὴν εὐλάβειαν ἣν ἐγὼ λέγω.","english":"For ‘fair of face is the people of great-hearted Erechtheus’{62}; but you must see it stripped. So take the precaution I tell you.","g":{},"c":{"62":["εὐπρόσωπος γὰρ ὁ τοῦ μεγαλήτορος δῆμος Ἐρεχθέως","Socrates adapts Homer, *Iliad* 2.547, “the people of great-hearted Erechtheus,” the legendary king of Athens, adding “fair of face.” The people, like Alcibiades, must be seen stripped of their pleasing face, as athletes were inspected naked."]},"turn":false},{"steph":"132a","speaker":"Ἀλκιβιάδης","greek":"τίνα;","english":"What precaution?","g":{},"c":{},"turn":true},{"steph":"132b","speaker":"Σωκράτης","greek":"γύμνασαι πρῶτον, ὦ μακάριε, καὶ μάθε ἃ δεῖ μαθόντα ἰέναι ἐπὶ τὰ τῆς πόλεως, πρότερον δὲ μή, ἵν᾽ ἀλεξιφάρμακα{a} ἔχων ἴῃς καὶ μηδὲν πάθῃς δεινόν.","english":"Train first, my blessed friend, and learn what one must learn before going into the city’s affairs, and not before, so that you may go armed with antidotes and suffer nothing terrible.","g":{"a":["ἀλεξιφάρμακα","“antidotes,” ἀλέξω (ward off) + φάρμακον (drug, poison), whence *pharmacy*; the name *Alexander* shares ἀλέξω."]},"c":{},"turn":true},{"steph":"132b","speaker":"Ἀλκιβιάδης","greek":"εὖ μοι δοκεῖς λέγειν, ὦ Σώκρατες· ἀλλὰ πειρῶ ἐξηγεῖσθαι ὅντιν᾽ ἂν τρόπον ἐπιμεληθεῖμεν ἡμῶν αὐτῶν.","english":"I think you are right, Socrates. But try to explain in what way we can take care of ourselves.","g":{},"c":{},"turn":true},{"steph":"132b","speaker":"Σωκράτης","greek":"οὐκοῦν τοσοῦτον μὲν ἡμῖν εἰς τὸ πρόσθεν πεπέρανται —ὃ γὰρ ἐσμέν, ἐπιεικῶς ὡμολόγηται—ἐφοβούμεθα δὲ μὴ τούτου σφαλέντες λάθωμεν ἑτέρου τινὸς ἐπιμελόμενοι ἀλλ᾽ οὐχ ἡμῶν.","english":"Well, this much we have accomplished so far: what we are has been reasonably agreed. And we were afraid that, failing in this, we might be taking care of something else without noticing it, and not of ourselves.","g":{},"c":{},"turn":true},{"steph":"132b","speaker":"Ἀλκιβιάδης","greek":"ἔστι ταῦτα.","english":"That is so.","g":{},"c":{},"turn":true},{"steph":"132c","speaker":"Σωκράτης","greek":"καὶ μετὰ τοῦτο δὴ ὅτι ψυχῆς ἐπιμελητέον καὶ εἰς τοῦτο βλεπτέον.","english":"And next, that it is the soul we must take care of, and look to.","g":{},"c":{},"turn":true},{"steph":"132c","speaker":"Ἀλκιβιάδης","greek":"δῆλον.","english":"Clearly.","g":{},"c":{},"turn":true},{"steph":"132c","speaker":"Σωκράτης","greek":"σωμάτων δὲ καὶ χρημάτων τὴν ἐπιμέλειαν ἑτέροις παραδοτέον.","english":"And the care of bodies and of money must be handed over to others.","g":{},"c":{},"turn":true},{"steph":"132c","speaker":"Ἀλκιβιάδης","greek":"τί μήν;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"132c","speaker":"Σωκράτης","greek":"τίν᾽ οὖν ἂν τρόπον γνοῖμεν αὐτὸ ἐναργέστατα; ἐπειδὴ τοῦτο γνόντες, ὡς ἔοικεν, καὶ ἡμᾶς αὐτοὺς γνωσόμεθα. ἆρα πρὸς θεῶν εὖ λέγοντος οὗ νυνδὴ ἐμνήσθημεν τοῦ Δελφικοῦ γράμματος οὐ συνίεμεν;","english":"In what way, then, could we know the soul most clearly? Since knowing this, it seems, we shall also know ourselves. By the gods, do we not understand the Delphic inscription we mentioned just now, which speaks well?","g":{},"c":{},"turn":true},{"steph":"132c","speaker":"Ἀλκιβιάδης","greek":"τὸ ποῖόν τι διανοούμενος λέγεις, ὦ Σώκρατες;","english":"What do you have in mind in saying that, Socrates?","g":{},"c":{},"turn":true},{"steph":"132d","speaker":"Σωκράτης","greek":"ἐγώ σοι φράσω, ὅ γε ὑποπτεύω λέγειν καὶ συμβουλεύειν ἡμῖν τοῦτο τὸ γράμμα. κινδυνεύει γὰρ οὐδὲ πολλαχοῦ εἶναι παράδειγμα αὐτοῦ, ἀλλὰ κατὰ τὴν ὄψιν μόνον.","english":"I will tell you what I suspect this inscription means and advises us. For there may well be an example of it not in many places, but only in the case of sight.","g":{},"c":{},"turn":true},{"steph":"132d","speaker":"Ἀλκιβιάδης","greek":"πῶς τοῦτο λέγεις;","english":"What do you mean?","g":{},"c":{},"turn":true},{"steph":"132d","speaker":"Σωκράτης","greek":"σκόπει καὶ σύ. εἰ ἡμῶν τῷ ὄμματι ὥσπερ ἀνθρώπῳ συμβουλεῦον εἶπεν ἰδὲ σαυτόν, πῶς ἂν ὑπελάβομεν τί παραινεῖν; ἆρα οὐχὶ εἰς τοῦτο βλέπειν, εἰς ὃ βλέπων ὁ ὀφθαλμὸς ἔμελλεν αὑτὸν ἰδεῖν;","english":"Consider with me. If the inscription spoke to our eye as if to a man and advised it, ‘See yourself,’ how would we understand the advice? Would it not be to look at that thing by looking at which the eye would see itself?","g":{},"c":{},"turn":true},{"steph":"132d","speaker":"Ἀλκιβιάδης","greek":"δῆλον.","english":"Clearly.","g":{},"c":{},"turn":true},{"steph":"132d","speaker":"Σωκράτης","greek":"ἐννοῶμεν δὴ εἰς τί βλέποντες τῶν ὄντων ἐκεῖνό |132e| τε ὁρῷμεν ἅμα ἂν καὶ ἡμᾶς αὐτούς;","english":"Let us think, then: which of the things there are must we look at to see both that and ourselves at the same time?","g":{},"c":{},"turn":true},{"steph":"132e","speaker":"Ἀλκιβιάδης","greek":"δῆλον δή, ὦ Σώκρατες, ὅτι εἰς κάτοπτρά τε καὶ τὰ τοιαῦτα.","english":"Clearly, Socrates, mirrors and things of that kind.","g":{},"c":{},"turn":true},{"steph":"132e","speaker":"Σωκράτης","greek":"ὀρθῶς λέγεις. οὐκοῦν καὶ τῷ ὀφθαλμῷ ᾧ ὁρῶμεν ἔνεστί ⟨τι⟩ τῶν τοιούτων;","english":"You are right. And is there not something of that kind in the eye with which we see?","g":{},"c":{},"turn":true},{"steph":"132e","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"132e","speaker":"Σωκράτης","greek":"ἐννενόηκας οὖν ὅτι τοῦ ἐμβλέποντος εἰς τὸν |133a| ὀφθαλμὸν τὸ πρόσωπον ἐμφαίνεται ἐν τῇ τοῦ καταντικρὺ ὄψει ὥσπερ ἐν κατόπτρῳ, ὃ δὴ καὶ κόρην καλοῦμεν, εἴδωλον{b} ὄν τι τοῦ ἐμβλέποντος;","english":"Have you noticed, then, that the face of one who looks into another’s eye appears in the eye of the one opposite, as in a mirror? We call this the pupil, the ‘little girl,’{63} since it is a sort of image of the one looking.","g":{"b":["εἴδωλον","“image, phantom,” from εἶδος, form; hence *idol*."]},"c":{"63":["κόρην","κόρη means both “girl” and “pupil of the eye,” because one sees a tiny figure of oneself there; Latin *pupilla*, “little doll,” gives English *pupil* by the same image. The famous mirror passage begins here."]},"turn":true},{"steph":"133a","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"True.","g":{},"c":{},"turn":true},{"steph":"133a","speaker":"Σωκράτης","greek":"ὀφθαλμὸς ἄρα ὀφθαλμὸν θεώμενος, καὶ ἐμβλέπων εἰς τοῦτο ὅπερ βέλτιστον αὐτοῦ καὶ ᾧ ὁρᾷ, οὕτως ἂν αὑτὸν ἴδοι.","english":"So an eye, gazing at an eye and looking into the best part of it, the part with which it sees, would in this way see itself.","g":{},"c":{},"turn":true},{"steph":"133a","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"133a","speaker":"Σωκράτης","greek":"εἰ δέ γ᾽ εἰς ἄλλο τῶν τοῦ ἀνθρώπου βλέποι ἤ τι τῶν ὄντων, πλὴν εἰς ἐκεῖνο ᾧ τοῦτο τυγχάνει ὅμοιον, οὐκ ὄψεται ἑαυτόν.","english":"But if it looked at any other part of a man, or at any other thing, except the one to which this part is similar, it will not see itself.","g":{},"c":{},"turn":true},{"steph":"133b","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"True.","g":{},"c":{},"turn":true},{"steph":"133b","speaker":"Σωκράτης","greek":"ὀφθαλμὸς ἄρ᾽ εἰ μέλλει ἰδεῖν αὑτόν, εἰς ὀφθαλμὸν αὐτῷ βλεπτέον, καὶ τοῦ ὄμματος εἰς ἐκεῖνον τὸν τόπον ἐν ᾧ τυγχάνει ἡ ὀφθαλμοῦ ἀρετὴ ἐγγιγνομένη· ἔστι δὲ τοῦτό που ὄψις;","english":"So if an eye is going to see itself, it must look at an eye, and at that region of the eye in which the excellence of an eye comes to be; and that, I take it, is sight?","g":{},"c":{},"turn":true},{"steph":"133b","speaker":"Ἀλκιβιάδης","greek":"οὕτως.","english":"So it is.","g":{},"c":{},"turn":true},{"steph":"133b","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν, ὦ φίλε Ἀλκιβιάδη, καὶ ψυχὴ εἰ μέλλει γνώσεσθαι αὑτήν, εἰς ψυχὴν αὐτῇ βλεπτέον, καὶ μάλιστ᾽ εἰς τοῦτον αὐτῆς τὸν τόπον ἐν ᾧ ἐγγίγνεται ἡ ψυχῆς ἀρετή, σοφία, καὶ εἰς ἄλλο ᾧ τοῦτο τυγχάνει ὅμοιον ὄν;","english":"Then, my dear Alcibiades, if a soul too is going to know itself{64}, must it not look at a soul, and above all at that region of it in which the excellence of a soul, wisdom, comes to be, and at anything else to which this happens to be similar?","g":{},"c":{"64":["ψυχὴ εἰ μέλλει γνώσεσθαι αὑτήν","The answer to “Know yourself”: a soul knows itself as an eye sees itself, by looking into another, into the part where its excellence, wisdom, lives. Self-knowledge happens in a relationship, which is what Socrates has offered Alcibiades all along."]},"turn":true},{"steph":"133b","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε δοκεῖ, ὦ Σώκρατες.","english":"I think so, Socrates.","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Σωκράτης","greek":"ἔχομεν οὖν εἰπεῖν ὅτι ἐστὶ τῆς ψυχῆς θειότερον ἢ τοῦτο, περὶ ὃ τὸ εἰδέναι τε καὶ φρονεῖν ἐστιν;","english":"And can we name any part of the soul more divine than this, where knowing and understanding take place?","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔχομεν.","english":"We cannot.","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Σωκράτης","greek":"τῷ θεῷ ἄρα τοῦτ᾽ ἔοικεν αὐτῆς, καί τις εἰς τοῦτο βλέπων καὶ πᾶν τὸ θεῖον γνούς, θεόν τε καὶ φρόνησιν{a}, οὕτω καὶ ἑαυτὸν ἂν γνοίη μάλιστα.","english":"Then this part of it resembles the divine, and whoever looks at it and comes to know all that is divine, god and understanding, would in this way know himself best.","g":{"a":["θεόν τε καὶ φρόνησιν","“god and understanding”; φρόνησις, practical wisdom, from φρήν, mind. The best of the soul is akin to the divine (θεῖος, *theology*)."]},"c":{},"turn":true},{"steph":"133c","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν, ὅθ᾽ ὥσπερ κάτοπτρά ἐστι σαφέστερα τοῦ ἐν τῷ ὀφθαλμῷ ἐνόπτρου καὶ καθαρώτερα καὶ λαμπρότερα, οὕτω καὶ ὁ θεὸς τοῦ ἐν τῇ ἡμετέρᾳ ψυχῇ βελτίστου καθαρώτερόν τε καὶ λαμπρότερον τυγχάνει ὄν;","english":"Then just as mirrors are clearer and purer and brighter{65} than the reflection in the eye, so too god happens to be purer and brighter than the best part of our soul?","g":{},"c":{"65":["ὁ θεὸς … καθαρώτερόν τε καὶ λαμπρότερον","Burnet’s text at 133c contains lines (the comparison of god to a brighter mirror) that appear only in later quotations by Eusebius and Stobaeus. Many scholars suspect them of being a later Platonist addition; others defend them."]},"turn":true},{"steph":"133c","speaker":"Ἀλκιβιάδης","greek":"ἔοικέ γε, ὦ Σώκρατες.","english":"It seems so, Socrates.","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Σωκράτης","greek":"εἰς τὸν θεὸν ἄρα βλέποντες ἐκείνῳ καλλίστῳ ἐνόπτρῳ χρῴμεθ᾽ ἂν καὶ τῶν ἀνθρωπίν
