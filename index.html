ων εἰς τὴν ψυχῆς ἀρετήν, καὶ οὕτως ἂν μάλιστα ὁρῷμεν καὶ γιγνώσκοιμεν ἡμᾶς αὐτούς.","english":"So looking at god we would be using the finest mirror, and among human things at the excellence of the soul, and in this way we would best see and know ourselves.","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Σωκράτης","greek":"τὸ δὲ γιγνώσκειν αὑτὸν ὡμολογοῦμεν σωφροσύνην εἶναι;","english":"And knowing oneself, we agreed, is temperance?","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Σωκράτης","greek":"ἆρ᾽ οὖν μὴ γιγνώσκοντες ἡμᾶς αὐτοὺς μηδὲ σώφρονες ὄντες δυναίμεθ᾽ ἂν εἰδέναι τὰ ἡμέτερα αὐτῶν κακά τε καὶ ἀγαθά;","english":"Then if we did not know ourselves and were not temperate, could we know what belongs to us, the bad and the good?","g":{},"c":{},"turn":true},{"steph":"133c","speaker":"Ἀλκιβιάδης","greek":"καὶ πῶς ἂν τοῦτο γένοιτο, ὦ Σώκρατες;","english":"How could that be, Socrates?","g":{},"c":{},"turn":true},{"steph":"133d","speaker":"Σωκράτης","greek":"ἀδύνατον γὰρ ἴσως σοι φαίνεται μὴ γιγνώσκοντα Ἀλκιβιάδην τὰ Ἀλκιβιάδου γιγνώσκειν ὅτι Ἀλκιβιάδου ἐστίν.","english":"For perhaps it seems impossible to you that someone who does not know Alcibiades should know that the things of Alcibiades belong to Alcibiades.","g":{},"c":{},"turn":true},{"steph":"133d","speaker":"Ἀλκιβιάδης","greek":"ἀδύνατον μέντοι νὴ Δία.","english":"Impossible indeed, by Zeus.","g":{},"c":{},"turn":true},{"steph":"133d","speaker":"Σωκράτης","greek":"οὐδ᾽ ἄρα τὰ ἡμέτερα ὅτι ἡμέτερα, εἰ μηδ᾽ ἡμᾶς αὐτούς;","english":"Nor, then, that our things are ours, if we do not know ourselves?","g":{},"c":{},"turn":true},{"steph":"133d","speaker":"Ἀλκιβιάδης","greek":"πῶς γάρ;","english":"How could we?","g":{},"c":{},"turn":true},{"steph":"133d","speaker":"Σωκράτης","greek":"εἰ δ᾽ ἄρα μηδὲ τὰ ἡμέτερα, οὐδὲ τὰ τῶν ἡμετέρων;","english":"And if not our things, then not the things of our things either?","g":{},"c":{},"turn":true},{"steph":"133d","speaker":"Ἀλκιβιάδης","greek":"οὐ φαίνεται.","english":"It seems not.","g":{},"c":{},"turn":true},{"steph":"133d","speaker":"Σωκράτης","greek":"οὐκ ἄρα πάνυ τι ὀρθῶς ὡμολογοῦμεν ὁμολογοῦντες ἄρτι εἶναί τινας οἳ ἑαυτοὺς μὲν οὐ γιγνώσκουσιν, τὰ δ᾽ αὑτῶν, ἄλλους δὲ τὰ τῶν ἑαυτῶν. ἔοικε γὰρ πάντα ταῦτα εἶναι |133e| κατιδεῖν ἑνός τε καὶ μιᾶς τέχνης, αὑτόν, τὰ αὑτοῦ, τὰ τῶν ἑαυτοῦ.","english":"Then we were not quite right just now in agreeing that there are some who do not know themselves but know their own things, and others who know the things of their things. For it seems that all these are the task of one person and one art to discern: oneself, one’s own things, and the things of one’s own.","g":{},"c":{},"turn":true},{"steph":"133e","speaker":"Ἀλκιβιάδης","greek":"κινδυνεύει.","english":"It looks that way.","g":{},"c":{},"turn":true},{"steph":"133e","speaker":"Σωκράτης","greek":"ὅστις δὲ τὰ αὑτοῦ ἀγνοεῖ, καὶ τὰ τῶν ἄλλων που ἂν ἀγνοοῖ κατὰ ταὐτά.","english":"And whoever is ignorant of his own things will presumably be ignorant of the things of others in the same way.","g":{},"c":{},"turn":true},{"steph":"133e","speaker":"Ἀλκιβιάδης","greek":"τί μήν;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"133e","speaker":"Σωκράτης","greek":"οὐκοῦν εἰ τὰ τῶν ἄλλων, καὶ τὰ τῶν πόλεων ἀγνοήσει.","english":"And if of others’ things, he will be ignorant of the things of cities too.","g":{},"c":{},"turn":true},{"steph":"133e","speaker":"Ἀλκιβιάδης","greek":"ἀνάγκη.","english":"Necessarily.","g":{},"c":{},"turn":true},{"steph":"133e","speaker":"Σωκράτης","greek":"οὐκ ἄρ᾽ ἂν γένοιτο ὁ τοιοῦτος ἀνὴρ πολιτικός.","english":"Then such a man could not become a statesman.","g":{},"c":{},"turn":true},{"steph":"133e","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"133e","speaker":"Σωκράτης","greek":"οὐ μὴν οὐδ᾽ οἰκονομικός γε.","english":"Nor even a manager of a household.","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Σωκράτης","greek":"οὐδέ γε εἴσεται ὅτι πράττει.","english":"Nor will he know what he is doing.","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Ἀλκιβιάδης","greek":"οὐ γὰρ οὖν.","english":"No indeed.","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Σωκράτης","greek":"ὁ δὲ μὴ εἰδὼς οὐχ ἁμαρτήσεται;","english":"And will not the man who does not know make mistakes?","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Σωκράτης","greek":"ἐξαμαρτάνων δὲ οὐ κακῶς πράξει ἰδίᾳ τε καὶ δημοσίᾳ;","english":"And making mistakes, will he not fare badly, in private and in public?","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Ἀλκιβιάδης","greek":"πῶς δ᾽ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Σωκράτης","greek":"κακῶς δὲ πράττων οὐκ ἄθλιος;","english":"And faring badly, is he not wretched?","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Ἀλκιβιάδης","greek":"σφόδρα γε.","english":"Very much so.","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Σωκράτης","greek":"τί δ᾽ οἷς οὗτος πράττει;","english":"And those for whom he acts?","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Ἀλκιβιάδης","greek":"καὶ οὗτοι.","english":"They too.","g":{},"c":{},"turn":true},{"steph":"134a","speaker":"Σωκράτης","greek":"οὐκ ἄρα οἷόν τε, ἐὰν μή τις σώφρων καὶ ἀγαθὸς ᾖ, εὐδαίμονα εἶναι.","english":"Then it is not possible to be happy unless one is temperate and good.","g":{},"c":{},"turn":true},{"steph":"134b","speaker":"Ἀλκιβιάδης","greek":"οὐχ οἷόν τε.","english":"It is not possible.","g":{},"c":{},"turn":true},{"steph":"134b","speaker":"Σωκράτης","greek":"οἱ ἄρα κακοὶ τῶν ἀνθρώπων ἄθλιοι.","english":"Then bad men are wretched.","g":{},"c":{},"turn":true},{"steph":"134b","speaker":"Ἀλκιβιάδης","greek":"σφόδρα γε.","english":"Very much so.","g":{},"c":{},"turn":true},{"steph":"134b","speaker":"Σωκράτης","greek":"οὐκ ἄρα οὐδ᾽ ὁ πλουτήσας ἀθλιότητος ἀπαλλάττεται, ἀλλ᾽ ὁ σωφρονήσας.","english":"Then it is not the one who has grown rich who is freed from wretchedness, but the one who has grown temperate.","g":{},"c":{},"turn":true},{"steph":"134b","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"134b","speaker":"Σωκράτης","greek":"οὐκ ἄρα τειχῶν οὐδὲ τριήρων οὐδὲ νεωρίων δέονται αἱ πόλεις, ὦ Ἀλκιβιάδη, εἰ μέλλουσιν εὐδαιμονήσειν, οὐδὲ πλήθους οὐδὲ μεγέθους ἄνευ ἀρετῆς.","english":"Then cities do not need walls or warships or dockyards{66}, Alcibiades, if they are to be happy, nor numbers nor size, without excellence.","g":{},"c":{"66":["τειχῶν … τριήρων … νεωρίων","The Long Walls, the fleet and the Piraeus dockyards were the pride of Periclean Athens. Socrates says none of them makes a city happy without virtue, a rebuke to Pericles’ whole program and to Alcibiades’ ambitions."]},"turn":true},{"steph":"134b","speaker":"Ἀλκιβιάδης","greek":"οὐ μέντοι.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"134b","speaker":"Σωκράτης","greek":"εἰ δὴ μέλλεις τὰ τῆς πόλεως πράξειν ὀρθῶς καὶ |134c| καλῶς, ἀρετῆς σοι μεταδοτέον τοῖς πολίταις.","english":"So if you are going to manage the city’s affairs rightly and finely, you must give the citizens a share in excellence.","g":{},"c":{},"turn":true},{"steph":"134c","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"134c","speaker":"Σωκράτης","greek":"δύναιτο δ᾽ ἄν τις μεταδιδόναι ὃ μὴ ἔχοι;","english":"And could anyone give a share of what he did not have?","g":{},"c":{},"turn":true},{"steph":"134c","speaker":"Ἀλκιβιάδης","greek":"καὶ πῶς;","english":"How could he?","g":{},"c":{},"turn":true},{"steph":"134c","speaker":"Σωκράτης","greek":"αὐτῷ ἄρα σοὶ πρῶτον κτητέον ἀρετήν, καὶ ἄλλῳ ὃς μέλλει μὴ ἰδίᾳ μόνον αὑτοῦ τε καὶ τῶν αὑτοῦ ἄρξειν καὶ ἐπιμελήσεσθαι, ἀλλὰ πόλεως καὶ τῶν τῆς πόλεως.","english":"Then you yourself must first acquire excellence, and so must anyone else who is going to rule and take care not only of himself and his own things in private, but of the city and the city’s things.","g":{},"c":{},"turn":true},{"steph":"134c","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"You are right.","g":{},"c":{},"turn":true},{"steph":"134c","speaker":"Σωκράτης","greek":"οὐκ ἄρα ἐξουσίαν{a} σοι οὐδ᾽ ἀρχὴν παρασκευαστέον σαυτῷ ποιεῖν ὅτι ἂν βούλῃ, οὐδὲ τῇ πόλει, ἀλλὰ δικαιοσύνην καὶ σωφροσύνην.","english":"Then it is not license or power to do whatever you want that you must provide for yourself, nor for the city, but justice and temperance.","g":{"a":["ἐξουσίαν","“license, power to act,” from ἔξεστι, “it is permitted”: freedom to do as one wishes, set against virtue."]},"c":{},"turn":true},{"steph":"134c","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"134d","speaker":"Σωκράτης","greek":"δικαίως μὲν γὰρ πράττοντες καὶ σωφρόνως σύ τε καὶ ἡ πόλις θεοφιλῶς πράξετε.","english":"For if you and the city act justly and temperately, you will act in a way dear to the gods.","g":{},"c":{},"turn":true},{"steph":"134d","speaker":"Ἀλκιβιάδης","greek":"εἰκός γε.","english":"Probably.","g":{},"c":{},"turn":true},{"steph":"134d","speaker":"Σωκράτης","greek":"καὶ ὅπερ γε ἐν τοῖς πρόσθεν ἐλέγομεν, εἰς τὸ θεῖον καὶ λαμπρὸν ὁρῶντες πράξετε.","english":"And, as we said before, you will act looking toward what is divine and bright.","g":{},"c":{},"turn":true},{"steph":"134d","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"134d","speaker":"Σωκράτης","greek":"ἀλλὰ μὴν ἐνταῦθά γε βλέποντες ὑμᾶς τε αὐτοὺς καὶ τὰ ὑμέτερα ἀγαθὰ κατόψεσθε καὶ γνώσεσθε.","english":"And looking there, you will see and know yourselves and your own goods.","g":{},"c":{},"turn":true},{"steph":"134d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"134d","speaker":"Σωκράτης","greek":"οὐκοῦν ὀρθῶς τε καὶ εὖ πράξετε;","english":"And will you not act rightly and well?","g":{},"c":{},"turn":true},{"steph":"134d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"134e","speaker":"Σωκράτης","greek":"ἀλλὰ μὴν οὕτω γε πράττοντας ὑμᾶς ἐθέλω ἐγγυήσασθαι ἦ μὴν εὐδαιμονήσειν.","english":"Well, if you act this way, I am willing to guarantee that you will surely be happy.","g":{},"c":{},"turn":true},{"steph":"134e","speaker":"Ἀλκιβιάδης","greek":"ἀσφαλὴς γὰρ εἶ ἐγγυητής.","english":"Yes, you are a safe guarantor.","g":{},"c":{},"turn":true},{"steph":"134e","speaker":"Σωκράτης","greek":"ἀδίκως δέ γε πράττοντες, εἰς τὸ ἄθεον καὶ σκοτεινὸν βλέποντες, ὡς τὰ εἰκότα, ὅμοια τούτοις πράξετε ἀγνοοῦντες ὑμᾶς αὐτούς.","english":"But if you act unjustly, looking toward what is godless and dark, you will probably act in keeping with these, not knowing yourselves.","g":{},"c":{},"turn":true},{"steph":"134e","speaker":"Ἀλκιβιάδης","greek":"ἔοικεν.","english":"It seems so.","g":{},"c":{},"turn":true},{"steph":"134e","speaker":"Σωκράτης","greek":"ὧι γὰρ ⟨ἄν⟩, ὦ φίλε Ἀλκιβιάδη, ἐξουσία μὲν ᾖ ποιεῖν ὃ βούλεται, νοῦν δὲ μὴ ἔχῃ, τί τὸ εἰκὸς συμβαίνειν, ἰδιώτῃ ἢ καὶ πόλει; οἷον νοσοῦντι ἐξουσίας οὔσης δρᾶν ὃ |135a| βούλεται, νοῦν ἰατρικὸν μὴ ἔχοντι, τυραννοῦντι δὲ ὡς μηδὲν ἐπιπλήττοι τις αὐτῷ, τί τὸ συμβησόμενον; ἆρ᾽ οὐχ, ὡς τὸ εἰκός, διαφθαρῆναι τὸ σῶμα;","english":"For, my dear Alcibiades, if someone has license to do what he wants but lacks understanding, what is likely to happen to him, private person or city? For instance, if a sick man has license to do what he wants but lacks medical understanding, and is a tyrant so that no one may rebuke him, what will happen? Will not his body, as is likely, be ruined?","g":{},"c":{},"turn":true},{"steph":"135a","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"You are right.","g":{},"c":{},"turn":true},{"steph":"135a","speaker":"Σωκράτης","greek":"τί δ᾽ ἐν νηί, εἴ τῳ ἐξουσία εἴη ποιεῖν ὃ δοκεῖ, νοῦ τε καὶ ἀρετῆς κυβερνητικῆς ἐστερημένῳ, καθορᾷς ἃ ἂν συμβαίη αὐτῷ τε καὶ τοῖς συνναύταις;","english":"And in a ship, if someone had license to do what he thought fit but lacked understanding and the helmsman’s excellence, do you see what would happen to him and his fellow sailors?","g":{},"c":{},"turn":true},{"steph":"135a","speaker":"Ἀλκιβιάδης","greek":"ἔγωγε, ὅτι γε ἀπόλοιντο πάντες ἄν.","english":"I do: they would all perish.","g":{},"c":{},"turn":true},{"steph":"135a","speaker":"Σωκράτης","greek":"οὐκοῦν ὡσαύτως ἐν πόλει τε καὶ πάσαις ἀρχαῖς καὶ |135b| ἐξουσίαις ἀπολειπομέναις ἀρετῆς ἕπεται τὸ κακῶς πράττειν;","english":"And in the same way, in a city and in all offices and powers that lack excellence, faring badly follows?","g":{},"c":{},"turn":true},{"steph":"135b","speaker":"Ἀλκιβιάδης","greek":"ἀνάγκη.","english":"Necessarily.","g":{},"c":{},"turn":true},{"steph":"135b","speaker":"Σωκράτης","greek":"οὐκ ἄρα τυραννίδα{a} χρή, ὦ ἄριστε Ἀλκιβιάδη, παρασκευάζεσθαι οὔθ᾽ αὑτῷ οὔτε τῇ πόλει, εἰ μέλλετε εὐδαιμονεῖν, ἀλλ᾽ ἀρετήν.","english":"Then it is not tyranny, my excellent Alcibiades, that you must provide, either for yourself or for the city, if you are to be happy, but excellence.","g":{"a":["τυραννίδα","“tyranny,” absolute one-man rule seized outside the law; τύραννος may be a loanword from Lydian."]},"c":{},"turn":true},{"steph":"135b","speaker":"Ἀλκιβιάδης","greek":"ἀληθῆ λέγεις.","english":"You are right.","g":{},"c":{},"turn":true},{"steph":"135b","speaker":"Σωκράτης","greek":"πρὶν δέ γε ἀρετὴν ἔχειν, τὸ ἄρχεσθαι ἄμεινον ὑπὸ τοῦ βελτίονος ἢ τὸ ἄρχειν ἀνδρί, οὐ μόνον παιδί.","english":"And before one has excellence, it is better to be ruled by one who is better than to rule, for a man and not only for a child.","g":{},"c":{},"turn":true},{"steph":"135b","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"135b","speaker":"Σωκράτης","greek":"οὐκοῦν τό γ᾽ ἄμεινον καὶ κάλλιον;","english":"And the better is also finer?","g":{},"c":{},"turn":true},{"steph":"135b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"135b","speaker":"Σωκράτης","greek":"τὸ δὲ κάλλιον πρεπωδέστερον;","english":"And the finer is more fitting?","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Ἀλκιβιάδης","greek":"πῶς δ᾽ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Σωκράτης","greek":"πρέπει ἄρα τῷ κακῷ δουλεύειν· ἄμεινον γάρ.","english":"Then it is fitting for the bad man to be a slave; for it is better.","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Σωκράτης","greek":"δουλοπρεπὲς{b} ἄρ᾽ ἡ κακία.","english":"Then vice befits a slave.","g":{"b":["δουλοπρεπὲς","“befitting a slave,” δοῦλος + πρέπω (be fitting); its opposite ἐλευθεροπρεπές, “befitting the free,” follows."]},"c":{},"turn":true},{"steph":"135c","speaker":"Ἀλκιβιάδης","greek":"φαίνεται.","english":"Apparently.","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Σωκράτης","greek":"ἐλευθεροπρεπὲς δὲ ἡ ἀρετή.","english":"And excellence befits a free man.","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Σωκράτης","greek":"οὐκοῦν φεύγειν χρή, ὦ ἑταῖρε, τὴν δουλοπρέπειαν;","english":"Then must we not flee, my friend, what befits a slave?","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Ἀλκιβιάδης","greek":"μάλιστά γε, ὦ Σώκρατες.","english":"Most of all, Socrates.","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Σωκράτης","greek":"αἰσθάνῃ δὲ νῦν πῶς ἔχεις; ἐλευθεροπρεπῶς ἢ οὔ;","english":"And do you perceive now what state you are in? Befitting a free man, or not?","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Ἀλκιβιάδης","greek":"δοκῶ μοι καὶ μάλα σφόδρα αἰσθάνεσθαι.","english":"I think I perceive it all too well.","g":{},"c":{},"turn":true},{"steph":"135c","speaker":"Σωκράτης","greek":"οἶσθ᾽ οὖν πῶς ἀποφεύξῃ τοῦτο τὸ περὶ σὲ νῦν; ἵνα μὴ ὀνομάζωμεν αὐτὸ ἐπὶ καλῷ ἀνδρί,","english":"Do you know, then, how you will escape this state you are in now (let us not name it, in the case of a handsome man)?","g":{},"c":{},"turn":true},{"steph":"135d","speaker":"Ἀλκιβιάδης","greek":"ἔγωγε.","english":"I do.","g":{},"c":{},"turn":true},{"steph":"135d","speaker":"Σωκράτης","greek":"πῶς;","english":"How?","g":{},"c":{},"turn":true},{"steph":"135d","speaker":"Ἀλκιβιάδης","greek":"ἐὰν βούλῃ σύ, ὦ Σώκρατες.","english":"If you are willing, Socrates.","g":{},"c":{},"turn":true},{"steph":"135d","speaker":"Σωκράτης","greek":"οὐ καλῶς λέγεις, ὦ Ἀλκιβιάδη.","english":"You do not say it well, Alcibiades.","g":{},"c":{},"turn":true},{"steph":"135d","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ πῶς χρὴ λέγειν;","english":"How should I say it?","g":{},"c":{},"turn":true},{"steph":"135d","speaker":"Σωκράτης","greek":"ὅτι ἐὰν θεὸς ἐθέλῃ.","english":"‘If god is willing.’{67}","g":{},"c":{"67":["ἐὰν θεὸς ἐθέλῃ","The correction mirrors 105e and 124c: Socrates refuses to be the source of Alcibiades’ improvement. The Greek “if god wills” is the same piety as Latin *deo volente* and Arabic *in shāʾ Allāh*."]},"turn":true},{"steph":"135d","speaker":"Ἀλκιβιάδης","greek":"λέγω δή. καὶ πρὸς τούτοις μέντοι τόδε λέγω, ὅτι κινδυνεύσομεν μεταβαλεῖν τὸ σχῆμα, ὦ Σώκρατες, τὸ μὲν σὸν ἐγώ, σὺ δὲ τοὐμόν· οὐ γὰρ ἔστιν ὅπως οὐ παιδαγωγήσω σε ἀπὸ τῆσδε τῆς ἡμέρας, σὺ δ᾽ ὑπ᾽ ἐμοῦ παιδαγωγήσῃ.","english":"I say it, then. And in addition I say this: we are likely to exchange roles, Socrates, I taking yours and you mine. For there is no way I will not attend on you from this day on, and you will be attended on by me.","g":{},"c":{},"turn":true},{"steph":"135e","speaker":"Σωκράτης","greek":"ὦ γενναῖε, πελαργοῦ ἄρα ὁ ἐμὸς ἔρως οὐδὲν διοίσει, εἰ παρὰ σοὶ ἐννεοττεύσας ἔρωτα ὑπόπτερον ὑπὸ τούτου πάλιν θεραπεύσεται.","english":"My noble friend, then my love will be no different from a stork’s{68}, if after hatching a winged love in you it is cared for by it in return.","g":{},"c":{"68":["πελαργοῦ","Greeks believed young storks fed their aged parents, a proverb for filial gratitude (Aristophanes, *Birds* 1355). Socrates’ love has “hatched” a winged love in Alcibiades, which now promises to care for its parent."]},"turn":true},{"steph":"135e","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ οὕτως ἔχει, καὶ ἄρξομαί γε ἐντεῦθεν τῆς δικαιοσύνης ἐπιμέλεσθαι.","english":"Well, that is how it is; and I shall begin from this moment to take care of justice.","g":{},"c":{},"turn":true},{"steph":"135e","speaker":"Σωκράτης","greek":"βουλοίμην ἄν σε καὶ διατελέσαι· ὀρρωδῶ δέ, οὔ τι τῇ σῇ φύσει ἀπιστῶν, ἀλλὰ τὴν τῆς πόλεως ὁρῶν ῥώμην, μὴ ἐμοῦ τε καὶ σοῦ κρατήσῃ.","english":"I would wish you to continue to the end. But I am afraid, not from any distrust of your nature, but seeing the strength of the city, that it may get the better of both me and you{69}.","g":{},"c":{"69":["μὴ ἐμοῦ τε καὶ σοῦ κρατήσῃ","The last line is dark foreshadowing. Athens did overpower both: it exiled Alcibiades (415 and 406) and executed Socrates (399), partly for having taught men like him."]},"turn":true}],"site":{"name":"Sefarium","tagline":"Greek dialogues with facing translation and commentary","donateUrl":"","texts":[{"author":"Plato","title":"Alcibiades I","greek":"Ἀλκιβιάδης α","range":"103a–135e","status":"Complete: Greek, new English translation, transliteration, grammar notes and commentary.","blurb":"Socrates approaches the young Alcibiades on the eve of his political career and asks what he knows of justice, what it is to take care of oneself, and what the self is that the Delphic command bids us know."}],"topics":[{"title":"Know yourself","greek":"γνῶθι σαυτόν","text":"The Delphic inscription first means “know your real rivals,” then becomes the dialogue’s central question: what is the self one must know? The answer is the mirror image of the eye seeing itself in another’s eye.","refs":[["124a","The Delphic command introduced"],["129a","Is self-knowledge easy or hard?"],["132c","Rereading the inscription"],["133a","The eye that sees itself in another eye"],["133c","Looking into the divine part of the soul"]]},{"title":"Care of the self","greek":"ἐπιμέλεια ἑαυτοῦ","text":"Before ruling others, one must take care of oneself; but caring for one’s body or belongings is not caring for oneself.","refs":[["127e","What is taking care of oneself?"],["128a","Feet, shoes and rings: oneself versus one’s belongings"],["128d","A different art for oneself and for one’s things"],["132b","The soul must be cared for; bodies and money handed to others"]]},{"title":"The self is the soul","greek":"ψυχή","text":"The user differs from what he uses; a person uses the body; so the person is the soul that rules it.","refs":[["129b","Socrates converses using speech"],["129e","A man is different from his body"],["130c","The soul is the man"],["130e","Speaking soul to soul"]]},{"title":"Love and the lover","greek":"ἔρως","text":"The dialogue opens and closes as a love story: the other lovers loved a fading body, Socrates loves the soul and so remains.","refs":[["103a","The first lover, the only one left"],["104c","Why does Socrates stay?"],["131c","Lover of the body, lover of the soul"],["131e","The only lover Alcibiades ever had"],["135d","The stork: love returned"]]},{"title":"Knowing and thinking one knows","greek":"οἴεσθαι εἰδέναι","text":"Mistakes come not from ignorance as such but from not knowing that one does not know.","refs":[["106e","When did you think you did not know?"],["110a","Alcibiades always thought he knew justice"],["117b","The soul wanders where it does not know"],["117d","The ignorance that causes mistakes"],["118b","Living with the worst stupidity"]]},{"title":"Justice and advantage","greek":"τὰ δίκαια καὶ τὰ συμφέροντα","text":"Alcibiades claims the just and the advantageous come apart; Socrates leads him to say they are the same.","refs":[["109b","War is waged over injustice"],["113d","Alcibiades: the just and the advantageous differ"],["114e","Socrates as an audience of one"],["116d","The just is advantageous"]]},{"title":"Who is the speaker?","greek":"ὁ λέγων","text":"In question and answer, the one who answers is the one asserting. Socrates only asks; Alcibiades refutes himself.","refs":[["112e","Who said that Alcibiades knows nothing?"],["113b","The answerer is the speaker"],["116d","“Is it not you who are saying this?”"]]},{"title":"Teachers and the many","greek":"οἱ πολλοί","text":"The crowd teaches language well because it agrees about words; it cannot teach justice because it fights over it.","refs":[["110d","Learned from the many"],["111a","The many as teachers of Greek"],["112a","Homer and the wars over justice"],["118c","Can Pericles make anyone wise?"]]},{"title":"The rivals: Sparta and Persia","greek":"οἱ ἀνταγωνισταί","text":"Socrates sets Alcibiades’ upbringing beside the Spartan and Persian royal educations, with their four tutors for the four virtues.","refs":[["120a","The real rivals"],["121c","The birth of a Persian prince"],["121e","Four royal tutors"],["122b","Wealth of Sparta and Persia"],["123d","What the Persian queen would say"]]},{"title":"The divine sign","greek":"τὸ δαιμόνιον","text":"Socrates’ divine sign held him back from speaking to Alcibiades until now; he names the god as his guardian.","refs":[["103a","The divine opposition"],["105e","Why the god waited"],["124c","My guardian is a god"],["135d","“If god is willing”"]]},{"title":"The city and its dangers","greek":"ὁ δῆμος","text":"Good government needs virtue, not walls and ships; Socrates fears the city will overpower them both.","refs":[["106c","Rising to advise the assembly"],["125b","Ruling over citizens"],["126c","Friendship and agreement in the city"],["132a","The lover of the people"],["134b","Virtue, not walls"],["135e","The last line: the strength of the city"]]}]}}</script>

<script>
(function(){
  if (location.hash === "#texts") { location.replace("texts/index.html"); return; }
  const D = JSON.parse(document.getElementById('content').textContent);
  const SEG = D.segments;
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const GREEK_RUN = /([Ͱ-Ͽἀ-῿][Ͱ-Ͽἀ-῿᾽·’ ,.·-]*[Ͱ-Ͽἀ-῿᾽-]|[Ͱ-Ͽἀ-῿])/g;
  const page = st => st.replace(/[a-e]$/,'');

  /* ---------- a viewer's own choices, kept in this browser only ---------- */
  const S = {lang:'bi', layout:'stacked', scale:1, accents:true, translit:false, plain:false};
  try{ Object.assign(S, JSON.parse(localStorage.getItem('alc-reader')||'{}')); }catch(e){}
  let sel = null; const open = {};
  const save = () => { try{ localStorage.setItem('alc-reader', JSON.stringify(S)); }catch(e){} };

  /* ---------- transliteration ---------- */
  const B = {'α':'a','β':'b','γ':'g','δ':'d','ε':'e','ζ':'z','η':'ē','θ':'th','ι':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','φ':'ph','χ':'ch','ψ':'ps','ω':'ō'};
  function trWord(w){
    const L = [...w].map(ch=>{const d=ch.normalize('NFD'),b=d[0],l=b.toLowerCase();return {b:l,up:b!==l,rough:d.includes('̔'),isub:d.includes('ͅ'),diaer:d.includes('̈'),raw:ch};});
    let out='', i=0; const cap=L.length&&L[0].up, rough=L.slice(0,2).some(x=>x.rough);
    while(i<L.length){
      const x=L[i], b=x.b;
      if(!(b in B)){ out += (x.raw==='᾽'||x.raw==='’')?"'":x.raw; i++; continue; }
      const nx=L[i+1]?L[i+1].b:'', nd=L[i+1]?L[i+1].diaer:false;
      if('αεηο'.includes(b)&&(nx==='υ'||nx==='ι')&&!nd){ out+=B[b]+(nx==='υ'?'u':'i'); i+=2; }
      else if(b==='υ'&&nx==='ι'&&!nd){ out+='yi'; i+=2; }
      else if(b==='γ'&&nx&&'γκξχ'.includes(nx)){ out+='n'; i++; }
      else if(b==='ρ'&&i===0){ out+='rh'; i++; }
      else { out+=B[b]+(x.isub?'i':''); i++; }
    }
    if(rough) out='h'+out;
    if(cap) out=out[0].toUpperCase()+out.slice(1);
    return out;
  }
  const translit = (t, plain) => {
    let r = t.replace(/[Ͱ-Ͽἀ-῿]+[᾽’]?/g, trWord).replace(/[··]/g,';');
    return plain ? r.normalize('NFD').replace(/̄/g,'').normalize('NFC') : r;
  };
  const bare = t => t.normalize('NFD').replace(/[̀́̂̓̔͂̈]/g,'').normalize('NFC');
  const stripMarks = s => s.replace(/\{[^}]+\}/g,'').replace(/\|[^|]+\|\s?/g,'').replace(/\s+/g,' ').trim();

  /* ---------- rendering ---------- */
  const inline = s => esc(s).replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(GREEK_RUN, m=>'<span class="gk">'+m+'</span>');
  const noteHtml = n => '<span class="lem">'+esc(n[0])+'</span>&thinsp;]&ensp;'+inline(n[1]);
  const SPK = {'Σωκράτης':['ΣΩ.','Soc.'],'Ἀλκιβιάδης':['ΑΛ.','Alc.']};

  function withNotes(text, notes, i, kind, greek){
    let t = esc(text).replace(/\|([0-9]+[a-e])\|\s?/g, (_,n)=>'<span class="inmark">'+n+'</span>');
    if(greek && !S.accents) t = bare(t);
    return t.replace(/\{([a-z]+|[0-9]+)\}/g, (_,k)=>{
      const n = notes[k]; if(!n) return '';
      const id = 'fn-'+i+'-'+kind+k, o = open[id];
      return '<sup class="fm" role="button" tabindex="0" aria-expanded="'+(o?'true':'false')+'" data-fn="'+id+'">'+k+'</sup>'
        + '<span class="fn'+(o?' open':'')+'" id="'+id+'"> '+noteHtml(n)+' </span>';
    });
  }

  function segHtml(s, i, newTurn, segNo, newSec){
    const spk = SPK[s.speaker] || [s.speaker, s.speaker];
    const g = (newTurn ? '<span class="spk">'+esc(S.accents?spk[0]:bare(spk[0]))+'</span>' : '') + withNotes(s.greek, s.g, i, 'g', true);
    const e = (newTurn ? '<span class="spk">'+spk[1]+'</span>' : '') + withNotes(s.english, s.c, i, 'c', false);
    const short = stripMarks(s.greek).split(' ').length < 9;
    return '<article class="seg'+(newTurn?' turn':'')+(short?' short':'')+(sel===i?' sel':'')+'" tabindex="0" data-i="'+i+'" id="seg-'+(i+1)+'" data-steph="'+s.steph+'">'
      + '<span class="bullet"></span>'
      + '<span class="num">'+(newSec?'<b>'+s.steph+'</b>':'')+'</span>'
      + '<div class="srcwrap"><div class="src">'+g+'</div><div class="tr">'+esc(translit(stripMarks(s.greek), S.plain))+'</div></div>'
      + '<div class="en">'+e+'</div></article>';
  }

  function render(){
    const parts = ['<div class="title-block"><div class="gt">'+esc(S.accents?D.work.greekTitle:bare(D.work.greekTitle))+'</div><div class="et">'+esc(D.work.author)+', '+esc(D.work.title)+'</div><div class="persons">Persons of the dialogue: Socrates, Alcibiades</div></div>'];
    let lastPage=null, lastSec=null, lastSpk=null;
    SEG.forEach((s,i)=>{
      const p = page(s.steph);
      if(p!==lastPage){ parts.push('<h2 class="page-head" id="p-'+p+'">'+p+'</h2>'); lastPage=p; }
      const newSec = s.steph!==lastSec; lastSec = s.steph;
      const newTurn = !!s.turn;
      parts.push(segHtml(s, i, newTurn, 0, newSec));
    });
    parts.push('<p class="endmark">END OF THE DIALOGUE</p>');
    $('column').innerHTML = parts.join('');
    $('reader').className = 'reader '+S.layout+' lang-'+S.lang+(S.translit?'':' no-tr');
    document.documentElement.style.setProperty('--scale', S.scale);
    $('edition').textContent = D.work.edition;
    syncMenu(); renderPanel(); updateCite();
  }

  function rerenderSeg(i){
    const el = document.getElementById('seg-'+(i+1)); if(!el) return;
    const prev = SEG[i-1];
    const newTurn = !!SEG[i].turn;
    const newSec = !prev || prev.steph!==SEG[i].steph;
    const tmp = document.createElement('div'); tmp.innerHTML = segHtml(SEG[i], i, newTurn, 0, newSec);
    el.replaceWith(tmp.firstChild);
  }

  let panelMode = 'seg', aiState = null;
  function renderPanel(){
    const p = $('panel');
    if(panelMode==='ai'){ p.hidden = false; renderAI(); return; }
    if(sel==null){ p.hidden = true; return; }
    p.hidden = false;
    const s = SEG[sel];
    const list = (src) => { const ks = Object.keys(src); return ks.length ? ks.map(k=>'<div class="item"><span class="k">'+k+'</span>'+noteHtml(src[k])+'</div>').join('') : '<p class="empty">None on this segment.</p>'; };
    const spk = (SPK[s.speaker]||['',''])[1].replace('.','');
    $('pbody').innerHTML =
      '<div class="ref">'+esc(D.work.title)+' '+esc(s.steph)+' <span class="cnt">· '+esc(spk==='Soc'?'Socrates':'Alcibiades')+'</span></div>'
      + '<h2>Commentary <span class="cnt">('+Object.keys(s.c).length+')</span></h2>'+list(s.c)
      + '<h2>Grammar <span class="cnt">('+Object.keys(s.g).length+')</span></h2>'+list(s.g)
      + '<h2>Transliteration</h2><div class="item tlit">'+esc(translit(stripMarks(s.greek), S.plain))
      + '<small>'+(S.plain?'Plain spelling: no length marks; θ = th, φ = ph, χ = ch, ψ = ps, υ = y; rough breathing = h.':'Scholarly scheme: η = ē, ω = ō, θ = th, φ = ph, χ = ch, ψ = ps, υ = y (u in diphthongs); rough breathing = h; iota subscript written as i (τῷ = tōi).')+'</small></div>'
      + '<p class="about">'+esc(D.source.text)+' <a href="'+esc(D.source.url)+'">Greek source</a></p>';
  }

  function syncMenu(){
    document.querySelectorAll('#langgrp button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===S.lang));
    document.querySelectorAll('.layouts button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.layout===S.layout));
    $('sw-acc').setAttribute('aria-checked', S.accents);
    $('sw-tr').setAttribute('aria-checked', S.translit);
    $('sw-plain').setAttribute('aria-checked', S.plain);
    $('row-plain').classList.toggle('on', S.translit);
  }

  /* ---------- page navigation and live citation ---------- */
  const pages = [...new Set(SEG.map(s=>page(s.steph)))];
  $('jump').innerHTML = pages.map(p=>'<option value="'+p+'">'+p+'</option>').join('');
  let curSteph = SEG[0].steph;
  function updateCite(){
    const s = sel!=null ? SEG[sel].steph : curSteph;
    $('cite').textContent = D.work.title+' '+s;
    const p = page(s);
    if($('jump').value!==p) $('jump').value = p;
    const k = pages.indexOf(p);
    $('prev').disabled = k<=0; $('next').disabled = k>=pages.length-1;
  }
  function goPage(p){ const el = document.getElementById('p-'+p); if(el){ el.scrollIntoView({block:'start'}); curSteph = p+'a'; const first = SEG.find(s=>page(s.steph)===p); if(first) curSteph = first.steph; updateCite(); } }
  $('jump').addEventListener('change', e=>goPage(e.target.value));
  $('prev').addEventListener('click', ()=>{ const k=pages.indexOf(page(curSteph)); if(k>0) goPage(pages[k-1]); });
  $('next').addEventListener('click', ()=>{ const k=pages.indexOf(page(curSteph)); if(k<pages.length-1) goPage(pages[k+1]); });
  let ticking = false;
  const siteH = () => document.querySelector('.sitebar').getBoundingClientRect().height;
  const barH = () => siteH() + (document.querySelector('.readerbar').hidden ? 0 : document.querySelector('.readerbar').getBoundingClientRect().height);
  const setBar = () => { document.documentElement.style.setProperty('--siteh', siteH()+'px'); document.documentElement.style.setProperty('--barh', barH()+'px'); };
  window.addEventListener('resize', setBar);
  window.addEventListener('scroll', ()=>{
    if(ticking) return; ticking = true;
    requestAnimationFrame(()=>{
      ticking = false;
      const col = $('column').getBoundingClientRect();
      const el = document.elementFromPoint(col.left + col.width/2, barH() + 40);
      const seg = el && el.closest && el.closest('.seg');
      if(seg){ curSteph = seg.dataset.steph; if(sel==null) updateCite(); else { const p=page(curSteph); if($('jump').value!==p) $('jump').value=p; } }
    });
  }, {passive:true});

  /* ---------- AI summary (asks Claude through the page's sample capability) ---------- */
  let sample = null;
  if(window.claude && typeof window.claude.use==='function'){
    window.claude.use('sample').then(sm=>{ if(sm){ sample = sm; $('aibtn').hidden = false; setBar(); } }).catch(()=>{});
  }
  function fmtAI(t){
    const lines = esc(t).split(/\n/); let html='', inList=false;
    for(const raw of lines){
      const l = raw.trim();
      if(!l){ if(inList){ html+='</ul>'; inList=false; } continue; }
      if(/^- /.test(l)){ if(!inList){ html+='<ul>'; inList=true; } html+='<li>'+l.slice(2)+'</li>'; continue; }
      if(inList){ html+='</ul>'; inList=false; }
      const hm = /^(Where we are|In brief|The argument step by step|The argument|Commentary|Words to notice|A question to consider)\s*:\s*(.*)$/i.exec(l) || /^(Where we are|In brief|The argument|Commentary|Words to notice|A question to consider)\s*$/i.exec(l);
      if(hm){ html+='<h3>'+hm[1]+'</h3>'; if(hm[2]) html+='<p>'+hm[2]+'</p>'; }
      else html+='<p>'+l+'</p>';
    }
    if(inList) html+='</ul>';
    return html.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(GREEK_RUN, m=>'<span class="gk">'+m+'</span>');
  }
  function renderAI(){
    const a = aiState;
    let body = '<div class="ref">AI summary · page '+esc(a.page)+'</div><p class="ai-note">Written by Claude from the Greek, the translation and this edition’s notes. It may contain mistakes; check it against the text.</p>';
    if(a.error) body += '<p class="empty">'+esc(a.error)+'</p>';
    else body += '<div class="item ai">'+(a.text && a.text!=='Thinking...' ? fmtAI(a.text) : '<p class="ai-wait">Reading page '+esc(a.page)+' closely… this can take up to a minute.</p>')+'</div>';
    if(a.done || a.error) body += '<p class="about"><button class="linkbtn" id="ai-again">Summarize again</button></p>';
    $('pbody').innerHTML = body;
    const again = document.getElementById('ai-again'); if(again) again.onclick = ()=>summarize(a.page, false);
  }
  async function summarize(p, useCache){
    if(!sample) return;
    if(aiState && aiState.ctrl) aiState.ctrl.abort();
    const ctrl = new AbortController();
    aiState = {page:p, text:'', done:false, error:null, ctrl};
    panelMode = 'ai'; renderPanel();
    const segs = SEG.filter(x=>page(x.steph)===p);
    const fmtSeg = x => {
      const who = x.speaker==='Σωκράτης' ? 'SOCRATES' : 'ALCIBIADES';
      return '['+x.steph+'] '+who+'\nGreek: '+stripMarks(x.greek)+'\nEnglish: '+stripMarks(x.english);
    };
    const passage = segs.map(fmtSeg).join('\n\n');
    const k = SEG.indexOf(segs[0]);
    const before = SEG.slice(Math.max(0,k-4), k).map(fmtSeg).join('\n\n');
    const notes = segs.flatMap(x=>[...Object.values(x.c).map(n=>'Commentary on '+n[0]+': '+n[1]), ...Object.values(x.g).map(n=>'Grammar on '+n[0]+': '+n[1])]).join('\n');
    const OUTLINE = [
      '103a–106c Prologue: Socrates, the first and only constant lover, breaks his silence; Alcibiades’ ambitions for Athens, Greece and Asia; the divine sign.',
      '106c–109c On what will Alcibiades advise the assembly? Every art has its “better”; the better in war and peace turns out to be the just.',
      '109c–113c Where did he learn justice? Neither found out nor learned; the many cannot teach it because they disagree; the answerer, not the questioner, is the one speaking.',
      '113d–116e Alcibiades separates the just from the advantageous; Socrates argues the just, the fine, the good and the advantageous coincide.',
      '116e–119a Diagnosis: wandering answers show ignorance; the worst ignorance is thinking one knows; Pericles makes no one wise.',
      '119a–124b The real rivals are the Spartan and Persian kings: birth, royal education with four tutors, wealth; the Delphic “Know yourself.”',
      '124b–127e What excellence makes good men? Ruling citizens, good counsel, friendship as agreement; Alcibiades reaches perplexity.',
      '127e–130c Care of oneself versus care of one’s belongings; the user differs from what he uses; the self is the soul.',
      '130c–132c Conversation is soul to soul; self-knowledge is temperance; only the lover of the soul stays; the danger of becoming a lover of the people.',
      '132c–134a The eye sees itself in another eye’s pupil; the soul knows itself by looking at its divine part and at god.',
      '134a–135e Cities need virtue, not walls, ships or power; tyranny versus excellence; the stork; Socrates fears the city will overpower them both.'
    ].join('\n');
    const prompt = 'You are a learned and lively commentator on Plato, writing for a serious general reader of Alcibiades I in a facing Greek–English edition laid out like a Torah commentary (plain sense first, then interpretation). '
      + 'Your task: an intelligent reading of Stephanus page '+p+'. Do not merely paraphrase. Explain what the page is doing in the argument and the drama, and think critically about it. '
      + 'Ground every claim in the Greek and English given; cite sections in parentheses like (129b). You may draw on well-established knowledge of Plato, Socratic method, Athenian history and the historical Alcibiades, but do not invent quotations or scholars’ names; if scholars disagree, say so in general terms.\n\n'
      + 'Write these parts, each heading on its own line followed by its content:\n'
      + 'Where we are: one or two sentences placing this page in the dialogue’s overall movement (use the outline).\n'
      + 'In brief: two or three sentences on what happens and why it matters.\n'
      + 'The argument: three to six lines beginning with "- ", each a step in Socrates’ reasoning with its section. Where a premise is doubtful, ambiguous, or conceded too quickly by Alcibiades, add "Watch this step:" and say why in one sentence.\n'
      + 'Commentary: two or three short paragraphs of interpretation: the drama between the two men, irony in light of what became of Alcibiades (his politics, the Sicilian expedition, exile) and of Socrates’ trial, the significance of a key Greek word or turn of phrase, and connections to other dialogues (e.g. Symposium, Republic, Charmides, Apology) only where they genuinely illuminate.\n'
      + 'Words to notice: two to four lines beginning with "- ", each a key Greek word from this page in **bold**, its transliteration in parentheses, what it means here, and English words descended from it if any.\n'
      + 'A question to consider: one probing question a reader could think about.\n\n'
      + 'Use no other headings and no markdown except "- " bullets and **bold**. Keep it under 550 words.\n\n'
      + 'OUTLINE OF THE DIALOGUE\n'+OUTLINE+'\n\n'
      + (before ? 'END OF THE PREVIOUS PAGE (for context only)\n'+before+'\n\n' : '')
      + 'THE PAGE TO DISCUSS: '+p+'\n'+passage+'\n\n'
      + (notes ? 'THIS EDITION’S NOTES ON THE PAGE (you may build on or disagree with them)\n'+notes : '');
    try{
      const r = await sample(prompt, {signal:ctrl.signal, modelTier:'complex', cache:useCache!==false,
        onText: ({text}) => { if(aiState && aiState.ctrl===ctrl){ aiState.text = text; renderAI(); } }});
      if(aiState && aiState.ctrl===ctrl){ aiState.text = r.text; aiState.done = true; renderAI(); }
    }catch(e){
      if(ctrl.signal.aborted) return;
      if(e && e.code==='not_granted'){ $('aibtn').hidden = true; panelMode='seg'; renderPanel(); return; }
      aiState.error = (e && e.code==='rate_limited') ? 'Too many summaries in a short time. Please wait a minute and try again.' : 'The summary could not be written just now. Please try again.';
      renderAI();
    }
  }
  $('aibtn').addEventListener('click', ()=>{ const s = sel!=null ? SEG[sel].steph : curSteph; summarize(page(s)); });

  /* ---------- events ---------- */
  const update = () => { save(); const y=window.scrollY; render(); window.scrollTo(0,y); };
  $('abtn').addEventListener('click', e=>{ const m=$('menu'); m.hidden=!m.hidden; $('abtn').setAttribute('aria-expanded', !m.hidden); e.stopPropagation(); });
  document.addEventListener('click', e=>{ if(!$('menu').hidden && !$('menu').contains(e.target)){ $('menu').hidden=true; $('abtn').setAttribute('aria-expanded','false'); } });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ $('menu').hidden=true; $('abtn').setAttribute('aria-expanded','false'); } });
  $('menu').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.lang){ S.lang=b.dataset.lang; }
    else if(b.dataset.layout){ S.layout=b.dataset.layout; }
    else if(b.id==='fminus'){ S.scale=Math.max(.8, +(S.scale-.1).toFixed(2)); }
    else if(b.id==='fplus'){ S.scale=Math.min(1.6, +(S.scale+.1).toFixed(2)); }
    else if(b.id==='sw-acc'){ S.accents=!S.accents; }
    else if(b.id==='sw-tr'){ S.translit=!S.translit; }
    else if(b.id==='sw-plain'){ S.plain=!S.plain; if(S.plain) S.translit=true; }
    update();
  });
  function toggleFn(el){
    const id=el.dataset.fn; open[id]=!open[id];
    el.setAttribute('aria-expanded', open[id]); document.getElementById(id).classList.toggle('open', open[id]);
  }
  function select(i){
    panelMode = 'seg';
    const old = sel; sel = (sel===i) ? null : i;
    if(old!=null){ const o=document.getElementById('seg-'+(old+1)); if(o) o.classList.remove('sel'); }
    if(sel!=null){ const n=document.getElementById('seg-'+(sel+1)); if(n) n.classList.add('sel'); }
    try{ history.replaceState(null,'', sel==null ? location.pathname+location.search : '#seg-'+(sel+1)); }catch(err){}
    renderPanel(); updateCite();
  }
  $('column').addEventListener('click', e=>{
    const fm = e.target.closest('sup.fm');
    if(fm){ e.stopPropagation(); toggleFn(fm); return; }
    if(e.target.closest('.fn')) return;
    const seg = e.target.closest('.seg'); if(!seg) return;
    if(window.getSelection && String(window.getSelection()).length) return;
    select(+seg.dataset.i);
  });
  $('column').addEventListener('keydown', e=>{
    if(e.key!=='Enter' && e.key!==' ') return;
    const fm = e.target.closest('sup.fm'); if(fm){ e.preventDefault(); toggleFn(fm); return; }
    const seg = e.target.closest('.seg'); if(seg){ e.preventDefault(); select(+seg.dataset.i); }
  });
  $('pclose').addEventListener('click', ()=>{ if(panelMode==='ai'){ panelMode='seg'; if(aiState&&aiState.ctrl) aiState.ctrl.abort(); renderPanel(); return; } if(sel!=null) select(sel); });
  /* ---------- site pages: Texts, Topics, Donate ---------- */
  const SITE = D.site;
  const firstOf = st => SEG.findIndex(x=>x.steph===st);
  function showView(v){
    const reading = v==='reader';
    document.querySelector('.readerbar').hidden = !reading;
    document.querySelector('.work').hidden = !reading;
    $('pageview').hidden = reading;
    document.querySelectorAll('.sitebar a[data-view]').forEach(a=>a.setAttribute('aria-current', a.dataset.view===v ? 'page' : 'false'));
    if(!reading){ $('pageview').innerHTML = VIEWS[v](); window.scrollTo(0,0); }
    setBar();
  }
  const VIEWS = {
    texts: () => '<div class="pv"><h1>Texts</h1><p class="lede">'+esc(SITE.tagline)+'.</p>'
      + SITE.texts.map(t=>'<section class="card"><div class="cat">'+esc(t.author)+'</div><h2><a href="#p-'+page(SEG[0].steph)+'">'+esc(t.title)+'</a> <span class="gk">'+esc(t.greek)+'</span></h2><p>'+esc(t.blurb)+'</p><p class="meta">'+esc(t.range)+' · '+esc(t.status)+'</p><a class="btn" href="#p-'+page(SEG[0].steph)+'">Start reading</a></section>').join('')
      + '<section class="card"><div class="cat">Plato · Greek</div><h2><a href="plato/index.html">The dialogues <span class="gk">οἱ διάλογοι</span></a></h2><p>Every work in the Perseus collection, in the Burnet Oxford text: the nine Thrasyllan tetralogies, with Stephanus numbers, including the doubtful dialogues and the Letters.</p><p class="meta">36 works · Greek only · CC BY-SA</p><a class="btn" href="plato/index.html">Open the library</a></section>'
      + '</div>',
    topics: () => '<div class="pv"><h1>Topics</h1><p class="lede">The main themes of <i>Alcibiades I</i>, with the passages where each one comes up.</p><div class="tgrid">'
      + SITE.topics.map(t=>'<section class="card topic"><h2>'+esc(t.title)+' <span class="gk">'+esc(t.greek)+'</span></h2><p>'+esc(t.text)+'</p><ul>'
        + t.refs.map(r=>'<li><a href="#s-'+r[0]+'"><b>'+r[0]+'</b> '+esc(r[1])+'</a></li>').join('')+'</ul></section>').join('')
      + '</div></div>',
    donate: () => '<div class="pv narrow"><h1>Donate</h1><p class="lede">'+esc(SITE.name)+' is a free edition of Greek dialogues with facing translation and commentary, in the manner of a Torah commentary.</p>'
      + (SITE.donateUrl ? '<p>If this work is useful to you, you can support it here:</p><a class="btn" href="'+esc(SITE.donateUrl)+'">Support '+esc(SITE.name)+'</a>'
                        : '<p class="card">Donations are not set up yet. Check back soon.</p>')
      + '</div>'
  };
  function fromHash(){
    const h = location.hash;
    if (h === "#texts") { location.replace("texts/index.html"); return; }
    const v = /^#(topics|donate)$/.exec(h);
    if(v){ showView(v[1]); return; }
    if(!$('pageview').hidden) showView('reader');
    const m=/^#seg-(\d+)$/.exec(h), p=/^#p-(\d+)$/.exec(h), st=/^#s-(\d+[a-e])$/.exec(h);
    if(m && SEG[+m[1]-1]){ const i=+m[1]-1; if(sel!==i){ sel=null; select(i); } const el=document.getElementById('seg-'+(i+1)); if(el) el.scrollIntoView({block:'center'}); }
    else if(st && firstOf(st[1])>=0){ const el=document.getElementById('seg-'+(firstOf(st[1])+1)); if(el){ el.scrollIntoView({block:'start'}); curSteph=st[1]; updateCite(); } }
    else if(p){ goPage(p[1]); }
  }
  window.addEventListener('hashchange', fromHash);
  setBar(); render(); if(!/^#(topics|donate)$/.test(location.hash)) showView('reader'); fromHash();
})();
</script>
</body>
