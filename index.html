<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sefarium · Plato, Alcibiades I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea (after Sefaria's reader): a header bar with the citation and a display-options menu;
   one reading column of numbered segments, source over translation (or side by side);
   footnotes open inline; clicking a segment opens a Resources panel with its commentary. */
:root{
  --bg:#ffffff;
  --chrome:#f7f7f6;     /* header bar, panel */
  --ink:#000000;
  --muted:#6d7178;
  --accent:#1e4d6b;     /* selection, links, segment numbers */
  --select:#edf3f8;     /* selected segment wash */
  --line:#e2e2df;
  --note:#4a4e55;
  --font-greek:"Gentium Book Plus","Gentium Plus","GFS Porson","Palatino Linotype",serif;
  --font-text:"EB Garamond","Garamond","Palatino Linotype",Georgia,serif;
  --font-ui:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --scale:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-text);display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg:focus{outline:none}
.seg:focus-visible{box-shadow:inset 3px 0 0 var(--accent)}

/* header bar */
.readerbar{flex:0 0 auto;display:grid;grid-template-columns:3rem 1fr 3rem;align-items:center;background:var(--chrome);border-bottom:1px solid var(--line);padding:.45rem 1rem;position:relative}
.cite{text-align:center;line-height:1.2}
.cite h1{margin:0;font-size:1.15rem;font-weight:500}
.cite .ed{font-family:var(--font-ui);font-size:.72rem;color:var(--muted)}
.abtn{justify-self:end;font-size:1.25rem;width:2.2rem;height:2.2rem;border-radius:4px}
.abtn:hover,.abtn[aria-expanded="true"]{background:var(--line)}

/* display options */
.menu{position:absolute;right:1rem;top:calc(100% + 4px);z-index:20;width:17rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.14);font-family:var(--font-ui);font-size:.85rem;padding:.35rem 0}
.menu[hidden]{display:none}
.menu .row{display:flex;align-items:center;justify-content:space-between;padding:.45rem .9rem;gap:.6rem}
.menu .row+.row,.menu .grp+.row,.menu .row+.grp{border-top:1px solid var(--line)}
.menu .grp button{display:flex;justify-content:space-between;width:100%;padding:.42rem .9rem;text-align:left}
.menu .grp button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.menu .grp button .dot{width:.85rem;height:.85rem;border:1.5px solid currentColor;border-radius:50%;opacity:.7}
.menu .grp button[aria-pressed="true"] .dot{background:currentColor;box-shadow:inset 0 0 0 2px var(--accent)}
.layouts{display:flex;gap:.3rem}
.layouts button{width:2.1rem;height:1.6rem;border-radius:3px;display:grid;place-items:center;color:var(--muted)}
.layouts button[aria-pressed="true"]{color:var(--accent);background:var(--select)}
.size{display:flex;align-items:center;gap:.5rem}
.size button{width:1.6rem;height:1.6rem;border:1px solid var(--muted);border-radius:50%;line-height:1}
.switch{width:2.3rem;height:1.3rem;border-radius:1rem;background:var(--line);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:calc(1.3rem - 4px);height:calc(1.3rem - 4px);border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:calc(100% - 1.3rem + 2px)}
.menu .row.sub{opacity:.45}
.menu .row.sub.on{opacity:1}

/* workspace */
.work{flex:1 1 auto;display:flex;min-height:0}
.reader{flex:1 1 auto;overflow-y:auto;min-width:0}
.column{max-width:44rem;margin:0 auto;padding:1.6rem 3.4rem 5rem}
.sidebyside .column{max-width:62rem}
.speaker{text-align:center;font-variant:small-caps;letter-spacing:.12em;color:var(--muted);font-size:.95rem;margin:.4rem 0 1.2rem}
.section-mark{font-family:var(--font-ui);font-size:.72rem;color:var(--muted);text-align:center;margin:1.4rem 0 .4rem;letter-spacing:.08em}

.seg{display:block;position:relative;padding:.7rem .9rem;margin:0 -.9rem .35rem;border-radius:3px;cursor:pointer}
.seg:hover{background:color-mix(in srgb,var(--select) 55%,transparent)}
.seg.sel{background:var(--select)}
.seg .num{position:absolute;right:-2.4rem;top:.95rem;font-family:var(--font-ui);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;width:2rem}
.seg .num b{display:block;color:var(--accent);font-weight:600}
.seg .bullet{position:absolute;left:-1.6rem;top:1.25rem;width:5px;height:5px;border-radius:50%;background:var(--line)}
.seg.sel .bullet{background:var(--accent)}
.src{font-family:var(--font-greek);font-size:calc(1.22rem*var(--scale));line-height:1.75}
.tr{font-family:var(--font-greek);font-style:italic;font-size:calc(.98rem*var(--scale));line-height:1.6;color:var(--muted);margin-top:.15rem}
.en{font-size:calc(1.13rem*var(--scale));line-height:1.6;color:var(--ink);margin-top:.45rem}
.stacked .en{color:var(--ink)}
.sidebyside .seg{display:grid;grid-template-columns:1fr 1fr;gap:0 3.2rem}
.sidebyside .en{margin-top:0}
.sidebyside .srcwrap{border:0;padding:0;margin:0}
.lang-src .en,.lang-src .fn-e{display:none}
.lang-en .srcwrap{display:none}
.lang-src .seg,.lang-en .seg{display:block}
.no-tr .tr{display:none}

sup.fm{font-family:var(--font-ui);font-style:normal;font-size:.62em;font-weight:600;color:var(--accent);cursor:pointer;padding:0 1px;line-height:0}
.fn{display:none;font-size:.86em;line-height:1.5;color:var(--note);font-family:var(--font-text)}
.fn.open{display:inline}
.fn .lem{font-family:var(--font-greek);font-weight:700;color:var(--ink)}
.gk{font-family:var(--font-greek)}

/* resources panel */
.panel{flex:0 0 24rem;background:var(--chrome);border-left:1px solid var(--line);overflow-y:auto;font-family:var(--font-ui)}
.panel[hidden]{display:none}
.panel header{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1.1rem;border-bottom:1px solid var(--line);font-size:.72rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;position:sticky;top:0;background:var(--chrome)}
.panel header button{font-size:1.1rem;color:var(--muted);width:1.8rem;height:1.8rem;border-radius:4px}
.panel .ref{padding:.8rem 1.1rem .2rem;font-family:var(--font-text);font-size:1.05rem}
.panel h2{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:1.1rem 1.1rem .4rem}
.panel .item{margin:0 1.1rem .7rem;padding:.75rem .9rem;background:var(--bg);border:1px solid var(--line);border-radius:4px;font-family:var(--font-text);font-size:.98rem;line-height:1.5}
.panel .item .k{font-family:var(--font-ui);font-size:.68rem;color:var(--accent);font-weight:600;margin-right:.35rem}
.panel .item .lem{font-family:var(--font-greek);font-weight:700}
.panel .item.tlit{font-family:var(--font-greek);font-style:italic}
.panel .item.tlit small{display:block;font-family:var(--font-ui);font-style:normal;font-size:.72rem;color:var(--muted);margin-top:.5rem}
.panel .empty{margin:0 1.1rem .7rem;color:var(--muted);font-size:.85rem}
.panel .about{font-size:.82rem;color:var(--muted);margin:1.2rem 1.1rem 1.5rem;line-height:1.45}
.panel a{color:var(--accent)}

@media (max-width:820px){
  .column{padding:1.2rem 2.6rem 4rem 1.6rem}
  .sidebyside .seg{display:block}
  .sidebyside .srcwrap{border:0;padding:0;margin:0}
  .sidebyside .en{margin-top:.45rem}
  .work{position:relative}
  .panel{position:absolute;inset:auto 0 0 0;max-height:60%;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12);flex-basis:auto}
}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}

/* full-dialogue additions */
.readerbar{grid-template-columns:auto 1fr 3rem}
.nav{display:flex;align-items:center;gap:.25rem;font-family:var(--font-ui);font-size:.82rem}
.nav button{width:1.9rem;height:1.9rem;border-radius:4px;color:var(--muted);font-size:1rem}
.nav button:hover{background:var(--line);color:var(--ink)}
.nav button:disabled{opacity:.3;cursor:default;background:none}
.nav select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.2rem .3rem}
.page-head{display:flex;align-items:center;gap:.8rem;margin:2.2rem 0 1rem;color:var(--muted);font-family:var(--font-ui);font-size:.74rem;letter-spacing:.14em}
.page-head::before,.page-head::after{content:"";flex:1;border-top:1px solid var(--line)}
.page-head:first-child{margin-top:.6rem}
.title-block{text-align:center;margin:.4rem 0 1.6rem}
.title-block .gt{font-family:var(--font-greek);font-size:1.6rem;letter-spacing:.06em}
.title-block .et{font-size:1.05rem;color:var(--muted);font-style:italic;margin-top:.2rem}
.title-block .persons{font-family:var(--font-ui);font-size:.74rem;color:var(--muted);letter-spacing:.08em;margin-top:.7rem}
.spk{font-family:var(--font-ui);font-style:normal;font-size:.68em;font-weight:600;letter-spacing:.08em;color:var(--accent);margin-right:.45em;text-transform:uppercase;vertical-align:.08em}
.src .spk{font-family:var(--font-greek);text-transform:none;letter-spacing:.04em;font-size:.82em}
.seg{margin-bottom:.15rem;padding:.55rem .9rem}
.seg.turn{margin-top:.5rem}
.seg.short .src{font-size:calc(1.12rem*var(--scale))}
.inmark{font-family:var(--font-ui);font-size:.6em;color:var(--accent);vertical-align:.4em;margin:0 .2em}
.lang-en .src .spk{display:none}
.panel .cnt{font-family:var(--font-ui);font-weight:400;color:var(--muted)}
.notes-only .seg{display:none}
.endmark{text-align:center;color:var(--muted);font-family:var(--font-ui);font-size:.75rem;letter-spacing:.14em;margin:3rem 0 1rem}

/* scroll the whole document rather than an inner box, so every viewer can scroll */
html,body{height:auto}
body{display:block;min-height:100vh}
.readerbar{position:sticky;top:0;z-index:30}
.work{display:flex;align-items:flex-start;min-height:0}
.reader{overflow:visible;flex:1 1 auto}
.panel{position:sticky;top:var(--barh,3.4rem);height:calc(100vh - var(--barh,3.4rem));align-self:flex-start}
.seg,.page-head{scroll-margin-top:calc(var(--barh,3.4rem) + 1rem)}
@media (max-width:820px){
  .panel{position:fixed;top:auto;inset:auto 0 0 0;height:auto;max-height:60vh;z-index:25}
}

/* site bar and site pages */
.sitebar{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem 2rem;padding:.7rem 1.4rem;background:var(--bg);border-bottom:3px solid var(--accent);font-family:var(--font-ui)}
.sitebar .brand{font-family:var(--font-text);font-size:1.35rem;font-weight:500;color:var(--ink);text-decoration:none;letter-spacing:.01em}
.sitebar .brand .mark{font-family:var(--font-greek);color:var(--accent);font-weight:400;font-size:1.22em;margin-right:.22em;line-height:1}
.sitebar ul{display:flex;gap:1.6rem;list-style:none;margin:0;padding:0}
.sitebar ul a{color:var(--muted);text-decoration:none;font-size:.92rem;padding:.25rem 0;border-bottom:2px solid transparent}
.sitebar ul a:hover{color:var(--ink)}
.sitebar ul a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.sitebar a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.readerbar[hidden],.work[hidden],.pageview[hidden]{display:none}
.pageview{padding:2.4rem 16px 5rem}
.pv{max-width:60rem;margin:0 auto}
.pv.narrow{max-width:38rem}
.pv h1{font-weight:500;font-size:2rem;margin:0 0 .4rem}
.pv .lede{color:var(--muted);font-size:1.1rem;margin:0 0 1.8rem;max-width:40rem}
.pv .card{border:1px solid var(--line);border-radius:6px;padding:1.2rem 1.4rem;background:var(--bg)}
.pv .card+.card{margin-top:1rem}
.pv .cat{font-family:var(--font-ui);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pv h2{font-weight:500;font-size:1.35rem;margin:.2rem 0 .5rem;text-wrap:balance}
.pv h2 a{color:var(--ink);text-decoration:none}
.pv h2 a:hover{color:var(--accent)}
.pv h2 .gk{color:var(--muted);font-size:.85em;margin-left:.3rem}
.pv p{line-height:1.55;margin:.4rem 0}
.pv .meta{font-family:var(--font-ui);font-size:.82rem;color:var(--muted)}
.pv .btn{display:inline-block;margin-top:.7rem;font-family:var(--font-ui);font-size:.88rem;background:var(--accent);color:var(--bg);text-decoration:none;padding:.5rem 1rem;border-radius:4px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:1rem}
.tgrid .card+.card{margin-top:0}
.topic ul{list-style:none;margin:.7rem 0 0;padding:0;border-top:1px solid var(--line)}
.topic li{border-bottom:1px solid var(--line)}
.topic li a{display:block;padding:.4rem 0;color:var(--ink);text-decoration:none;font-size:.95rem}
.topic li a:hover{color:var(--accent)}
.topic li b{font-family:var(--font-ui);font-size:.75rem;color:var(--accent);font-weight:600;display:inline-block;width:2.6rem}
@media (max-width:600px){.sitebar{gap:1rem;padding:.6rem 1rem}.sitebar ul{gap:1rem}}

.sitebar{position:sticky;top:0;z-index:31}
.readerbar{top:var(--siteh,3.2rem)}
@media (max-width:600px){
  .column{padding-right:2.4rem}
  .seg .num{right:-2.15rem;font-size:.6rem;width:1.9rem}
  .cite .ed{display:none}
}

/* AI summary */
.readerbar{grid-template-columns:auto 1fr auto 3rem}
.aibtn{font-family:var(--font-ui);font-size:.82rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:.3rem .8rem;margin-right:.5rem;white-space:nowrap}
.aibtn:hover{background:var(--accent);color:var(--bg)}
.aibtn[hidden]{display:none}
.panel .ai{font-size:1rem}
.panel .ai h3{font-family:var(--font-ui);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:.9rem 0 .3rem;font-weight:600}
.panel .ai h3:first-child{margin-top:0}
.panel .ai ul{margin:.2rem 0;padding-left:1.1rem}
.panel .ai li{margin:.25rem 0}
.panel .ai p{margin:.3rem 0}
.ai-note{font-size:.75rem;color:var(--muted);margin:.1rem 1.1rem .6rem}
.ai-wait{color:var(--muted);font-style:italic}
.linkbtn{color:var(--accent);text-decoration:underline;font-size:.82rem}
@media (max-width:600px){.aibtn{padding:.25rem .55rem;font-size:.75rem}}
.panel .ai p+p{margin-top:.55rem}
.panel .ai h3 + p{margin-top:0}
/* always light: white page, black text, like Sefaria */
:root{color-scheme:light;--bg:#ffffff;--ink:#000000;--chrome:#fbfbfa;--note:#333333}
html,body{background:#ffffff;color:#000000}
</style>
</head>
<body>
<nav class="sitebar" aria-label="Site">
  <a class="brand" href="texts/index.html" id="brand"><span class="mark" aria-hidden="true">Ψ</span>Sefarium</a>
  <ul>
    <li><a href="texts/index.html">Texts</a></li>
    <li><a href="plato/index.html">Plato</a></li>
    <li><a href="#topics" data-view="topics">Topics</a></li>
    <li><a href="#donate" data-view="donate">Donate</a></li>
  </ul>
</nav>
<header class="readerbar">
  <div class="nav">
    <button id="prev" aria-label="Previous Stephanus page" title="Previous page">‹</button>
    <label for="jump" style="position:absolute;left:-9999px">Go to Stephanus page</label>
    <select id="jump"></select>
    <button id="next" aria-label="Next Stephanus page" title="Next page">›</button>
  </div>
  <div class="cite"><h1 id="cite">Alcibiades I</h1><div class="ed" id="edition"></div></div>
  <button class="aibtn" id="aibtn" hidden title="Summarize this Stephanus page with Claude">✦ AI summary</button>
  <button class="abtn" id="abtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="Text display options">A</button>
  <div class="menu" id="menu" hidden role="dialog" aria-label="Text display options">
    <div class="grp" id="langgrp">
      <button data-lang="src" aria-pressed="false"><span>Greek</span><span class="dot"></span></button>
      <button data-lang="en" aria-pressed="false"><span>English</span><span class="dot"></span></button>
      <button data-lang="bi" aria-pressed="true"><span>Greek with English</span><span class="dot"></span></button>
    </div>
    <div class="row"><span>Layout</span>
      <div class="layouts">
        <button data-layout="stacked" aria-pressed="true" title="Stacked" aria-label="Stacked"><svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor"><rect y="0" width="18" height="2"/><rect y="4" width="18" height="2"/><rect y="8" width="18" height="2" opacity=".5"/><rect y="12" width="18" height="2" opacity=".5"/></svg></button>
        <button data-layout="sidebyside" aria-pressed="false" title="Side by side" aria-label="Side by side"><svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor"><rect x="0" y="0" width="8" height="2"/><rect x="0" y="4" width="8" height="2"/><rect x="0" y="8" width="8" height="2"/><rect x="10" y="0" width="8" height="2" opacity=".5"/><rect x="10" y="4" width="8" height="2" opacity=".5"/><rect x="10" y="8" width="8" height="2" opacity=".5"/></svg></button>
      </div>
    </div>
    <div class="row"><span>Font size</span><div class="size"><button id="fminus" aria-label="Smaller text">−</button><button id="fplus" aria-label="Larger text">+</button></div></div>
    <div class="row"><span>Accents &amp; breathings</span><button class="switch" role="switch" id="sw-acc" aria-checked="true" aria-label="Accents and breathings"></button></div>
    <div class="row"><span>Transliteration</span><button class="switch" role="switch" id="sw-tr" aria-checked="false" aria-label="Transliteration"></button></div>
    <div class="row sub" id="row-plain"><span>Plain spelling (no ē, ō)</span><button class="switch" role="switch" id="sw-plain" aria-checked="false" aria-label="Plain spelling"></button></div>
  </div>
</header>

<div class="work">
  <main class="reader" id="reader"><div class="column" id="column"></div></main>
  <aside class="panel" id="panel" hidden aria-label="Resources">
    <header><span>Resources</span><button id="pclose" aria-label="Close resources">✕</button></header>
    <div id="pbody"></div>
  </aside>
</div>
<main class="pageview" id="pageview" hidden></main>

<!--
  CONTENT. One segment = one speech, or one part of a long speech.
  steph: Stephanus section where the segment begins. speaker: Greek name.
  Markers: {a}..{z} in Greek = grammar note (letters restart each Stephanus page);
  {1}..{n} in English = commentary note (numbered through the dialogue); |104b| = section change inside a segment.
  g / c: the segment's own grammar and commentary notes, [lemma, text]; *...* = italic.
-->
<script type="application/json" id="content">{"work":{"title":"Alcibiades I","author":"Plato","greekTitle":"ΑΛΚΙΒΙΑΔΗΣ Α","edition":"Burnet, Oxford 1903 · new translation"},"source":{"text":"Greek text of John Burnet, Platonis Opera (Oxford, 1903), Perseus Digital Library (tlg0059.tlg013.perseus-grc2), CC BY-SA, with one line restored at 104a from the Perseus reading text. English translation, grammar notes and commentary are new.","url":"https://scaife.perseus.org/reader/urn:cts:greekLit:tlg0059.tlg013.perseus-grc2:103-107/"},"segments":[{"steph":"103a","speaker":"Σωκράτης","greek":"ὦ παῖ Κλεινίου, οἶμαί σε θαυμάζειν{a} ὅτι πρῶτος ἐραστής σου γενόμενος τῶν ἄλλων πεπαυμένων μόνος οὐκ ἀπαλλάττομαι,{b} καὶ ὅτι οἱ μὲν ἄλλοι δι᾽ ὄχλου ἐγένοντό σοι διαλεγόμενοι, ἐγὼ δὲ τοσούτων ἐτῶν{c} οὐδὲ προσεῖπον.","english":"Son of Clinias,{1} I think you are surprised that I, who was the first to become your lover,{2} am the only one who does not leave you now that the others have stopped, and that while the others made a nuisance of themselves with their talk,{3} I in all these years have not so much as spoken to you.","turn":true,"g":{"a":["οἶμαί σε θαυμάζειν","οἶμαι with accusative and infinitive, “I suppose you wonder”; θαυμάζω ὅτι, “be surprised that.”"],"b":["ἀπαλλάττομαι","middle, “take myself off, depart”; τῶν ἄλλων πεπαυμένων is a genitive absolute."],"c":["τοσούτων ἐτῶν","genitive of time within which: “in all these years.”"]},"c":{"1":["ὦ παῖ Κλεινίου","Socrates opens with the father’s name, as one addresses the heir of a great house. παῖ also means “boy”: lineage and youth at once. Clinias fell at Coronea in 447 BC, and Alcibiades grew up a ward of Pericles. The Greek form is genitive (Κλεινίας, *Kleinias*, “of Kleinias”); English spells it the Latin way, Clinias."],"2":["πρῶτος ἐραστής … μόνος","ἐραστής is the older suitor in Athenian courtship. The sentence is framed by *first* and *only*: first in time, alone in constancy. The others loved a youth’s bloom and have quit; Socrates will argue (131c–e) that he alone loves the soul, and so remains."],"3":["δι᾽ ὄχλου ἐγένοντο … διαλεγόμενοι","ὄχλος is a throng; the idiom means “to pester.” Yet διαλέγεσθαι is the verb behind “dialectic”: the suitors talked, but only as noise. The silent Socrates is about to begin the real conversation."]}},{"steph":"103a","speaker":"Σωκράτης","greek":"τούτου δὲ τὸ αἴτιον γέγονεν οὐκ ἀνθρώπειον, ἀλλά τι δαιμόνιον ἐναντίωμα, οὗ σὺ τὴν δύναμιν καὶ ὕστερον πεύσῃ.{d}","english":"The cause of this was nothing human, but a certain divine opposition,{4} whose power you will learn of later.","turn":false,"g":{"d":["πεύσῃ","2nd sing. future of πυνθάνομαι, “you will learn (by inquiry).”"]},"c":{"4":["δαιμόνιόν τι ἐναντίωμα","Socrates’ divine sign, which (*Apology* 31c–d) only ever holds him back and never urges him on. ἐναντίωμα, “a thing set against,” fits exactly: a check, not a command."]}},{"steph":"103a","speaker":"Σωκράτης","greek":"νῦν δὲ |103b| ἐπειδὴ οὐκέτι ἐναντιοῦται, οὕτω προσελήλυθα· εὔελπις δ᾽ εἰμὶ καὶ τὸ λοιπὸν μὴ ἐναντιώσεσθαι{e} αὐτό.","english":"But now, since it no longer opposes me, I have come to you;{5} and I am in good hope{6} that it will not oppose me in the future either.","turn":false,"g":{"e":["μὴ ἐναντιώσεσθαι","future infinitive after a word of hoping (εὔελπις εἰμί), negated with μή."]},"c":{"5":["οὕτω προσελήλυθα","οὕτω is resumptive, “accordingly.” The perfect marks arrival with lasting effect: I have come, and here I am. οὐκέτι ἐναντιοῦται answers the noun ἐναντίωμα: the obstacle has lifted."],"6":["εὔελπις","A sober word, heavy with irony for readers who know what followed: the scandals of 415, defection to Sparta, exile. History did not keep Socrates’ hope."]}},{"steph":"103b","speaker":"Σωκράτης","greek":"σχεδὸν οὖν κατανενόηκα{f} ἐν τούτῳ τῷ χρόνῳ σκοπούμενος ὡς πρὸς τοὺς ἐραστὰς ἔσχες· πολλῶν γὰρ γενομένων καὶ μεγαλοφρόνων οὐδεὶς ὃς οὐχ{g} ὑπερβληθεὶς τῷ φρονήματι ὑπὸ σοῦ πέφευγεν.","english":"Now in all this time, watching closely, I have pretty well observed how you have behaved toward your lovers: for though there were many of them, and high-minded ones, there is not one who has not been outdone by you in pride{7} and fled.","turn":false,"g":{"f":["κατανενόηκα","perfect of κατανοέω, “I have observed thoroughly”; ὡς πρὸς τοὺς ἐραστὰς ἔσχες, “how you were disposed toward your lovers.”"],"g":["οὐδεὶς ὃς οὐχ","idiom for οὐδείς ἐστιν ὅστις οὐ, “there is no one who has not.”"]},"c":{"7":["μεγαλοφρόνων … τῷ φρονήματι","A play on the root φρον-: the “great-minded” suitors were overtopped by the boy’s φρόνημα, which may be noble spirit or plain arrogance. That ambiguity is the dialogue’s subject (104a)."]}},{"steph":"104a","speaker":"Σωκράτης","greek":"τὸν δὲ λόγον, ᾧ ὑπερπεφρόνηκας{a}, ἐθέλω διελθεῖν. οὐδενὸς φῂς ἀνθρώπων ἐνδεὴς εἶναι εἰς οὐδέν· τὰ γὰρ ὑπάρχοντά σοι μεγάλα εἶναι, ὥστε μηδενὸς δεῖσθαι, ἀπὸ τοῦ σώματος ἀρξάμενα τελευτῶντα εἰς τὴν ψυχήν.","english":"But the argument by which you have looked down on them I want to go through. You say you are in need of no human being for anything; for the advantages you have are so great, you think, that you need nothing, beginning with the body and ending with the soul{8}.","g":{"a":["ὑπερπεφρόνηκας","perfect of ὑπερφρονέω, “think oneself above, look down on”; ὑπερ- (over) + φρον- (mind), as in *hyper-* and *phrenetic*."]},"c":{"8":["ἀπὸ τοῦ σώματος … εἰς τὴν ψυχήν","Socrates lists Alcibiades’ goods from body to soul, the same ladder the dialogue will climb back down at its end (130a–c), where the self turns out to be the soul alone. *Psyche* gives English *psychology*."]},"turn":true},{"steph":"104a","speaker":"Σωκράτης","greek":"οἴει γὰρ δὴ εἶναι πρῶτον μὲν κάλλιστός τε καὶ μέγιστος{b}—καὶ τοῦτο μὲν δὴ παντὶ δῆλον ἰδεῖν ὅτι οὐ ψεύδῃ—ἔπειτα νεανικωτάτου γένους ἐν τῇ σεαυτοῦ πόλει, οὔσῃ μεγίστῃ τῶν Ἑλληνίδων, καὶ |104b| ἐνταῦθα πρὸς πατρός τέ σοι φίλους καὶ συγγενεῖς πλείστους εἶναι καὶ ἀρίστους, οἳ εἴ τι δέοι ὑπηρετοῖεν ἄν σοι, τούτων δὲ τοὺς πρὸς μητρὸς οὐδὲν χείρους οὐδ᾽ ἐλάττους.","english":"For you think, first of all, that you are the most beautiful and the tallest of men (and anyone can see that you are not wrong about this); next, that you are of the most vigorous family in your own city, which is the greatest of the Greek cities; that on your father’s side you have very many friends and kinsmen there, and the best, who would serve you if there were any need; and that those on your mother’s side are no worse and no fewer.","g":{"b":["κάλλιστός τε καὶ μέγιστος","nominative superlatives with εἶναι because the subject of the infinitive is the same as that of οἴει. κάλλος, beauty, gives *calli-graphy*; μέγας, *mega-*."]},"c":{},"turn":false},{"steph":"104b","speaker":"Σωκράτης","greek":"συμπάντων δὲ ὧν εἶπον μείζω οἴει σοι δύναμιν ὑπάρχειν Περικλέα τὸν Ξανθίππου, ὃν ὁ πατὴρ ἐπίτροπον κατέλιπε σοί τε καὶ τῷ ἀδελφῷ· ὃς οὐ μόνον ἐν τῇδε τῇ πόλει δύναται πράττειν ὅτι ἂν βούληται, ἀλλ᾽ ἐν πάσῃ τῇ Ἑλλάδι καὶ τῶν βαρβάρων ἐν πολλοῖς καὶ μεγάλοις γένεσιν.","english":"And greater than all of these together, you think, is the power you have in Pericles son of Xanthippus{9}, whom your father left as guardian to you and your brother; a man who can do whatever he wants not only in this city but in all of Greece, and among many great nations of the barbarians.","g":{},"c":{"9":["Περικλέα τὸν Ξανθίππου","Pericles, leading statesman of Athens, became guardian (ἐπίτροπος) of Alcibiades and his brother Clinias after their father fell at Coronea in 447 BC. The dialogue is set c. 432, just before the Peloponnesian War."]},"turn":false},{"steph":"104b","speaker":"Σωκράτης","greek":"προσθήσω δὲ καὶ ὅτι τῶν |104c| πλουσίων· δοκεῖς δέ μοι ἐπὶ τούτῳ ἥκιστα μέγα φρονεῖν. κατὰ πάντα δὴ ταῦτα σύ τε μεγαλαυχούμενος{c} κεκράτηκας τῶν ἐραστῶν ἐκεῖνοί τε ὑποδεέστεροι ὄντες ἐκρατήθησαν, καί σε ταῦτ᾽ οὐ λέληθεν· ὅθεν δὴ εὖ οἶδα ὅτι θαυμάζεις τί διανοούμενός ποτε οὐκ ἀπαλλάττομαι τοῦ ἔρωτος, καὶ ἥντιν᾽ ἔχων ἐλπίδα ὑπομένω τῶν ἄλλων πεφευγότων.","english":"I will add that you are one of the rich, though on this score you seem to me least proud. Because of all these things you have boasted yourself into mastery over your lovers, and they, being your inferiors, have been mastered; and this has not escaped you. That is why I know well you are wondering what I can have in mind that I do not give up my love, and with what hope I stay on when the others have fled.","g":{"c":["μεγαλαυχούμενος","“boasting greatly,” from μέγα + αὐχέω (boast)."]},"c":{},"turn":false},{"steph":"104c","speaker":"Ἀλκιβιάδης","greek":"καὶ ἴσως γε, ὦ Σώκρατες, οὐκ οἶσθ᾽ ὅτι σμικρόν |104d| με ἔφθης. ἐγὼ γάρ τοι ἐν νῷ εἶχον πρότερός σοι προσελθὼν αὐτὰ ταῦτ᾽ ἐρέσθαι, τί ποτε βούλει καὶ εἰς τίνα ἐλπίδα βλέπων ἐνοχλεῖς με, ἀεὶ ὅπου ἂν ὦ ἐπιμελέστατα παρών· τῷ ὄντι γὰρ θαυμάζω ὅτι ποτ᾽ ἐστὶ τὸ σὸν πρᾶγμα, καὶ ἥδιστ᾽ ἂν πυθοίμην.","english":"And perhaps, Socrates, you do not know that you have only just beaten me to it. For I had it in mind to come to you first and ask you this very thing: what you want, and what hope you have in view when you pester me, always turning up so diligently wherever I am. For truly I wonder what your business is, and I would be very glad to learn.","g":{},"c":{},"turn":true},{"steph":"104d","speaker":"Σωκράτης","greek":"ἀκούσῃ μὲν ἄρα μου, ὡς τὸ εἰκός, προθύμως, εἴπερ, ὡς φῄς, ἐπιθυμεῖς εἰδέναι τί διανοοῦμαι, καὶ ὡς ἀκουσομένῳ καὶ περιμενοῦντι λέγω.","english":"Then you will listen to me eagerly, as is likely, if, as you say, you desire to know what I have in mind; and I speak to you as to one who will listen and wait.","g":{},"c":{},"turn":true},{"steph":"104d","speaker":"Ἀλκιβιάδης","greek":"πάνυ μὲν οὖν· ἀλλὰ λέγε.","english":"Certainly; just speak.","g":{},"c":{},"turn":true},{"steph":"104e","speaker":"Σωκράτης","greek":"ὅρα δή· οὐ γάρ τοι εἴη ἂν θαυμαστὸν εἰ, ὥσπερ μόγις ἠρξάμην, οὕτω μόγις καὶ παυσαίμην.","english":"Watch out, then; for it would be no wonder if, as I began with difficulty, so with difficulty I should stop.","g":{},"c":{},"turn":true},{"steph":"104e","speaker":"Ἀλκιβιάδης","greek":"ὠγαθὲ λέγε· ἀκούσομαι γάρ.","english":"My good man, speak; I will listen.","g":{},"c":{},"turn":true},{"steph":"104e","speaker":"Σωκράτης","greek":"λεκτέον ἂν εἴη{d}. χαλεπὸν μὲν οὖν πρὸς ἄνδρα οὐχ ἥττονα ἐραστῶν προσφέρεσθαι ἐραστῇ, ὅμως δὲ τολμητέον φράσαι τὴν ἐμὴν διάνοιαν.","english":"Speak I must. It is hard, to be sure, for a lover to approach a man who does not yield to lovers; still, I must dare to tell you what I think.","g":{"d":["λεκτέον ἂν εἴη","verbal adjective in -τέος expressing necessity, “it must be said”; likewise τολμητέον below."]},"c":{},"turn":true},{"steph":"104e","speaker":"Σωκράτης","greek":"ἐγὼ γάρ, ὦ Ἀλκιβιάδη, εἰ μέν σε ἑώρων ἃ νυνδὴ διῆλθον ἀγαπῶντα καὶ οἰόμενον δεῖν ἐν τούτοις καταβιῶναι, πάλαι ἂν ἀπηλλάγμην τοῦ ἔρωτος, ὥς |105a| γε δὴ ἐμαυτὸν πείθω· νῦν δ᾽ ἕτερ᾽ αὖ κατηγορήσω διανοήματα σὰ πρὸς αὐτὸν σέ, ᾧ καὶ γνώσῃ ὅτι προσέχων γέ σοι τὸν νοῦν διατετέλεκα.","english":"For, Alcibiades, if I saw you content with the things I have just gone through and thinking you should live out your life among them, I would long ago have given up my love, so at least I persuade myself. But now I will charge you, to your face, with quite other thoughts of yours, and from this you will know that I have kept my mind on you all this time.","g":{},"c":{},"turn":false},{"steph":"105a","speaker":"Σωκράτης","greek":"δοκεῖς γάρ μοι, εἴ τίς σοι εἴποι θεῶν· ὦ Ἀλκιβιάδη, πότερον βούλει ζῆν ἔχων ἃ νῦν ἔχεις, ἢ αὐτίκα τεθνάναι εἰ μή σοι ἐξέσται μείζω κτήσασθαι; δοκεῖς ἄν μοι ἑλέσθαι τεθνάναι· ἀλλὰ νῦν ἐπὶ τίνι δή ποτε ἐλπίδι ζῇς, ἐγὼ φράσω.","english":"For I think that if one of the gods said to you, ‘Alcibiades, would you rather live with what you have now, or die at once if you may not acquire anything greater?’, I think you would choose to die. But now I will tell you on what hope you are living.","g":{},"c":{},"turn":false},{"steph":"105a","speaker":"Σωκράτης","greek":"ἡγῇ, ἐὰν θᾶττον εἰς τὸν Ἀθηναίων |105b| δῆμον παρέλθῃς—τοῦτο δ᾽ ἔσεσθαι μάλα ὀλίγων ἡμερῶν— παρελθὼν οὖν ἐνδείξεσθαι Ἀθηναίοις ὅτι ἄξιος εἶ τιμᾶσθαι ὡς οὔτε Περικλῆς οὔτ᾽ ἄλλος οὐδεὶς τῶν πώποτε γενομένων, καὶ τοῦτ᾽ ἐνδειξάμενος μέγιστον δυνήσεσθαι ἐν τῇ πόλει, ἐὰν δ᾽ ἐνθάδε μέγιστος ᾖς, καὶ ἐν τοῖς ἄλλοις Ἕλλησι, καὶ οὐ μόνον ἐν Ἕλλησιν, ἀλλὰ καὶ ἐν τοῖς βαρβάροις, ὅσοι ἐν τῇ αὐτῇ ἡμῖν οἰκοῦσιν ἠπείρῳ.","english":"You believe that if you come before the Athenian assembly soon (and you expect this within a very few days), you will show the Athenians when you come forward that you deserve to be honored as neither Pericles nor anyone else who ever lived; and that having shown this you will have the greatest power in the city; and if you are greatest here, then among the other Greeks too; and not only among the Greeks, but among the barbarians who live on the same continent as we do.","g":{},"c":{},"turn":false},{"steph":"105b","speaker":"Σωκράτης","greek":"καὶ εἰ αὖ σοι εἴποι ὁ αὐτὸς οὗτος θεὸς ὅτι αὐτοῦ σε δεῖ δυναστεύειν ἐν τῇ Εὐρώπῃ, |105c| διαβῆναι δὲ εἰς τὴν Ἀσίαν οὐκ ἐξέσται σοι οὐδὲ ἐπιθέσθαι τοῖς ἐκεῖ πράγμασιν, οὐκ ἂν αὖ μοι δοκεῖς ἐθέλειν οὐδ᾽ ἐπὶ τούτοις μόνοις ζῆν, εἰ μὴ ἐμπλήσεις τοῦ σοῦ ὀνόματος καὶ τῆς σῆς δυνάμεως πάντας ὡς ἔπος εἰπεῖν ἀνθρώπους· καὶ οἶμαί σε πλὴν Κύρου καὶ Ξέρξου ἡγεῖσθαι οὐδένα ἄξιον λόγου γεγονέναι.","english":"And if that same god told you instead that you must rule here in Europe, but that you would not be allowed to cross into Asia or to meddle in affairs there, I think you would not be willing to live on these terms alone either, unless you could fill, so to speak, all mankind with your name and your power. And I think that except for Cyrus and Xerxes{10} you believe no one has ever lived who is worth speaking of.","g":{},"c":{"10":["πλὴν Κύρου καὶ Ξέρξου","The founder of the Persian empire and the king who invaded Greece in 480. Socrates’ point is that Alcibiades measures himself only against world-conquerors; the comparison with Persian royalty returns at length at 121a–124a."]},"turn":false},{"steph":"105c","speaker":"Σωκράτης","greek":"ὅτι μὲν οὖν ἔχεις ταύτην τὴν ἐλπίδα, εὖ οἶδα καὶ οὐκ εἰκάζω. ἴσως ἂν οὖν εἴποις, ἅτε εἰδὼς ὅτι ἀληθῆ λέγω, τί δὴ οὖν, ὦ Σώκρατες, τοῦτ᾽ ἐστί σοι πρὸς |105d| λόγον; [ὃν ἔφησθα ἐρεῖν, διὸ ἐμοῦ οὐκ ἀπαλλάττῃ;] ἐγὼ δὲ σοί γε ἐρῶ, ὦ φίλε παῖ Κλεινίου καὶ Δεινομάχης.","english":"That you have this hope, then, I know well; I am not guessing. Now perhaps you would say, knowing that I speak the truth, ‘What then, Socrates, has this to do with your argument, [which you said you would tell me, about why you do not let me go?]’ And I will tell you, dear son of Clinias and Deinomache{11}.","g":{},"c":{"11":["Κλεινίου καὶ Δεινομάχης","Naming the mother as well as the father is unusual and affectionate. Deinomache was of the Alcmaeonid family, the clan of Pericles. Burnet brackets the preceding clause as a later insertion."]},"turn":false},{"steph":"105d","speaker":"Σωκράτης","greek":"τούτων γάρ σοι ἁπάντων τῶν διανοημάτων τέλος ἐπιτεθῆναι{a} ἄνευ ἐμοῦ ἀδύνατον· τοσαύτην ἐγὼ δύναμιν οἶμαι ἔχειν εἰς τὰ σὰ πράγματα καὶ εἰς σέ, διὸ δὴ καὶ πάλαι οἴομαί με τὸν θεὸν οὐκ ἐᾶν διαλέγεσθαί σοι, ὃν ἐγὼ περιέμενον ὁπηνίκα ἐάσει.","english":"For it is impossible for all these designs of yours to be brought to completion without me; so great is the power I think I have over your affairs and over you. That is also why, I believe, the god long would not let me talk with you, and I was waiting until he would allow it.","g":{"a":["ἐπιτεθῆναι","aorist passive infinitive of ἐπιτίθημι; τέλος ἐπιτίθεσθαι, “to have an end put upon,” i.e. be completed. τέλος gives *teleology*."]},"c":{},"turn":false},{"steph":"105d","speaker":"Σωκράτης","greek":"ὥσπερ γὰρ σὺ ἐλπίδας ἔχεις ἐν τῇ πόλει ἐνδείξασθαι ὅτι |105e| αὐτῇ παντὸς ἄξιος εἶ, ἐνδειξάμενος δὲ [ὅτι] οὐδὲν ὅτι οὐ παραυτίκα δυνήσεσθαι, οὕτω κἀγὼ παρὰ σοὶ ἐλπίζω μέγιστον δυνήσεσθαι ἐνδειξάμενος ὅτι παντὸς ἄξιός εἰμί σοι καὶ οὔτε ἐπίτροπος οὔτε συγγενὴς οὔτ᾽ ἄλλος οὐδεὶς ἱκανὸς παραδοῦναι τὴν δύναμιν ἧς ἐπιθυμεῖς πλὴν ἐμοῦ, μετὰ τοῦ θεοῦ μέντοι.","english":"For just as you hope to show the city that you are worth everything to it, and having shown it to be able to do anything at once, so I too hope to have the greatest power with you, once I have shown that I am worth everything to you, and that neither guardian nor kinsman nor anyone else is able to hand over to you the power you desire, except me, with the god’s help, that is.","g":{},"c":{},"turn":false},{"steph":"105e","speaker":"Σωκράτης","greek":"νεωτέρῳ μὲν οὖν ὄντι σοι καὶ πρὶν τοσαύτης ἐλπίδος γέμειν, ὡς ἐμοὶ δοκεῖ, οὐκ εἴα ὁ θεὸς διαλέγεσθαι, ἵνα μὴ μάτην |106a| διαλεγοίμην. νῦν δ᾽ ἐφῆκεν· νῦν γὰρ ἄν μου ἀκούσαις.","english":"While you were younger, then, and before you were full of so great a hope, the god, as it seems to me, would not let me talk with you, so that I should not talk in vain. But now he has let me go; for now you would listen to me.","g":{},"c":{},"turn":false},{"steph":"106a","speaker":"Ἀλκιβιάδης","greek":"πολύ γέ μοι, ὦ Σώκρατες, νῦν ἀτοπώτερος αὖ φαίνῃ, ἐπειδὴ ἤρξω λέγειν, ἢ ὅτε σιγῶν εἵπου· καίτοι σφόδρα γε ἦσθ᾽ ἰδεῖν καὶ τότε τοιοῦτος. εἰ μὲν οὖν ἐγὼ ταῦτα διανοοῦμαι ἢ μή, ὡς ἔοικε, διέγνωκας, καὶ ἐὰν μὴ φῶ, οὐδέν μοι ἔσται πλέον πρὸς τὸ πείθειν σε. εἶεν· εἰ δὲ δὴ ὅτι μάλιστα ταῦτα διανενόημαι, πῶς διὰ σοῦ μοι ἔσται καὶ ἄνευ σοῦ οὐκ ἂν γένοιτο; ἔχεις λέγειν;","english":"You seem to me much stranger now{12}, Socrates, since you began to speak, than when you followed me about in silence; and yet you were strange enough to look at even then. Well, whether I have these thoughts or not, you have apparently decided, and if I say no, it will do me no good in persuading you. So be it. But supposing I really have these thoughts, how will they be achieved through you, and not come about without you? Can you say?","g":{},"c":{"12":["ἀτοπώτερος","ἄτοπος, literally “out of place,” is the word most often used of Socrates in Plato: unclassifiable, uncanny. English *utopia* is built from the same τόπος, place."]},"turn":true},{"steph":"106b","speaker":"Σωκράτης","greek":"ἆρ᾽ ἐρωτᾷς εἴ τιν᾽ ἔχω εἰπεῖν λόγον μακρόν, οἵους δὴ ἀκούειν εἴθισαι; οὐ γάρ ἐστι τοιοῦτον τὸ ἐμόν· ἀλλ᾽ ἐνδείξασθαι μέν σοι, ὡς ἐγᾦμαι{a}, οἷός τ᾽ ἂν εἴην ὅτι ταῦτα οὕτως ἔχει, ἐὰν ἓν μόνον μοι ἐθελήσῃς βραχὺ ὑπηρετῆσαι.","english":"Are you asking whether I can make you some long speech, of the kind you are used to hearing? That is not my way. But I could, I think, show you that this is so, if only you are willing to do me one small service.","g":{"a":["ἐγᾦμαι","crasis of ἐγὼ οἶμαι, “I think.”"]},"c":{},"turn":true},{"steph":"106b","speaker":"Ἀλκιβιάδης","greek":"ἀλλ᾽ εἴ γε δὴ μὴ χαλεπόν τι λέγεις τὸ ὑπηρέτημα, ἐθέλω.","english":"Well, if the service you mean is nothing hard, I am willing.","g":{},"c":{},"turn":true},{"steph":"106b","speaker":"Σωκράτης","greek":"ἦ χαλεπὸν δοκεῖ τὸ ἀποκρίνασθαι τὰ ἐρωτώμενα;","english":"Does it seem hard to answer questions?","g":{},"c":{},"turn":true},{"steph":"106b","speaker":"Ἀλκιβιάδης","greek":"οὐ χαλεπόν.","english":"Not hard.","g":{},"c":{},"turn":true},{"steph":"106b","speaker":"Σωκράτης","greek":"ἀποκρίνου δή.","english":"Then answer.","g":{},"c":{},"turn":true},{"steph":"106b","speaker":"Ἀλκιβιάδης","greek":"Ἐρώτα.","english":"Ask.","g":{},"c":{},"turn":true},{"steph":"106b","speaker":"Σωκράτης","greek":"οὐκοῦν ὡς διανοουμένου σου ταῦτα ἐρωτῶ, ἅ φημί σε |106c| διανοεῖσθαι;","english":"Then may I ask you on the supposition that you have the thoughts I say you have?","g":{},"c":{},"turn":true},{"steph":"106c","speaker":"Ἀλκιβιάδης","greek":"ἔστω, εἰ βούλει, οὕτως, ἵνα καὶ εἰδῶ ὅτι καὶ ἐρεῖς.","english":"Let it be so, if you like, so that I may know what you will say.","g":{},"c":{},"turn":true},{"steph":"106c","speaker":"Σωκράτης","greek":"φέρε δή· διανοῇ γάρ, ὡς ἐγώ φημι, παριέναι συμβουλεύσων Ἀθηναίοις ἐντὸς οὐ πολλοῦ χρόνου· εἰ οὖν μέλλοντός σου ἰέναι ἐπὶ τὸ βῆμα λαβόμενος ἐροίμην· ὦ Ἀλκιβιάδη, ἐπειδὴ περὶ τίνος Ἀθηναῖοι διανοοῦνται βουλεύεσθαι, ἀνίστασαι συμβουλεύσων; ἆρ᾽ ἐπειδὴ περὶ ὧν σὺ ἐπίστασαι βέλτιον ἢ οὗτοι; τί ἂν ἀποκρίναιο;","english":"Come then. You intend, as I say, to come forward to advise the Athenians before long. Suppose, then, that as you were about to step onto the speaker’s platform{13}, I took hold of you and asked: ‘Alcibiades, since the Athenians are planning to deliberate about what, are you rising to advise them? Is it about things you know better than they do?’ What would you answer?","g":{},"c":{"13":["ἐπὶ τὸ βῆμα","The βῆμα was the stone platform on the Pnyx from which speakers addressed the assembly (ἐκκλησία). From βῆμα comes the *bema* of synagogues and churches."]},"turn":true},{"steph":"106d","speaker":"Ἀλκιβιάδης","greek":"εἴποιμ᾽ ἂν δήπου, περὶ ὧν οἶδα βέλτιον ἢ οὗτοι.","english":"I would say, I suppose, about things I know better than they.","g":{},"c":{},"turn":true},{"steph":"106d","speaker":"Σωκράτης","greek":"περὶ ὧν ἄρ᾽ εἰδὼς τυγχάνεις, ἀγαθὸς σύμβουλος εἶ.","english":"Then on the things you happen to know about, you are a good adviser.","g":{},"c":{},"turn":true},{"steph":"106d","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"106d","speaker":"Σωκράτης","greek":"οὐκοῦν ταῦτα μόνον οἶσθα, ἃ παρ᾽ ἄλλων ἔμαθες ἢ αὐτὸς ἐξηῦρες;","english":"And do you know only what you have learned from others or found out for yourself?","g":{},"c":{},"turn":true},{"steph":"106d","speaker":"Ἀλκιβιάδης","greek":"ποῖα γὰρ ἄλλα;","english":"What else could I know?","g":{},"c":{},"turn":true},{"steph":"106d","speaker":"Σωκράτης","greek":"ἔστιν οὖν ὅπως ἄν ποτε ἔμαθές τι ἢ ἐξηῦρες μήτε μανθάνειν ἐθέλων μήτ᾽ αὐτὸς ζητεῖν;","english":"Is there any way you could ever have learned or found out anything if you were willing neither to learn it nor to seek it yourself?","g":{},"c":{},"turn":true},{"steph":"106d","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔστιν.","english":"There is not.","g":{},"c":{},"turn":true},{"steph":"106d","speaker":"Σωκράτης","greek":"τί δέ; ἠθέλησας ἂν ζητῆσαι ἢ μαθεῖν ἃ ἐπίστασθαι ᾤου;","english":"Well then: would you have been willing to seek or learn what you thought you knew?","g":{},"c":{},"turn":true},{"steph":"106d","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"106e","speaker":"Σωκράτης","greek":"ἃ ἄρα νῦν τυγχάνεις ἐπιστάμενος, ἦν χρόνος ὅτε οὐχ ἡγοῦ εἰδέναι;","english":"Then for the things you now happen to know, there was a time when you did not think you knew them?","g":{},"c":{},"turn":true},{"steph":"106e","speaker":"Ἀλκιβιάδης","greek":"ἀνάγκη.","english":"Necessarily.","g":{},"c":{},"turn":true},{"steph":"106e","speaker":"Σωκράτης","greek":"ἀλλὰ μὴν ἅ γε μεμάθηκας σχεδόν τι καὶ ἐγὼ οἶδα· εἰ δέ τι ἐμὲ λέληθεν, εἰπέ. ἔμαθες γὰρ δὴ σύ γε κατὰ μνήμην τὴν ἐμὴν γράμματα καὶ κιθαρίζειν καὶ παλαίειν· οὐ γὰρ δὴ αὐλεῖν γε ἤθελες μαθεῖν. ταῦτ᾽ ἐστὶν ἃ σὺ ἐπίστασαι, εἰ μή πού τι μανθάνων ἐμὲ λέληθας· οἶμαι δέ γε, οὔτε νύκτωρ οὔτε μεθ᾽ ἡμέραν ἐξιὼν ἔνδοθεν.","english":"But what you have learned, I know pretty well too; if something has escaped me, tell me. You learned, as I remember, letters, and the lyre, and wrestling{14}; the flute you were not willing to learn. These are the things you know, unless perhaps you have been learning something without my noticing; and I think you have not, since you never go out of the house, by night or by day, without my seeing.","g":{},"c":{"14":["γράμματα καὶ κιθαρίζειν καὶ παλαίειν","The standard Athenian education: letters, music and gymnastics. Plutarch (*Alcibiades* 2) reports that Alcibiades refused the flute because it distorted the face, and so made it unfashionable among well-born boys."]},"turn":true},{"steph":"106e","speaker":"Ἀλκιβιάδης","greek":"ἀλλ᾽ οὐ πεφοίτηκα εἰς ἄλλων ἢ τούτων.","english":"No, I have not gone to any teachers but these.","g":{},"c":{},"turn":true},{"steph":"107a","speaker":"Σωκράτης","greek":"πότερον οὖν, ὅταν περὶ γραμμάτων Ἀθηναῖοι βουλεύωνται, πῶς ἂν ὀρθῶς γράφοιεν, τότε ἀναστήσῃ{a} αὐτοῖς συμβουλεύσων;","english":"Well then, when the Athenians are deliberating about letters, how they should write correctly, will you stand up then to advise them?","g":{"a":["ἀναστήσῃ","2nd sing. future middle of ἀνίστημι, “you will stand up”; the root στα- (stand) as in *static*, *ecstasy*."]},"c":{},"turn":true},{"steph":"107a","speaker":"Ἀλκιβιάδης","greek":"μὰ Δί᾽ οὐκ ἔγωγε.","english":"By Zeus, not I.","g":{},"c":{},"turn":true},{"steph":"107a","speaker":"Σωκράτης","greek":"ἀλλ᾽ ὅταν περὶ κρουμάτων ἐν λύρᾳ;","english":"Or when they deliberate about the notes of the lyre?","g":{},"c":{},"turn":true},{"steph":"107a","speaker":"Ἀλκιβιάδης","greek":"οὐδαμῶς.","english":"Not at all.","g":{},"c":{},"turn":true},{"steph":"107a","speaker":"Σωκράτης","greek":"οὐδὲ μὴν οὐδὲ περὶ παλαισμάτων γε εἰώθασι βουλεύεσθαι ἐν τῇ ἐκκλησίᾳ.","english":"Nor are they in the habit of deliberating about wrestling holds in the assembly.","g":{},"c":{},"turn":true},{"steph":"107a","speaker":"Ἀλκιβιάδης","greek":"οὐ μέντοι.","english":"No indeed.","g":{},"c":{},"turn":true},{"steph":"107a","speaker":"Σωκράτης","greek":"ὅταν οὖν περὶ τίνος βουλεύωνται; οὐ γάρ που ὅταν γε περὶ οἰκοδομίας.","english":"When, then, will they deliberate? Surely not when it is about building.","g":{},"c":{},"turn":true},{"steph":"107a","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"107a","speaker":"Σωκράτης","greek":"οἰκοδόμος γὰρ ταῦτά γε σοῦ βέλτιον συμβουλεύσει.","english":"For a builder will give better advice on that than you.","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Σωκράτης","greek":"οὐδὲ μὴν ὅταν περὶ μαντικῆς βουλεύωνται;","english":"Nor when they deliberate about divination?","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Ἀλκιβιάδης","greek":"οὔ.","english":"No.","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Σωκράτης","greek":"μάντις γὰρ αὖ ταῦτα ἄμεινον ἢ σύ.","english":"For a seer, again, will do this better than you.","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Σωκράτης","greek":"ἐάν τέ γε σμικρὸς ἢ μέγας ᾖ, ἐάν τε καλὸς ἢ αἰσχρός, ἔτι τε γενναῖος ἢ ἀγεννής.","english":"Whether he is short or tall, handsome or ugly, and further whether well-born or low-born.","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Σωκράτης","greek":"εἰδότος γὰρ οἶμαι περὶ ἑκάστου ἡ συμβουλή, καὶ οὐ πλουτοῦντος.","english":"For advice on each subject belongs, I think, to the one who knows, and not to the one who is rich.","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"107b","speaker":"Σωκράτης","greek":"ἀλλ᾽ ἐάντε πένης ἐάντε πλούσιος ᾖ ὁ παραινῶν, οὐδὲν διοίσει Ἀθηναίοις ὅταν περὶ τῶν ἐν τῇ πόλει βουλεύωνται, |107c| πῶς ἂν ὑγιαίνοιεν, ἀλλὰ ζητήσουσιν ἰατρὸν εἶναι τὸν σύμβουλον.","english":"But whether the one who advises them is poor or rich will make no difference to the Athenians when they deliberate about the health of those in the city; they will look for the adviser to be a doctor.","g":{},"c":{},"turn":true},{"steph":"107c","speaker":"Ἀλκιβιάδης","greek":"εἰκότως γε.","english":"Naturally.","g":{},"c":{},"turn":true},{"steph":"107c","speaker":"Σωκράτης","greek":"ὅταν οὖν περὶ τίνος σκοπῶνται, τότε σὺ ἀνιστάμενος ὡς συμβουλεύσων ὀρθῶς ἀναστήσῃ;","english":"Then when they are considering what, will you be right to stand up, rising as an adviser?","g":{},"c":{},"turn":true},{"steph":"107c","speaker":"Ἀλκιβιάδης","greek":"ὅταν περὶ τῶν ἑαυτῶν πραγμάτων, ὦ Σώκρατες.","english":"When it is about their own affairs, Socrates.","g":{},"c":{},"turn":true},{"steph":"107c","speaker":"Σωκράτης","greek":"τῶν περὶ ναυπηγίας λέγεις, ὁποίας τινὰς χρὴ αὐτοὺς τὰς ναῦς ναυπηγεῖσθαι{b};","english":"You mean about shipbuilding, what kind of ships they ought to have built?","g":{"b":["ναυπηγεῖσθαι","middle, “have ships built” for oneself; ναῦς (ship) + πήγνυμι (fix together). ναῦς gives *nautical*, *naval*."]},"c":{},"turn":true},{"steph":"107c","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἔγωγε, ὦ Σώκρατες.","english":"No, not I, Socrates.","g":{},"c":{},"turn":true},{"steph":"107c","speaker":"Σωκράτης","greek":"ναυπηγεῖν γὰρ οἶμαι οὐκ ἐπίστασαι. τοῦτ᾽ αἴτιον ἢ ἄλλο τι;","english":"Because you do not know how to build ships, I suppose. Is that the reason, or something else?","g":{},"c":{},"turn":true},{"steph":"107c","speaker":"Ἀλκιβιάδης","greek":"οὔκ, ἀλλὰ τοῦτο.","english":"No, that is the reason.","g":{},"c":{},"turn":true},{"steph":"107d","speaker":"Σωκράτης","greek":"ἀλλὰ περὶ ποίων τῶν ἑαυτῶν λέγεις πραγμάτων ὅταν βουλεύωνται;","english":"Then about which of their own affairs do you mean, when they deliberate?","g":{},"c":{},"turn":true},{"steph":"107d","speaker":"Ἀλκιβιάδης","greek":"ὅταν περὶ πολέμου, ὦ Σώκρατες, ἢ περὶ εἰρήνης ἢ ἄλλου του τῶν τῆς πόλεως πραγμάτων.","english":"When it is about war, Socrates, or about peace, or some other of the city’s affairs.","g":{},"c":{},"turn":true},{"steph":"107d","speaker":"Σωκράτης","greek":"ἆρα λέγεις ὅταν βουλεύωνται πρὸς τίνας χρὴ εἰρήνην ποιεῖσθαι καὶ τίσιν πολεμεῖν καὶ τίνα τρόπον;","english":"Do you mean when they deliberate with whom they should make peace, and on whom they should make war, and in what way?","g":{},"c":{},"turn":true},{"steph":"107d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"107d","speaker":"Σωκράτης","greek":"χρὴ δ᾽ οὐχ οἷς βέλτιον;","english":"And they should make it on those whom it is better to?","g":{},"c":{},"turn":true},{"steph":"107d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"107e","speaker":"Σωκράτης","greek":"καὶ τόθ᾽ ὁπότε βέλτιον;","english":"And at the time when it is better?","g":{},"c":{},"turn":true},{"steph":"107e","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"107e","speaker":"Σωκράτης","greek":"καὶ τοσοῦτον χρόνον ὅσον ἄμεινον;","english":"And for as long as is better?","g":{},"c":{},"turn":true},{"steph":"107e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"107e","speaker":"Σωκράτης","greek":"εἰ οὖν βουλεύοιντο Ἀθηναῖοι τίσιν χρὴ προσπαλαίειν καὶ τίσιν ἀκροχειρίζεσθαι{c} καὶ τίνα τρόπον, σὺ ἄμεινον ἂν συμβουλεύοις ἢ ὁ παιδοτρίβης;","english":"Now if the Athenians were deliberating with whom they should wrestle at close quarters and with whom at arm’s length, and in what way, would you give better advice, or the wrestling trainer{15}?","g":{"c":["ἀκροχειρίζεσθαι","“spar at arm’s length,” from ἄκρος (tip) + χείρ (hand): fighting with the hands’ ends, as opposed to close grappling (προσπαλαίειν). χείρ gives *chiro-practic*."]},"c":{"15":["ὁ παιδοτρίβης","Literally “boy-rubber,” the gymnastic trainer of Athenian boys. Socrates builds his argument from the crafts Alcibiades actually studied: every art has its own standard of “better,” and the question is what standard governs politics."]},"turn":true},{"steph":"107e","speaker":"Ἀλκιβιάδης","greek":"ὁ παιδοτρίβης δήπου.","english":"The trainer, surely.","g":{},"c":{},"turn":true},{"steph":"107e","speaker":"Σωκράτης","greek":"ἔχεις οὖν εἰπεῖν πρὸς τί ⟨ἂν⟩ βλέπων ὁ παιδοτρίβης συμβουλεύσειεν οἷς δεῖ προσπαλαίειν καὶ οἷς μή, καὶ ὁπότε καὶ ὅντινα τρόπον; λέγω δὲ τὸ τοιόνδε· ἆρα τούτοις δεῖ προσπαλαίειν οἷς βέλτιον, ἢ οὔ;","english":"Can you say, then, what the trainer would have in view when he advised with whom one should wrestle and with whom not, and when, and in what way? I mean something like this: should one wrestle with those whom it is better to, or not?","g":{},"c":{},"turn":true},{"steph":"107e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Σωκράτης","greek":"ἆρα καὶ τοσαῦτα ὅσα ἄμεινον;","english":"And as much as is better?","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Ἀλκιβιάδης","greek":"τοσαῦτα.","english":"As much.","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Σωκράτης","greek":"οὐκοῦν καὶ τότε ὅτε ἄμεινον;","english":"And at the time when it is better?","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Σωκράτης","greek":"ἀλλὰ μὴν καὶ ᾁδοντα δεῖ κιθαρίζειν ποτὲ πρὸς τὴν ᾠδὴν καὶ βαίνειν;","english":"And again, a singer must sometimes play the lyre to accompany the song, and step in time?","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Ἀλκιβιάδης","greek":"δεῖ γάρ.","english":"He must.","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Σωκράτης","greek":"οὐκοῦν τότε ὁπότε βέλτιον;","english":"And at the time when it is better?","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Σωκράτης","greek":"καὶ τοσαῦθ᾽ ὅσα βέλτιον;","english":"And as much as is better?","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Ἀλκιβιάδης","greek":"φημί.","english":"I agree.","g":{},"c":{},"turn":true},{"steph":"108a","speaker":"Σωκράτης","greek":"τί οὖν; ἐπειδὴ βέλτιον μὲν ὠνόμαζες ἐπ᾽ ἀμφοτέροις, |108b| τῷ τε κιθαρίζειν πρὸς τὴν ᾠδὴν καὶ τῷ προσπαλαίειν, τί καλεῖς τὸ ἐν τῷ κιθαρίζειν βέλτιον, ὥσπερ ἐγὼ τὸ ἐν τῷ παλαίειν καλῶ γυμναστικόν· σὺ δ᾽ ἐκεῖνο τί καλεῖς;","english":"What then? Since you used the word ‘better’ in both cases, of playing the lyre to the song and of wrestling, what do you call the better in lyre-playing, as I call the better in wrestling ‘gymnastic’{16}? What do you call that?","g":{},"c":{"16":["γυμναστικόν","From γυμνός, naked, since Greek athletes trained unclothed; hence *gymnasium*. Socrates is teaching a method: name the art, and the art names its own standard."]},"turn":true},{"steph":"108b","speaker":"Ἀλκιβιάδης","greek":"οὐκ ἐννοῶ.","english":"I cannot think.","g":{},"c":{},"turn":true},{"steph":"108b","speaker":"Σωκράτης","greek":"ἀλλὰ πειρῶ ἐμὲ μιμεῖσθαι. ἐγὼ γάρ που ἀπεκρινάμην τὸ διὰ παντὸς ὀρθῶς ἔχον, ὀρθῶς δὲ δήπου ἔχει τὸ κατὰ τὴν τέχνην γιγνόμενον· ἢ οὔ;","english":"Then try to imitate me. My answer, I think, was ‘what is right in every case’; and what is done according to the art is surely done rightly. Or not?","g":{},"c":{},"turn":true},{"steph":"108b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"108b","speaker":"Σωκράτης","greek":"ἡ δὲ τέχνη οὐ γυμναστικὴ ἦν;","english":"And the art was gymnastics, was it not?","g":{},"c":{},"turn":true},{"steph":"108b","speaker":"Ἀλκιβιάδης","greek":"πῶς δ᾽ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"108c","speaker":"Σωκράτης","greek":"ἐγὼ δ᾽ εἶπον τὸ ἐν τῷ παλαίειν βέλτιον γυμναστικόν.","english":"And I said that the better in wrestling was the gymnastic.","g":{},"c":{},"turn":true},{"steph":"108c","speaker":"Ἀλκιβιάδης","greek":"εἶπες γάρ.","english":"So you did.","g":{},"c":{},"turn":true},{"steph":"108c","speaker":"Σωκράτης","greek":"οὐκοῦν καλῶς;","english":"And was I not right?","g":{},"c":{},"turn":true},{"steph":"108c","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγε δοκεῖ.","english":"I think so.","g":{},"c":{},"turn":true},{"steph":"108c","speaker":"Σωκράτης","greek":"ἴθι δὴ καὶ σύ—πρέποι γὰρ ἄν που καὶ σοὶ τὸ καλῶς διαλέγεσθαι—εἰπὲ πρῶτον τίς ἡ τέχνη ἧς τὸ κιθαρίζειν καὶ τὸ ᾁδειν καὶ τὸ ἐμβαίνειν ὀρθῶς; συνάπασα τίς καλεῖται; οὔπω δύνασαι εἰπεῖν;","english":"Come then, you too (for it would surely suit you as well to argue well): say first, what is the art to which lyre-playing and singing and stepping rightly belong? What is it called as a whole? Can you not say yet?","g":{},"c":{},"turn":true},{"steph":"108c","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"No, I cannot.","g":{},"c":{},"turn":true},{"steph":"108c","speaker":"Σωκράτης","greek":"ἀλλ᾽ ὧδε πειρῶ· τίνες αἱ θεαὶ ὧν ἡ τέχνη;","english":"Then try this way. Who are the goddesses whose art it is?","g":{},"c":{},"turn":true},{"steph":"108c","speaker":"Ἀλκιβιάδης","greek":"τὰς μούσας, ὦ Σώκρατες, λέγεις;","english":"You mean the Muses, Socrates?","g":{},"c":{},"turn":true},{"steph":"108d","speaker":"Σωκράτης","greek":"ἔγωγε. ὅρα δή· τίνα ἀπ᾽ αὐτῶν ἐπωνυμίαν ἡ τέχνη ἔχει;","english":"I do. Now look: what name does the art take from them?","g":{},"c":{},"turn":true},{"steph":"108d","speaker":"Ἀλκιβιάδης","greek":"μουσικήν μοι δοκεῖς λέγειν.","english":"Music, I think you mean{17}.","g":{},"c":{"17":["μουσικήν","μουσική is the art of the Muses, wider than our “music”: song, poetry, dance and lyre together. The etymology argument is typical Socratic play: the name of the art is found by asking whose art it is."]},"turn":true},{"steph":"108d","speaker":"Σωκράτης","greek":"λέγω γάρ. τί οὖν τὸ κατὰ ταύτην ὀρθῶς γιγνόμενόν ἐστιν; ὥσπερ ἐκεῖ ἐγώ σοι τὸ κατὰ τὴν τέχνην ἔλεγον ὀρθῶς, τὴν γυμναστικήν, καὶ σὺ δὴ οὖν οὕτως ἐνταῦθα τί φῄς; πῶς γίγνεσθαι;","english":"I do. Then what is done rightly according to this art? As I told you before that what is right according to the art is gymnastic, so what do you say here? How does it come about?","g":{},"c":{},"turn":true},{"steph":"108d","speaker":"Ἀλκιβιάδης","greek":"μουσικῶς μοι δοκεῖ.","english":"Musically, I think.","g":{},"c":{},"turn":true},{"steph":"108d","speaker":"Σωκράτης","greek":"εὖ λέγεις. ἴθι δή, καὶ τὸ ἐν τῷ πολεμεῖν βέλτιον καὶ τὸ ἐν τῷ εἰρήνην ἄγειν, τοῦτο τὸ βέλτιον τί |108e| ὀνομάζεις; ὥσπερ ἐκεῖ ἐφ᾽ ἑκάστῳ ἔλεγες τὸ ἄμεινον, ὅτι μουσικώτερον καὶ ἐπὶ τῷ ἑτέρῳ, ὅτι γυμναστικώτερον· πειρῶ δὴ καὶ ἐνταῦθα λέγειν τὸ βέλτιον.","english":"Well said. Come then, what do you call the better in making war and the better in keeping peace? As there you said that the better in each case was the more musical, and in the other the more gymnastic, try to name the better here as well.","g":{},"c":{},"turn":true},{"steph":"108e","speaker":"Ἀλκιβιάδης","greek":"ἀλλ᾽ οὐ πάνυ τι ἔχω.","english":"But I cannot at all.","g":{},"c":{},"turn":true},{"steph":"108e","speaker":"Σωκράτης","greek":"ἀλλὰ μέντοι αἰσχρόν γε εἰ μέν τις σε λέγοντα καὶ συμβουλεύοντα περὶ σιτίων ὅτι βέλτιον τόδε τοῦδε καὶ νῦν καὶ τοσοῦτον, ἔπειτα ἐρωτήσειεν τί τὸ ἄμεινον λέγεις, ὦ Ἀλκιβιάδη; περὶ μὲν τούτων ἔχειν εἰπεῖν ὅτι τὸ ὑγιεινότερον, καίτοι οὐ προσποιῇ{a} γε ἰατρὸς εἶναι· περὶ δὲ οὗ |109a| προσποιῇ ἐπιστήμων εἶναι καὶ συμβουλεύσεις ἀνιστάμενος ὡς εἰδώς, τούτου δ᾽, ὡς ἔοικας, πέρι ἐρωτηθεὶς ἐὰν μὴ ἔχῃς εἰπεῖν, οὐκ αἰσχύνῃ; ἢ οὐκ αἰσχρὸν φανεῖται;","english":"And yet it would be shameful if, when you were speaking and advising about food, that this is better than that, and now, and in this amount, someone then asked, ‘What do you mean by better, Alcibiades?’, you could tell him in those matters that it is the healthier, though you do not even claim to be a doctor; but on a subject in which you claim to be an expert and on which you will stand up and advise as one who knows, if you are asked about it and cannot answer, are you not ashamed? Will it not look shameful?","g":{"a":["προσποιῇ","2nd sing. present middle of προσποιέομαι, “claim, pretend to be.”"]},"c":{},"turn":true},{"steph":"109a","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Very much so.","g":{},"c":{},"turn":true},{"steph":"109a","speaker":"Σωκράτης","greek":"σκόπει δὴ καὶ προθυμοῦ εἰπεῖν πρὸς τί τείνει τὸ ἐν τῷ εἰρήνην τε ἄγειν ἄμεινον καὶ τὸ ἐν τῷ πολεμεῖν οἷς δεῖ;","english":"Then consider, and try hard to say, what the better in keeping peace and in making war on those we should aims at.","g":{},"c":{},"turn":true},{"steph":"109a","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ σκοπῶν οὐ δύναμαι ἐννοῆσαι.","english":"I am considering, but I cannot think of it.","g":{},"c":{},"turn":true},{"steph":"109a","speaker":"Σωκράτης","greek":"οὐδ᾽ οἶσθα, ἐπειδὰν πόλεμον ποιώμεθα, ὅτι ἐγκαλοῦντες ἀλλήλοις πάθημα ἐρχόμεθα εἰς τὸ πολεμεῖν, καὶ ὅτι αὐτὸ ὀνομάζοντες ἐρχόμεθα;","english":"Do you not know that when we make war, we go to war accusing one another of some injury, and naming what it is we suffer{18}?","g":{},"c":{"18":["ἐγκαλοῦντες ἀλλήλοις πάθημα","War begins with a grievance, ἔγκλημα. Socrates draws out of Alcibiades that every grievance is a claim about justice, so the art of war and peace is in the end the art of the just."]},"turn":true},{"steph":"109b","speaker":"Ἀλκιβιάδης","greek":"ἔγωγε, ὅτι γε ἐξαπατώμενοί τι ἢ βιαζόμενοι ἢ ἀποστερούμενοι.","english":"I do: that we are being deceived in some way, or treated with violence, or robbed.","g":{},"c":{},"turn":true},{"steph":"109b","speaker":"Σωκράτης","greek":"ἔχε· πῶς ἕκαστα τούτων πάσχοντες; πειρῶ εἰπεῖν τί διαφέρει τὸ ὧδε ἢ ὧδε.","english":"Stop there. How are we suffering each of these things? Try to say what difference there is between suffering it in this way or in that.","g":{},"c":{},"turn":true},{"steph":"109b","speaker":"Ἀλκιβιάδης","greek":"ἦ τὸ ὧδε λέγεις, ὦ Σώκρατες, τὸ δικαίως ἢ τὸ ἀδίκως{a};","english":"Do you mean by ‘this way or that’, Socrates, justly or unjustly?","g":{"a":["δικαίως ἢ τὸ ἀδίκως","adverbs from δίκαιος, “just,” built on δίκη, “right, lawsuit”; ἀ- privative negates, as in English *a-moral*."]},"c":{},"turn":true},{"steph":"109b","speaker":"Σωκράτης","greek":"αὐτὸ τοῦτο.","english":"That very thing.","g":{},"c":{},"turn":true},{"steph":"109b","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ μὴν τοῦτο γε διαφέρει ὅλον τε καὶ πᾶν.","english":"But that makes all the difference in the world.","g":{},"c":{},"turn":true},{"steph":"109b","speaker":"Σωκράτης","greek":"τί οὖν; Ἀθηναίοις σὺ πρὸς ποτέρους συμβουλεύσεις πολεμεῖν, τοὺς ἀδικοῦντας ἢ τοὺς τὰ δίκαια πράττοντας;","english":"Well then: against which will you advise the Athenians to make war, those who are doing wrong or those who are doing what is just?","g":{},"c":{},"turn":true},{"steph":"109c","speaker":"Ἀλκιβιάδης","greek":"δεινὸν τοῦτό γε ἐρωτᾷς· εἰ γὰρ καὶ διανοεῖταί τις ὡς δεῖ πρὸς τοὺς τὰ δίκαια πράττοντας πολεμεῖν, οὐκ ἂν ὁμολογήσειέν γε.","english":"That is a terrible question. For even if someone thinks one ought to make war on those who act justly, he would never admit it.","g":{},"c":{},"turn":true},{"steph":"109c","speaker":"Σωκράτης","greek":"οὐ γὰρ νόμιμον τοῦθ᾽, ὡς ἔοικεν.","english":"Because that is not lawful, it seems.","g":{},"c":{},"turn":true},{"steph":"109c","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα· οὐδέ γε καλὸν δοκεῖ εἶναι.","english":"No indeed, nor is it thought honorable.","g":{},"c":{},"turn":true},{"steph":"109c","speaker":"Σωκράτης","greek":"πρὸς ταῦτ᾽ ἄρα καὶ σὺ [τὸ δίκαιον] τοὺς λόγους ποιήσῃ;","english":"Then you too will make your speeches with a view to this?","g":{},"c":{},"turn":true},{"steph":"109c","speaker":"Ἀλκιβιάδης","greek":"ἀνάγκη.","english":"Necessarily.","g":{},"c":{},"turn":true},{"steph":"109c","speaker":"Σωκράτης","greek":"ἄλλο τι οὖν, ὃ νυνδὴ ἐγὼ ἠρώτων βέλτιον πρὸς τὸ πολεμεῖν καὶ μή, καὶ οἷς δεῖ καὶ οἷς μή, καὶ ὁπότε καὶ μή, τὸ δικαιότερον τυγχάνει ὄν; ἢ οὔ;","english":"Then is this better that I was just now asking about, in making war or not, on whom and on whom not, and when and when not, anything other than the more just? Or not?","g":{},"c":{},"turn":true},{"steph":"109c","speaker":"Ἀλκιβιάδης","greek":"φαίνεταί γε.","english":"Apparently it is.","g":{},"c":{},"turn":true},{"steph":"109d","speaker":"Σωκράτης","greek":"πῶς οὖν, ὦ φίλε Ἀλκιβιάδη; πότερον σαυτὸν λέληθας{b} ὅτι οὐκ ἐπίστασαι τοῦτο, ἢ ἐμὲ ἔλαθες μανθάνων καὶ φοιτῶν εἰς διδασκάλου ὅς σε ἐδίδασκε διαγιγνώσκειν τὸ δικαιότερόν τε καὶ ἀδικώτερον; καὶ τίς ἐστιν οὗτος; φράσον καὶ ἐμοί, ἵνα αὐτῷ φοιτητὴν προξενήσῃς καὶ ἐμέ.","english":"How is it, then, my dear Alcibiades? Have you failed to notice that you do not know this, or did you escape my notice while learning it and going to some teacher who taught you to tell the more just from the more unjust? And who is he? Tell me too, so that you may introduce me to him as a pupil as well.","g":{"b":["λέληθας","perfect of λανθάνω, “escape notice”: “have you escaped your own notice that you do not know?” λανθάνω shares a root with λήθη, forgetting, as in *Lethe*."]},"c":{},"turn":true},{"steph":"109d","speaker":"Ἀλκιβιάδης","greek":"σκώπτεις, ὦ Σώκρατες.","english":"You are mocking me, Socrates.","g":{},"c":{},"turn":true},{"steph":"109d","speaker":"Σωκράτης","greek":"οὐ μὰ τὸν Φίλιον τὸν ἐμόν τε καὶ σόν, ὃν ἐγὼ ἥκιστ᾽ ἂν ἐπιορκήσαιμι· ἀλλ᾽ εἴπερ ἔχεις, εἰπὲ τίς ἐστιν.","english":"No, by the god of friendship{19}, yours and mine, by whom I would least of all swear falsely. But if you can, tell me who he is.","g":{},"c":{"19":["τὸν Φίλιον","Zeus Philios, Zeus as protector of friendship. Swearing by him signals that Socrates’ inquiry is an act of friendship, not mockery."]},"turn":true},{"steph":"109e","speaker":"Ἀλκιβιάδης","greek":"τί δ᾽ εἰ μὴ ἔχω; οὐκ ἂν οἴει με ἄλλως εἰδέναι περὶ τῶν δικαίων καὶ ἀδίκων;","english":"And what if I cannot? Do you not think I could know about just and unjust things in some other way?","g":{},"c":{},"turn":true},{"steph":"109e","speaker":"Σωκράτης","greek":"ναί, εἴ γε εὕροις.","english":"Yes, if you found it out.","g":{},"c":{},"turn":true},{"steph":"109e","speaker":"Ἀλκιβιάδης","greek":"ἀλλ᾽ οὐκ ἂν εὑρεῖν με ἡγῇ;","english":"And do you think I could not find it out?","g":{},"c":{},"turn":true},{"steph":"109e","speaker":"Σωκράτης","greek":"καὶ μάλα γε, εἰ ζητήσαις.","english":"Very much so, if you looked for it.","g":{},"c":{},"turn":true},{"steph":"109e","speaker":"Ἀλκιβιάδης","greek":"εἶτα ζητῆσαι οὐκ ἂν οἴει με;","english":"And you think I would not look for it?","g":{},"c":{},"turn":true},{"steph":"109e","speaker":"Σωκράτης","greek":"ἔγωγε, εἰ οἰηθείης γε μὴ εἰδέναι.","english":"I do, if you thought you did not know.","g":{},"c":{},"turn":true},{"steph":"109e","speaker":"Ἀλκιβιάδης","greek":"εἶτα οὐκ ἦν ὅτ᾽ εἶχον οὕτω;","english":"And was there not a time when I was in that state?","g":{},"c":{},"turn":true},{"steph":"109e","speaker":"Σωκράτης","greek":"καλῶς λέγεις. ἔχεις οὖν εἰπεῖν τοῦτον τὸν χρόνον |110a| ὅτε οὐκ ᾤου εἰδέναι τὰ δίκαια καὶ τὰ ἄδικα; φέρε, πέρυσιν ἐζήτεις τε καὶ οὐκ ᾤου εἰδέναι; ἢ ᾤου; καὶ τἀληθῆ ἀποκρίνου, ἵνα μὴ μάτην οἱ διάλογοι γίγνωνται.","english":"Well said. Can you tell me, then, the time when you did not think you knew what is just and what is unjust? Come: last year were you looking for it, and not thinking you knew? Or did you think you knew? And answer truthfully, so that our conversations are not in vain{20}.","g":{},"c":{"20":["ἵνα μὴ μάτην οἱ διάλογοι γίγνωνται","διάλογος, “conversation through speech,” is the name the genre gives itself. Socrates insists on honest answers because the method works only if the answerer says what he actually believes."]},"turn":true},{"steph":"110a","speaker":"Ἀλκιβιάδης","greek":"ἀλλ᾽ ᾤμην εἰδέναι.","english":"I thought I knew.","g":{},"c":{},"turn":true},{"steph":"110a","speaker":"Σωκράτης","greek":"τρίτον δ᾽ ἔτος καὶ τέταρτον καὶ πέμπτον οὐχ οὕτως;","english":"And two years ago, and three, and four, was it not the same?","g":{},"c":{},"turn":true},{"steph":"110a","speaker":"Ἀλκιβιάδης","greek":"ἔγωγε.","english":"It was.","g":{},"c":{},"turn":true},{"steph":"110a","speaker":"Σωκράτης","greek":"ἀλλὰ μὴν τό γε πρὸ τοῦ παῖς ἦσθα. ἦ γάρ;","english":"But before that you were a child, were you not?","g":{},"c":{},"turn":true},{"steph":"110a","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"110a","speaker":"Σωκράτης","greek":"τότε μὲν τοίνυν εὖ οἶδα ὅτι ᾤου εἰδέναι.","english":"And then, I know well, you thought you knew.","g":{},"c":{},"turn":true},{"steph":"110a","speaker":"Ἀλκιβιάδης","greek":"πῶς εὖ οἶσθα;","english":"How do you know it well?","g":{},"c":{},"turn":true},{"steph":"110b","speaker":"Σωκράτης","greek":"πολλάκις σοῦ ἐν διδασκάλων ἤκουον παιδὸς ὄντος καὶ ἄλλοθι, καὶ ὁπότε ἀστραγαλίζοις{a} ἢ ἄλλην τινὰ παιδιὰν παίζοις, οὐχ ὡς ἀποροῦντος περὶ τῶν δικαίων καὶ ἀδίκων, ἀλλὰ μάλα μέγα καὶ θαρραλέως λέγοντος περὶ ὅτου τύχοις τῶν παίδων ὡς πονηρός τε καὶ ἄδικος εἴη καὶ ὡς ἀδικοῖ· ἢ οὐκ ἀληθῆ λέγω;","english":"I often heard you, when you were a boy, at your teachers’ and elsewhere, and when you were playing knucklebones or some other game, speaking not as one at a loss about what is just and unjust but very loudly and boldly about whichever boy it happened to be, that he was a bad and unjust boy and was cheating. Or am I not telling the truth?","g":{"a":["ἀστραγαλίζοις","optative of repeated past action, “whenever you played knucklebones” (ἀστράγαλοι, sheep’s ankle bones used as dice; hence *astragalus*, the ankle bone)."]},"c":{},"turn":true},{"steph":"110b","speaker":"Ἀλκιβιάδης","greek":"ἀλλὰ τί ἔμελλον ποιεῖν, ὦ Σώκρατες, ὁπότε τίς με ἀδικοῖ;","english":"But what was I to do, Socrates, when someone cheated me?","g":{},"c":{},"turn":true},{"steph":"110b","speaker":"Σωκράτης","greek":"σὺ δ᾽ εἰ τύχοις ἀγνοῶν εἴτ᾽ ἀδικοῖο εἴτε μὴ τότε, λέγεις, τί σε χρὴ ποιεῖν;","english":"And if you happened not to know, at the time, whether you were being wronged or not, you ask what you ought to do?","g":{},"c":{},"turn":true},{"steph":"110c","speaker":"Ἀλκιβιάδης","greek":"μὰ Δί᾽ ἀλλ᾽ οὐκ ἠγνόουν ἔγωγε, ἀλλὰ σαφῶς ἐγίγνωσκον ὅτι ἠδικούμην.","english":"By Zeus, but I was not ignorant; I knew clearly that I was being wronged.","g":{},"c":{},"turn":true},{"steph":"110c","speaker":"Σωκράτης","greek":"ὤιου{b} ἄρα ἐπίστασθαι καὶ παῖς ὤν, ὡς ἔοικε, τὰ δίκαια καὶ τὰ ἄδικα.","english":"So even as a child, it seems, you thought you knew what is just and what is unjust.","g":{"b":["ὤιου","imperfect of οἴομαι, “you thought.” The whole argument turns on the gap between οἴεσθαι εἰδέναι, thinking one knows, and εἰδέναι, knowing."]},"c":{},"turn":true},{"steph":"110c","speaker":"Ἀλκιβιάδης","greek":"ἔγωγε· καὶ ἠπιστάμην γε.","english":"I did; and I did know.","g":{},"c":{},"turn":true},{"steph":"110c","speaker":"Σωκράτης","greek":"ἐν ποίῳ χρόνῳ ἐξευρών; οὐ γὰρ δήπου ἐν ᾧ γε ᾤου εἰδέναι.","english":"At what time did you find it out? Surely not at a time when you thought you knew.","g":{},"c":{},"turn":true},{"steph":"110c","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"110c","speaker":"Σωκράτης","greek":"πότε οὖν ἀγνοεῖν ἡγοῦ; σκόπει· οὐ γὰρ εὑρήσεις τοῦτον τὸν χρόνον.","english":"When, then, did you believe you were ignorant? Consider: you will not find that time.","g":{},"c":{},"turn":true},{"steph":"110c","speaker":"Ἀλκιβιάδης","greek":"μὰ τὸν Δί᾽, ὦ Σώκρατες, οὔκουν ἔχω γ᾽ εἰπεῖν.","english":"By Zeus, Socrates, I cannot say.","g":{},"c":{},"turn":true},{"steph":"110d","speaker":"Σωκράτης","greek":"εὑρὼν μὲν ἄρ᾽ οὐκ οἶσθα αὐτά.","english":"Then you do not know these things by having found them out.","g":{},"c":{},"turn":true},{"steph":"110d","speaker":"Ἀλκιβιάδης","greek":"οὐ πάνυ φαίνομαι.","english":"It does not look at all as if I do.","g":{},"c":{},"turn":true},{"steph":"110d","speaker":"Σωκράτης","greek":"ἀλλὰ μὴν ἄρτι γε οὐδὲ μαθὼν ἔφησθα εἰδέναι· εἰ δὲ μήθ᾽ ηὗρες μήτ᾽ ἔμαθες, πῶς οἶσθα καὶ πόθεν;","english":"But just now you said you did not know them by having learned them either. And if you neither found them out nor learned them, how do you know, and from where?","g":{},"c":{},"turn":true},{"steph":"110d","speaker":"Ἀλκιβιάδης","greek":"ἀλλ᾽ ἴσως τοῦτό σοι οὐκ ὀρθῶς ἀπεκρινάμην, τὸ φάναι εἰδέναι αὐτὸς ἐξευρών.","english":"But perhaps I did not answer you correctly in saying that I knew by finding out for myself.","g":{},"c":{},"turn":true},{"steph":"110d","speaker":"Σωκράτης","greek":"τὸ δὲ πῶς εἶχεν;","english":"Then how was it?","g":{},"c":{},"turn":true},{"steph":"110d","speaker":"Ἀλκιβιάδης","greek":"ἔμαθον οἶμαι καὶ ἐγὼ ὥσπερ καὶ οἱ ἄλλοι.","english":"I learned, I suppose, just like everyone else.","g":{},"c":{},"turn":true},{"steph":"110d","speaker":"Σωκράτης","greek":"πάλιν εἰς τὸν αὐτὸν ἥκομεν λόγον. παρὰ τοῦ; φράζε κἀμοί.","english":"We are back at the same argument. From whom? Tell me too.","g":{},"c":{},"turn":true},{"steph":"110e","speaker":"Ἀλκιβιάδης","greek":"παρὰ τῶν πολλῶν.","english":"From the many.","g":{},"c":{},"turn":true},{"steph":"110e","speaker":"Σωκράτης","greek":"οὐκ εἰς σπουδαίους γε διδασκάλους καταφεύγεις εἰς τοὺς πολλοὺς ἀναφέρων.","english":"Those are hardly serious teachers you take refuge in, appealing to the many.","g":{},"c":{},"turn":true},{"steph":"110e","speaker":"Ἀλκιβιάδης","greek":"τί δέ; οὐχ ἱκανοὶ διδάξαι οὗτοι;","english":"Why? Are they not competent to teach?","g":{},"c":{},"turn":true},{"steph":"110e","speaker":"Σωκράτης","greek":"οὔκουν τὰ πεττευτικά γε καὶ τὰ μή· καίτοι φαυλότερα αὐτὰ οἶμαι τῶν δικαίων εἶναι. τί δέ; σὺ οὐχ οὕτως οἴει;","english":"Not even to teach what is a good move at draughts{21} and what is not; and yet that, I think, is a slighter matter than justice. What, do you not think so?","g":{},"c":{"21":["τὰ πεττευτικά","πεττεία was a board game played with pebbles (πεσσοί), something like draughts. If the crowd cannot agree even on a game’s moves, they can hardly teach justice."]},"turn":true},{"steph":"110e","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"110e","speaker":"Σωκράτης","greek":"εἶτα τὰ μὲν φαυλότερα οὐχ οἷοί τε διδάσκειν, τὰ δὲ σπουδαιότερα;","english":"Then they cannot teach the slighter things, but can teach the more serious?","g":{},"c":{},"turn":true},{"steph":"110e","speaker":"Ἀλκιβιάδης","greek":"οἶμαι ἔγωγε· ἄλλα γοῦν πολλὰ οἷοί τ᾽ εἰσὶν διδάσκειν σπουδαιότερα τοῦ πεττεύειν.","english":"I think so. At any rate there are many other things they can teach that are more serious than draughts.","g":{},"c":{},"turn":true},{"steph":"110e","speaker":"Σωκράτης","greek":"ποῖα ταῦτα;","english":"What sort of things?","g":{},"c":{},"turn":true},{"steph":"111a","speaker":"Ἀλκιβιάδης","greek":"οἷον καὶ τὸ ἑλληνίζειν παρὰ τούτων ἔγωγ᾽ ἔμαθον, καὶ οὐκ ἂν ἔχοιμι εἰπεῖν ἐμαυτοῦ διδάσκαλον, ἀλλ᾽ εἰς τοὺς αὐτοὺς ἀναφέρω οὓς σὺ φῂς οὐ σπουδαίους εἶναι διδασκάλους.","english":"For example, I learned to speak Greek{22} from them, and I could not name my teacher; I give the credit to the same people you say are not serious teachers.","g":{},"c":{"22":["τὸ ἑλληνίζειν","“To Hellenize,” to speak Greek correctly. Socrates grants that the many teach language well, because on the meaning of “stone” or “wood” they agree. Agreement is the mark of knowledge; disagreement is the mark of its absence."]},"turn":true},{"steph":"111a","speaker":"Σωκράτης","greek":"ἀλλ᾽, ὦ γενναῖε, τούτου μὲν ἀγαθοὶ διδάσκαλοι οἱ πολλοί, καὶ δικαίως ἐπαινοῖντ᾽ ἂν αὐτῶν εἰς διδασκαλίαν.","english":"But, my noble friend, of that the many are good teachers, and they would rightly be praised for their teaching of it.","g":{},"c":{},"turn":true},{"steph":"111a","speaker":"Ἀλκιβιάδης","greek":"τί δή;","english":"Why?","g":{},"c":{},"turn":true},{"steph":"111a","speaker":"Σωκράτης","greek":"ὅτι ἔχουσι περὶ αὐτὰ ἃ χρὴ τοὺς ἀγαθοὺς διδασκάλους ἔχειν.","english":"Because in this they have what good teachers must have.","g":{},"c":{},"turn":true},{"steph":"111a","speaker":"Ἀλκιβιάδης","greek":"τί τοῦτο λέγεις;","english":"What do you mean?","g":{},"c":{},"turn":true},{"steph":"111a","speaker":"Σωκράτης","greek":"οὐκ οἶσθ᾽ ὅτι χρὴ τοὺς μέλλοντας διδάσκειν ὁτιοῦν |111b| αὐτοὺς πρῶτον εἰδέναι; ἢ οὔ;","english":"Do you not know that those who are going to teach anything must first know it themselves? Or not?","g":{},"c":{},"turn":true},{"steph":"111b","speaker":"Ἀλκιβιάδης","greek":"πῶς γὰρ οὔ;","english":"Of course.","g":{},"c":{},"turn":true},{"steph":"111b","speaker":"Σωκράτης","greek":"οὐκοῦν τοὺς εἰδότας ὁμολογεῖν τε ἀλλήλοις καὶ μὴ διαφέρεσθαι;","english":"And that those who know agree with one another and do not differ?","g":{},"c":{},"turn":true},{"steph":"111b","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"111b","speaker":"Σωκράτης","greek":"ἐν οἷς δ᾽ ἂν διαφέρωνται, ταῦτα φήσεις εἰδέναι αὐτούς;","english":"And things on which they differ, will you say they know?","g":{},"c":{},"turn":true},{"steph":"111b","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"111b","speaker":"Σωκράτης","greek":"τούτων οὖν διδάσκαλοι πῶς ἂν εἶεν;","english":"Then how could they be teachers of them?","g":{},"c":{},"turn":true},{"steph":"111b","speaker":"Ἀλκιβιάδης","greek":"οὐδαμῶς.","english":"In no way.","g":{},"c":{},"turn":true},{"steph":"111b","speaker":"Σωκράτης","greek":"τί οὖν; δοκοῦσί σοι διαφέρεσθαι οἱ πολλοὶ ποῖόν ἐστι λίθος ἢ ξύλον; καὶ ἐάν τινα ἐρωτᾷς, ἆρ᾽ οὐ τὰ αὐτὰ |111c| ὁμολογοῦσιν, καὶ ἐπὶ ταὐτὰ ὁρμῶσιν ὅταν βούλωνται λαβεῖν λίθον ἢ ξύλον; ὡσαύτως καὶ πάνθ᾽ ὅσα τοιαῦτα· σχεδὸν γάρ τι μανθάνω τὸ ἑλληνίζειν ἐπίστασθαι ὅτι τοῦτο λέγεις· ἢ οὔ;","english":"Well then: do the many seem to you to differ about what a stone is, or a piece of wood? If you ask any of them, do they not agree, and reach for the same things when they want to take a stone or a piece of wood? And likewise with everything of that sort. For I think I understand that this is what you mean by knowing how to speak Greek. Or not?","g":{},"c":{},"turn":true},{"steph":"111c","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"111c","speaker":"Σωκράτης","greek":"οὐκοῦν εἰς μὲν ταῦθ᾽, ὥσπερ εἴπομεν, ἀλλήλοις τε ὁμολογοῦσι καὶ αὐτοὶ ἑαυτοῖς ἰδίᾳ, καὶ δημοσίᾳ αἱ πόλεις πρὸς ἀλλήλας οὐκ ἀμφισβητοῦσιν αἱ μὲν ταῦθ᾽ αἱ δ᾽ ἄλλα φάσκουσαι;","english":"On these things, then, as we said, they agree with one another and each with himself in private; and in public the cities do not dispute with one another, some saying one thing and some another?","g":{},"c":{},"turn":true},{"steph":"111c","speaker":"Ἀλκιβιάδης","greek":"οὐ γάρ.","english":"No.","g":{},"c":{},"turn":true},{"steph":"111c","speaker":"Σωκράτης","greek":"εἰκότως ἂν ἄρα τούτων γε καὶ διδάσκαλοι εἶεν ἀγαθοί.","english":"Then they would naturally be good teachers of these things.","g":{},"c":{},"turn":true},{"steph":"111d","speaker":"Ἀλκιβιάδης","greek":"ναί.","english":"Yes.","g":{},"c":{},"turn":true},{"steph":"111d","speaker":"Σωκράτης","greek":"οὐκοῦν εἰ μὲν βουλοίμεθα ποιῆσαί τινα περὶ αὐτῶν εἰδέναι, ὀρθῶς ἂν αὐτὸν πέμποιμεν εἰς διδασκαλίαν τούτων τῶν πολλῶν;","english":"So if we wanted to make someone know about them, we would be right to send him to be taught by these, the many?","g":{},"c":{},"turn":true},{"steph":"111d","speaker":"Ἀλκιβιάδης","greek":"πάνυ γε.","english":"Certainly.","g":{},"c":{},"turn":true},{"steph":"111d","speaker":"Σωκράτης","greek":"τί δ᾽ εἰ βουληθεῖμεν εἰδέναι, μὴ μόνον ποῖοι ἄνθρωποί εἰσιν ἢ ποῖοι ἵπποι, ἀλλὰ καὶ τίνες αὐτῶν δρομικοί τε καὶ μή, ἆρ᾽ ἔτι οἱ πολλοὶ τοῦτο ἱκανοὶ διδάξαι;","english":"But what if we wanted to know not only what men are like or what horses are like, but also which of them are good runners and which not, would the many still be competent to teach this?","g":{},"c":{},"turn":true},{"steph":"111d","speaker":"Ἀλκιβιάδης","greek":"οὐ δῆτα.","english":"Certainly not.","g":{},"c":{},"turn":true},{"steph":"111d","speaker":"Σωκράτης","greek":"ἱκανὸν δέ σοι τεκμήριον{b} ὅτι οὐκ ἐπίστανται οὐδὲ |111e| κρήγυοι{a} διδάσκαλοί εἰσιν τούτων, ἐπειδὴ οὐδὲν ὁμολογοῦσιν ἑαυτοῖς περὶ αὐτῶν;","english":"And is it sufficient proof to you that they do not know and are not sound teachers of these things, that they agree on nothing about them?","g":{"a":["κρήγυοι","“useful, sound,” a rare poetic word (Homer, *Iliad* 1.106)."],"b":["τεκμήριον","“sure sign, proof,” the word for decisive evidence in Greek argument."]},"c":{},"turn":true},{"steph":"111e","speaker":"Ἀλκιβιάδης","greek":"ἔμοιγ
